<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef3ee"><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1c1a">
<meta name="description" content="Günde 3 dakikalık elektronik dersleri">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Akımlı"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Akımlı</title>
<style>
/* Düzen: ana sayfada her ünite bir baskı devre kartı, dersler bakır yolla bağlı lehim pedleri. Diğer ekranlar sade. */
:root{
  --bg:#eef3ee; --card:#fff; --ink:#12302c; --soft:#4b6661; --line:#c9d6cf;
  --mask:#15564c; --mask2:#0f463e; --silk:#eaf5ee; --copper:#d08a4a; --tin:#c9d4d0;
  --led:#f6b932; --ledink:#2c1f02; --good:#17703f; --goodbg:#dcf1e3; --bad:#b02f1f; --badbg:#fbe4df; --focus:#0b63c4; --sel:#fff1cc; --hi1:#fff1c7; --hi2:#d9ecff; --hot:#d63a22; --cold:#2a62c9; --bdo:.5; --coinink:#5b3413; --term:#a65d1c;
  --disp:"Roboto Condensed","sans-serif-condensed","Avenir Next Condensed","Arial Narrow","Segoe UI",sans-serif;
  --body:Roboto,"Segoe UI",system-ui,sans-serif; --mono:"Roboto Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1c1a; --card:#12302c; --ink:#e4f0ea; --soft:#9bb8b0; --line:#2a4b45;
  --mask:#134c43; --mask2:#0d3a33; --silk:#eaf5ee; --copper:#d9955a; --tin:#b9c6c1;
  --led:#f6b932; --ledink:#2c1f02; --good:#6fd79a; --goodbg:#123d28; --bad:#ff9c8b; --badbg:#46201b; --focus:#8cc4ff; --sel:#4a3c12; --hi1:#3a3110; --hi2:#123049; --hot:#ff7657; --cold:#5ea8ff; --bdo:.72; --coinink:#4a2a0e; --term:#f0b27a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1c1a; --card:#12302c; --ink:#e4f0ea; --soft:#9bb8b0; --line:#2a4b45;
  --mask:#134c43; --mask2:#0d3a33; --silk:#eaf5ee; --copper:#d9955a; --tin:#b9c6c1;
  --led:#f6b932; --ledink:#2c1f02; --good:#6fd79a; --goodbg:#123d28; --bad:#ff9c8b; --badbg:#46201b; --focus:#8cc4ff; --sel:#4a3c12; --hi1:#3a3110; --hi2:#123049; --hot:#ff7657; --cold:#5ea8ff; --bdo:.72; --coinink:#4a2a0e; --term:#f0b27a; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button{user-select:none;-webkit-user-select:none;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1:focus{outline:none}
h1,h2{font-family:var(--disp);line-height:1.2;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:26px}
h2{font-size:20px}
p{margin:0}
sub{font-size:.72em;line-height:0}
#app{--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));max-width:520px;margin:0 auto;
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:16px;min-width:0}

/* Alt gezinme */
nav{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-top:1px solid var(--line);
  margin-inline:calc(-1*var(--gl)) calc(-1*var(--gr));padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--soft);position:relative}
nav button[aria-current]{color:var(--ink);font-weight:700}
nav button[aria-current]::before{content:"";position:absolute;top:-1px;width:44px;height:3px;background:var(--copper)}
nav button:focus-visible{outline-offset:-4px}
nav svg{width:24px;height:24px}
nav b{position:absolute;top:5px;left:calc(50% + 8px);min-width:20px;border-radius:10px;padding:0 5px;background:var(--bad);color:var(--bg);font-size:12px;line-height:20px;text-align:center}

/* Durum şeridi */
.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;align-items:center}
.stat span{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span+span{justify-content:flex-end}
.stat svg{width:22px;height:22px;flex:none}
.goal{grid-column:1/-1;font-size:14px;color:var(--soft);display:flex;flex-direction:column;gap:4px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--led);border-radius:5px;transition:width .3s}
.hello{display:flex;align-items:center;gap:12px}
/* Günlük görevler kartı */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.coin{width:22px;height:22px;flex:none}
.qst{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:12px}
.qst header{display:flex;align-items:center;gap:8px}
.qst h2{flex:1;font-size:18px}
.qst .jt{display:flex;align-items:center;gap:6px;font:700 18px var(--disp);font-variant-numeric:tabular-nums}
.qst ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.qst li{display:grid;grid-template-columns:24px 1fr auto;gap:5px 10px;align-items:center}
.qst .ck{grid-row:1/3;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.qst .ck svg{width:14px;height:14px}
.qst li.ok .ck{background:var(--good);border-color:var(--good);color:var(--card)}
.qst li p{margin:0;font-size:15px;line-height:1.3;min-width:0}
.qst li.ok p{color:var(--soft)}
.qst .bar{height:8px;grid-column:2}
.qst li output{font:700 14px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.qst .rw{grid-column:3;display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:13px;color:var(--soft)}
.qst .rw .coin{width:15px;height:15px}
.qst li.ok .bar i{background:var(--good)}
.qst .note{margin:0}
/* Hoş geldin: Pırıl uçarak gelir, kanat çırpar, balondan konuşur. */
.hos{justify-content:center;align-items:center;text-align:center}
.hos .pr{width:150px;animation:fly-in .9s cubic-bezier(.2,.8,.3,1.2),bob 2.4s ease-in-out .9s infinite}
.hos .pr .w{transform-box:fill-box;transform-origin:center;animation:flap .18s ease-in-out infinite alternate}
.bubble{font-family:var(--body);font-weight:500;position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:18px;line-height:1.45;max-width:340px;animation:scr-in .3s ease-out .5s both}
.bubble::before{content:"";position:absolute;top:-11px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--line)}
.gbtn{display:flex;justify-content:center;min-height:44px}
.hos .acts{display:grid;gap:12px;width:100%;max-width:340px;animation:scr-in .3s ease-out .7s both}
@keyframes fly-in{from{transform:translate(140px,-220px) rotate(25deg) scale(.5);opacity:0}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes flap{to{transform:scaleY(.35)}}
.hello svg{width:84px;flex:none}
.hello div{min-width:0}
.hello p{color:var(--soft)}

/* Ünite kartı */
.pcb{background:var(--mask);color:var(--silk);border-radius:14px;padding:16px;box-shadow:inset 0 0 0 2px var(--mask2);min-width:0}
.pcb header{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.pcb header b{font:700 14px var(--mono);border:1.5px solid currentColor;padding:0 6px;border-radius:2px}
.pcb header h2{flex:1;min-width:0}
.pcb header small{font:13px var(--mono)}
.road{position:relative}
.road>svg{position:absolute;left:0;top:0;width:150px;pointer-events:none}
.node{display:flex;align-items:center;gap:14px;width:100%;height:96px;text-align:left;color:inherit;position:relative;border-radius:10px}
.node:nth-of-type(even){padding-left:56px}
.node:focus-visible{outline-color:#fff;outline-offset:-3px}
.pad{width:64px;height:64px;border-radius:50%;background:var(--copper);display:grid;place-items:center;flex:none;transition:transform .1s ease-out,box-shadow .1s ease-out;box-shadow:0 4px 0 color-mix(in oklch,var(--copper) 60%,#000)}
.node:active:not([disabled]) .pad{transform:translateY(4px);box-shadow:0 0 0 color-mix(in oklch,var(--copper) 60%,#000)}
/* Dokununca pedin LED'i yanar, sonra ders açılır. */
.node.zap .pad i{animation:zap .32s ease-out forwards}
.node.zap .pad{animation:halo .32s ease-out forwards}
@keyframes zap{40%{background:var(--led);color:var(--ledink);transform:scale(1.25)}100%{background:var(--led);color:var(--ledink);transform:scale(1.1)}}
@keyframes halo{100%{box-shadow:0 0 0 6px color-mix(in oklch,var(--led) 55%,transparent),0 0 28px 14px color-mix(in oklch,var(--led) 45%,transparent)}}
.pad i{width:34px;height:34px;border-radius:50%;background:var(--mask2);display:grid;place-items:center;font:700 16px var(--mono);color:var(--silk)}
.node.done .pad{background:var(--tin)}
.node.done .pad i{background:var(--led);color:var(--ledink)}
.node.next .pad{box-shadow:0 0 0 5px var(--mask),0 0 0 8px var(--led)}
.node[disabled]{cursor:default}
.node[disabled] .pad{background:rgba(255,255,255,.3)}
.node em{font-style:normal;min-width:0}
.node strong{display:block;font-size:17px;line-height:1.25}
.node small{font-size:14px}

/* Ders */
.top{display:flex;align-items:center;gap:8px}
.top .bar{flex:1}
.top output{font:14px var(--mono);color:var(--soft)}
.x{width:44px;height:44px;margin-left:-10px;display:grid;place-items:center;flex:none;border-radius:8px}
.x svg{width:24px;height:24px}
.kind{font:13px var(--mono);color:var(--soft)}
.q{font-family:var(--body);font-size:20px;font-weight:600;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{width:100%;min-height:54px;padding:10px 14px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;display:flex;gap:12px;align-items:center;font-size:17px;transition:transform .08s ease-out,box-shadow .08s ease-out;box-shadow:0 3px 0 var(--line)}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.opt[aria-pressed=true]{border-color:var(--copper);background:var(--sel)}
.opt.good{border-color:var(--good);background:var(--goodbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt>span{min-width:0}
.opt kbd{font:700 15px var(--mono);width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.opt[aria-pressed=true] kbd{background:var(--led);border-color:var(--led);color:var(--ledink)}
.fig{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.fig svg{display:block;width:100%;max-width:400px;margin:auto;height:auto}
.ckt{color:var(--ink);font-family:var(--body);font-size:14px}
.ckt .ln{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ckt .fl{fill:currentColor}
.ckt text{fill:currentColor}
.ckt text.me{fill:var(--bad);font-weight:700;font-family:var(--mono);font-size:13px}
.ckt .hit{fill:transparent;stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4}
.ckt .part{cursor:pointer;outline:none}
.ckt .part:focus-visible .hit{stroke:var(--focus);stroke-width:3;stroke-dasharray:none}
.ckt .part[aria-checked=true] .hit{fill:var(--led);fill-opacity:.28;stroke:var(--copper);stroke-dasharray:none;stroke-width:2.5}
.ckt .part.good .hit{fill:var(--good);fill-opacity:.2;stroke:var(--good);stroke-dasharray:none}
.ckt .part.bad .hit{fill:var(--bad);fill-opacity:.2;stroke:var(--bad);stroke-dasharray:none}
.ckt .flow{pointer-events:none}
.ckt .bd{fill:none;stroke-linecap:round;stroke-opacity:var(--bdo)}
.ckt .ch{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ckt .sp{font:700 20px var(--mono)}
.ckt .sp.hot{fill:var(--hot)}
.ckt .sp.cold{fill:var(--cold)}
.flg{display:flex;gap:8px;align-items:baseline;margin:6px 4px 0;font-size:13px;line-height:1.35;color:var(--soft)}
.flg i{flex:none;width:28px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--hot),var(--cold))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.akb{align-self:flex-start;min-height:44px;padding:0 16px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-weight:700}
.akb[aria-pressed=true]{border-color:var(--copper);background:var(--sel)}
.ipc{display:grid;gap:6px;margin-top:8px}
.ipb{justify-self:start;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px 0 10px;border:2px solid var(--line);border-radius:22px;background:var(--card);font-weight:700;font-size:15px}
.ipb svg{width:20px;height:20px;flex:none}
.ipb small{font:600 13px var(--mono);color:var(--soft)}
.ipb[aria-expanded=true]{border-color:var(--copper)}
#ipt{padding:8px 12px;border-left:4px solid var(--led);border-radius:8px;background:var(--hi1);font-size:15px;line-height:1.45}
#ipt:empty,#ipt[hidden]{display:none}
#ipt p{margin:0}
#ipt p+p{margin-top:6px}
#ipt code{font:14px var(--mono);overflow-wrap:anywhere}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prb{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.prb button{padding:0 16px}
.seg button,.prb button{min-height:48px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-weight:700}
.seg button[aria-pressed=true]{border-color:var(--copper);background:var(--sel)}
.dmm{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;min-height:64px;padding:10px 14px;border-radius:10px;background:var(--mask2);color:var(--silk);font:14px var(--mono);box-shadow:inset 0 0 0 2px var(--mask)}
.dmm b{font-size:28px;line-height:1.2;color:var(--led);font-variant-numeric:tabular-nums;margin-right:auto}
.num{display:flex;gap:10px;align-items:center}
.num input{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:56px;font:700 24px var(--mono);padding:0 14px;background:var(--card);border:2px solid var(--line);border-radius:10px}
.num b{font:700 20px var(--mono)}
.note{font-size:14px;color:var(--soft)}
.note.err,.note .err{color:var(--bad);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots button{min-height:52px;padding:4px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;line-height:1.25}
.slots button[aria-pressed=true]{border-color:var(--copper);background:var(--sel)}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pal button{min-height:62px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:8px;min-width:0}
.pal i{width:40px;height:34px;border-radius:6px;border:1.5px solid var(--soft)}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 12px}
.sl b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sl input{grid-column:1/-1;width:100%;height:44px;margin:0;accent-color:var(--copper)}
.pred{display:grid;gap:10px}
.read{display:flex;gap:8px 28px;flex-wrap:wrap}
.read div{font-size:14px;color:var(--soft)}
.read b{display:block;font:700 24px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
/* Konu anlatımı */
.kart{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.kart>p:not(.kind){font-size:17px;line-height:1.55}
.frm{display:grid;gap:4px;padding:10px 12px;border-radius:8px;background:var(--bg);border-left:4px solid var(--copper)}
.frm code{font:15px/1.5 var(--mono);overflow-wrap:anywhere}
.kart .fig{background:var(--bg)}
.real{display:grid;gap:4px;padding:12px 14px;border-radius:10px;background:linear-gradient(120deg,var(--hi1),var(--hi2))}
.real b{font:700 14px var(--disp)}
.sol ol{margin:0;padding-left:22px;display:grid;gap:8px;font-size:16px;line-height:1.5}

/* Alt eylem ve geri bildirim */
.foot{position:sticky;bottom:var(--kb,0px);z-index:5;display:grid;gap:10px;background:var(--bg);border-top:1px solid var(--line);margin-inline:calc(-1*var(--gl)) calc(-1*var(--gr));
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot.good{background:var(--goodbg)}
.foot.bad{background:var(--badbg)}
.btn{width:100%;min-height:52px;border-radius:10px;background:var(--led);color:var(--ledink);font-weight:700;font-size:17px;padding:8px 16px;transition:transform .08s ease-out,box-shadow .08s ease-out;box-shadow:0 4px 0 color-mix(in oklch,var(--led) 55%,#000)}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:none}
.btn[disabled]{background:var(--line);color:var(--soft);cursor:default;box-shadow:none}
.btn.alt{background:var(--card);border:2px solid var(--line);color:var(--ink);box-shadow:0 4px 0 var(--line)}
/* Geri bildirim aşağıdan kayarak gelir; doğruda maskot kıvılcım saçar, yanlışta çubuk sarsılır. */
.foot.good,.foot.bad{animation:rise .24s ease-out}
.foot.bad .fb{animation:shake .36s ease-in-out .1s}
.fb>svg{overflow:visible}
.spark{animation:spark .6s ease-out forwards;opacity:0}
@keyframes rise{from{transform:translateY(24px);opacity:.4}}
/* Her doğruda kısa tebrik: şimşekli yazı yukarı süzülür. */
.cheer{position:fixed;left:50%;bottom:calc(190px + env(safe-area-inset-bottom,0px));z-index:30;pointer-events:none;display:flex;align-items:center;gap:6px;
  padding:8px 16px 8px 10px;border-radius:999px;background:var(--led);color:var(--ledink);font:800 20px var(--disp);box-shadow:0 6px 18px color-mix(in oklch,var(--led) 45%,transparent);
  animation:cheer 1.3s cubic-bezier(.2,.9,.3,1.3) forwards}
.cheer svg{width:26px;height:26px;animation:zip .5s ease-out}
@keyframes cheer{0%{transform:translate(-50%,30px) scale(.4);opacity:0}18%{transform:translate(-50%,0) scale(1.08);opacity:1}30%{transform:translate(-50%,0) scale(1)}75%{opacity:1}100%{transform:translate(-50%,-46px) scale(.95);opacity:0}}
@keyframes zip{0%{transform:rotate(-30deg) scale(0)}60%{transform:rotate(10deg) scale(1.3)}}
/* 3 doğru arka arkaya: tam ekran kutlama (dokunmayı engellemez). */
.party{position:fixed;inset:0;z-index:40;pointer-events:none;display:grid;place-items:center;overflow:hidden;animation:pfade 2.6s ease-in-out forwards;
  background:radial-gradient(circle at 50% 42%,color-mix(in oklch,var(--led) 38%,transparent),transparent 62%)}
.party .pp{display:grid;justify-items:center;gap:10px;text-align:center;transform:translateY(-6vh)}
.party .pr2{width:170px;position:relative;animation:pdance 2.4s cubic-bezier(.3,1.4,.5,1) forwards}
.party .pr2 svg{width:100%;overflow:visible}
.party .pr2 .w{transform-box:fill-box;transform-origin:center;animation:flap .12s ease-in-out infinite alternate}
.party .ring{position:absolute;left:50%;top:62%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:4px solid var(--led);animation:ring 1.2s ease-out infinite}
.party .ring+.ring{animation-delay:.4s}.party .ring+.ring+.ring{animation-delay:.8s}

// Tip sonundaki "-" elemanı ters çevirir.

const put = (el, x1, y1, x2, y2) => {
  const [type, name, value = '', meas = '', side] = el;
  return [type, x1, y1, x2, y2, name + (value ? '\n' + value : '') + (meas ? '|' + meas : ''), name, side];
};

// Seri çevrim: kaynak solda, son eleman sağda, kalanlar üstte.
function loop(v, els) {
  const top = els.slice(0, -1), last = els[els.length - 1], step = 240 / (top.length || 1);
  return [
    ['V', 40, 180, 40, 40, v, 'Kaynak'],
    ...(top.length ? top.map((e, i) => put(e, 40 + i * step, 40, 40 + (i + 1) * step, 40)) : [['W', 40, 40, 280, 40]]),
    put(last, 280, 40, 280, 180),
    ['W', 280, 180, 40, 180]
  ];
}

// Paralel kollar: her kol yukarıdan aşağı 1 veya 2 eleman.
function par(v, branches) {
  const gap = branches.length > 2 ? 80 : 110, xs = branches.map((_, i) => 40 + gap * (i + 1));
  const end = xs[xs.length - 1];
  return [
    ['V', 40, 180, 40, 40, v, 'Kaynak'],
    ['W', 40, 40, end, 40], ['W', 40, 180, end, 180],
    ...branches.flatMap((b, i) => b.map((e, j) => put(e, xs[i], 40 + j * 140 / b.length, xs[i], 40 + (j + 1) * 140 / b.length))),
    ...xs.slice(0, -1).flatMap(x => [['N', x, 40], ['N', x, 180]])
  ];
}

    { name: 'Gerilim ve güç', k: [

  { name: 'Ohm yasası', lessons: [
    { name: 'V = I·R', k: [

      { h: 'Birim kısayolu: V, mA, kΩ', p: 'Elektronikte akım çoğu zaman mA, direnç kΩ\'dur. V, mA ve kΩ birlikte kullanılınca 1000\'ler birbirini götürür. Direnç Ω ise akımı A bulursun; mA için 1000 ile çarp.',
        f: ['V = mA × kΩ', 'mA = V / kΩ', 'kΩ = V / mA', 'Örnek: 5 V / 2,2 kΩ = 2,27 mA'],

      { h: 'I–V grafiği', p: 'Direncin I–V grafiği orijinden geçen bir doğrudur. Dikey eksende I, yatayda V varsa eğim 1/R olur; buna iletkenlik denir. Dik doğru küçük direnç, yatık doğru büyük direnç demektir.',
        f: ['G = ΔI / ΔV = 1 / R   (birimi S, siemens)'] },
      { h: 'Nerede bozulur?', p: 'Ohm yasası direnci sabit kalan elemanlar için geçerlidir. Ampul teli ısındıkça direnci artar; LED ve diyotta akım gerilimle doğrusal artmaz.',
        r: 'Gerçek hayatta: 12 V\'ta 2 A çeken araç ampulünün sıcak direnci 6 Ω\'dur. Soğukken direnci çok daha küçük olduğu için açıldığı an daha büyük akım çeker.' }
    ], qs: [
      { t: 'num', q: '470 Ω direnç 12 V\'a bağlanıyor. Akım kaç mA?', c: loop('12 V', [['R', 'R', '470 Ω']]), a: 12 / 470 * 1000, u: 'mA',
        e: 'Akım, gerilimin dirence oranıdır.', f: 'I = V / R = 12 / 470 = 25,5 mA' },

    { name: 'Direnç renk kodları', k: [
      { h: 'Bantları okuma', p: 'Dört bantlı dirençte ilk iki bant rakam, üçüncü bant çarpandır: rakamların arkasına kaç sıfır ekleneceğini söyler. Dördüncü bant (altın, gümüş) toleranstır; okumaya onun uzağındaki uçtan başla.',
        f: ['R = (1. rakam)(2. rakam) × 10ⁿ   (n: 3. bant)', 'kırmızı-kırmızı-turuncu → 22 × 10³ = 22 kΩ'] },

      { h: 'Dikkat: çarpan sıfır sayısıdır', p: 'Turuncu çarpan 3 sıfır, sarı çarpan 4 sıfır ekler. Sonucu kΩ\'a çevirmek için 1000\'e böl: 47 × 10⁴ = 470 000 Ω = 470 kΩ, 47 kΩ değil.',
        r: 'Gerçek hayatta: Bantlar soluksa multimetrenin Ω kademesiyle ölç. Direnci iki ucundan parmaklarınla tutma; vücudun paralel girer, büyük değerlerde ölçüm küçülür.' }
    ], qs: [
      { t: 'oku', q: 'Bu direncin değeri kaç kΩ?', b: ['kahverengi', 'siyah', 'kırmızı', 'altın'], a: 1, u: 'kΩ',

    { name: 'Güç ve LED direnci', k: [

        r: 'Gerçek hayatta: 12 V LED şeritlerde üç LED bir dirençle seri gruplanır; direnç her grubun üzerinde hazır gelir.' },
      { h: 'Dikkat: V_F\'yi çıkar, yönü kontrol et', p: 'En sık hata, kaynağın tamamını dirence yazmaktır; önce LED gerilimini çıkar. LED\'in uzun bacağı (anot) + tarafa gelir. Ters takılırsa akım geçmez ve kaynak geriliminin tamamı LED\'in uçlarında görünür.' }

        e: 'Dirençte kaynağın tamamı değil, 5 − 2 = 3 V düşer.', f: 'I = (5 − 2) / 220 = 13,6 mA' },
      { t: 'sim', sim: 'led', q: 'LED\'i 15 mA ile sür (±1 mA). V_F = 2 V.',

  { name: 'Seri ve paralel devreler', lessons: [
    { name: 'Seri devre', k: [
      { h: 'Tek yol, tek akım', p: 'Seri devrede akımın gidebileceği tek bir yol vardır, bu yüzden her elemandan aynı akım geçer. Dirençler arka arkaya eklenmiş dar boru parçaları gibidir: toplam zorluk toplanır.',
        f: ['R_eş = R1 + R2 + R3', 'I = V / R_eş', 'Örnek: 9 V / (1 + 2) kΩ = 3 mA'],
        c: loop('9 V', [['R', 'R1', '1 kΩ'], ['R', 'R2', '2 kΩ']]) },
      { h: 'Gerilim paylaşılır', p: 'Kaynak gerilimi dirençlere, dirençlerle orantılı paylaşılır: büyük direnç büyük pay alır. Çevrimdeki düşümlerin toplamı kaynağa eşittir; buna Kirchhoff gerilim yasası (KVL) denir.',
        f: ['V_k = V · R_k / R_eş', 'V = V1 + V2 + V3', 'Örnek: V1 = 3 mA × 1 kΩ = 3 V, V2 = 3 mA × 2 kΩ = 6 V'],
        sim: 'bolucu',
        r: 'Gerçek hayatta: Potansiyometre (ses düğmesi) ayarlanabilir bir gerilim bölücüdür.' },
      { h: 'Dikkat: kopuk eleman', p: 'Seri devrede bir eleman koparsa akım her yerde sıfır olur. Sağlam dirençlerde I·R = 0 olduğu için gerilim düşmez; kaynağın tamamı kopuk yerin uçlarında görünür.',
        r: 'Gerçek hayatta: Seri bağlı eski yılbaşı ampullerinde tek ampul patlayınca bütün dizi söner.' }

      { t: 'num', q: '1 kΩ, 2,2 kΩ ve 4,7 kΩ seri bağlı. Eşdeğer direnç kaç kΩ?', a: 7.9, u: 'kΩ',

      { t: 'num', q: 'R2 üzerindeki gerilim kaç V?', c: loop('12 V', [['R', 'R1', '1 kΩ'], ['R', 'R2', '2 kΩ']]), a: 8, u: 'V',
        e: 'Gerilim, dirençlerle doğru orantılı bölünür.', f: 'V₂ = 12 × 2 / (1 + 2) = 8 V' },
      { t: 'mc', q: 'Seri bağlı elemanlarda hangisi ortaktır?', o: ['Akım', 'Gerilim', 'Güç', 'Direnç'], a: 0,
        e: 'Tek yol olduğu için her elemandan aynı akım geçer.', f: 'I₁ = I₂ = I₃' },
      { t: 'sim', sim: 'bolucu', q: 'Gerilim bölücünün çıkışını 5 V yap (±0,1 V). Giriş 12 V.',
        e: 'Çıkış, R2\'nin toplam dirençteki payına bağlıdır. 5 V için R2 / (R1 + R2) = 5/12 olmalı.', f: 'V_çıkış = 12 × R2 / (R1 + R2), örneğin R1 = 7 kΩ, R2 = 5 kΩ' },
      { t: 'ariza', q: 'Dirençlerin her biri 1 kΩ. Ölçülen gerilimlere göre arızalı dirence dokun.', c: loop('12 V', [['R', 'R1', '', '0 V'], ['R', 'R2', '', '12 V'], ['R', 'R3', '', '0 V']]), fl: null, a: 'R2',
        e: 'R2 açık devre. Akım akmadığı için sağlam dirençlerde gerilim düşmez, kaynağın tamamı kopuk yerde görünür.', f: 'I = 0 → V₁ = V₃ = 0, V₂ = 12 V' },
      { t: 'num', q: '9 V kaynağa seri bağlı üç elemanın ikisinde 2,5 V ve 3 V düşüyor. Üçüncüde kaç V düşer?', a: 3.5, u: 'V',

    { name: 'Paralel devre', k: [
      { h: 'Aynı iki düğüm, aynı gerilim', p: 'Paralel elemanların uçları aynı iki düğüme bağlıdır, bu yüzden hepsinin gerilimi aynıdır. Her kol kendi akımını I = V / R ile çeker; küçük direnç büyük akım çeker.',

        c: par('12 V', [[['R', 'R1', '2 kΩ']], [['R', 'R2', '3 kΩ']]]) },
      { h: 'Akımlar toplanır', p: 'Düğüme giren akım, çıkan akımların toplamına eşittir (Kirchhoff akım yasası, KCL). Her yeni kol akıma yeni bir yol açar, bu yüzden eşdeğer direnç en küçük koldan da küçük olur.',
        f: ['I = I1 + I2 + I3', '1 / R_eş = 1 / R1 + 1 / R2 + …', 'İki direnç: R_eş = R1·R2 / (R1 + R2)', 'n eşit direnç: R_eş = R / n', 'Örnek: 2 ∥ 3 = 6 / 5 = 1,2 kΩ → 12 V / 1,2 kΩ = 10 mA = 6 + 4'] },
      { h: 'Evdeki prizler paraleldir', p: 'Evdeki bütün cihazlar aynı 230 V\'u görür; biri kapanınca diğerleri çalışmaya devam eder. Ama açılan her cihaz hattan çekilen toplam akımı artırır.',
        r: 'Gerçek hayatta: Aynı uzatmaya takılı 2000 W kettle (≈ 8,7 A) ve 1500 W ütü (≈ 6,5 A) birlikte ≈ 15 A çeker; 16 A\'lik sigortanın sınırına gelinir.' },
      { h: 'Dikkat: paralelde toplama yok', p: 'Paralel dirençleri doğrudan toplamak en sık hatadır: 1 kΩ ∥ 1 kΩ = 500 Ω, 2 kΩ değil. Sonuç her zaman en küçük dirençten küçük çıkmalı; çıkmıyorsa hesabı kontrol et.' }
    ], qs: [
      { t: 'num', q: '6 kΩ ile 3 kΩ paralel bağlı. Eşdeğer direnç kaç kΩ?', a: 2, u: 'kΩ',
        e: 'İki paralel direnç için çarpım bölü toplam kullanılır.', f: 'R = 6·3 / (6 + 3) = 2 kΩ' },
      { t: 'mc', q: 'Paralel bağlı elemanlarda hangisi ortaktır?', o: ['Gerilim', 'Akım', 'Güç', 'Direnç'], a: 0,
        e: 'Elemanların uçları aynı iki düğüme bağlıdır.', f: 'V₁ = V₂ = V₃' },
      { t: 'num', q: 'Bir düğüme 50 mA giriyor. Çıkan üç koldan ikisinde 20 mA ve 12 mA var. Üçüncü kol kaç mA?', a: 18, u: 'mA',
        e: 'Kirchhoff akım yasası: düğüme giren akım çıkana eşittir.', f: 'I₃ = 50 − 20 − 12 = 18 mA' },
      { t: 'num', q: 'Kaynaktan çekilen toplam akım kaç mA?', c: par('12 V', [[['R', 'R1', '4 kΩ']], [['R', 'R2', '6 kΩ']], [['R', 'R3', '12 kΩ']]]), a: 6, u: 'mA',
        e: 'Her kolda 12 V var. Kol akımlarını bul ve topla.', f: 'I = 12/4 + 12/6 + 12/12 = 3 + 2 + 1 = 6 mA' },
      { t: 'ariza', q: 'Her direnç 1 kΩ, kol akımları ölçüldü. Arızalı dirence dokun.', c: par('12 V', [[['R', 'R1', '', '12 mA']], [['R', 'R2', '', '0 mA']], [['R', 'R3', '', '12 mA']]]), fl: [{ p: [[40, 40], [120, 40]], v: [12, 12], i: 24 }, { p: [[120, 40], [120, 180]], v: [12, 0], i: 12 }, { p: [[120, 40], [280, 40], [280, 180], [120, 180]], v: [12, 12, 0, 0], i: 12 }, { p: [[120, 180], [40, 180]], v: [0, 0], i: 24 }], a: 'R2',
        e: 'Paralel kolda kopan direnç yalnızca kendi akımını keser, diğer kollar çalışmaya devam eder.', f: 'Beklenen I = 12 V / 1 kΩ = 12 mA, R2\'de 0 mA' },
      { t: 'mc', q: 'Dört adet 1 kΩ direnç paralel bağlanırsa eşdeğer direnç kaç Ω olur?', o: ['250 Ω', '4000 Ω', '500 Ω', '1000 Ω'], a: 0,
        e: 'n adet eşit paralel direncin eşdeğeri R/n\'dir.', f: 'R = 1000 / 4 = 250 Ω' } ] },
    { name: 'Karışık devreler', k: [
      { h: 'Adım adım sadeleştir', p: 'Önce içteki paralel ya da seri grubu tek dirence indir, devre tek dirence inene kadar sürdür. Kaynak akımını bulunca aynı yoldan geri dönüp her bloğun gerilimini ve her kolun akımını hesapla.',
        f: ['R_eş = 2 + (3 ∥ 6) = 2 + 2 = 4 kΩ', 'I = 12 / 4 = 3 mA → V_blok = 3 mA × 2 kΩ = 6 V', 'I2 = 6 / 3 = 2 mA, I3 = 6 / 6 = 1 mA'],
        c: [['V', 40, 180, 40, 40, '12 V', 'Kaynak'], put(['R', 'R1', '2 kΩ'], 40, 40, 160, 40), put(['R', 'R2', '3 kΩ'], 160, 40, 160, 180),
          ['W', 160, 40, 250, 40], put(['R', 'R3', '6 kΩ'], 250, 40, 250, 180), ['W', 40, 180, 250, 180], ['N', 160, 40], ['N', 160, 180]] },
      { h: 'Akım bölücü', p: 'Paralel iki kola ayrılan akım, dirençlerle ters orantılı paylaşılır: büyük akım küçük dirençten geçer. Bir kolun akımını bulurken pay kısmına karşı kolun direnci yazılır.',
        f: ['I1 = I · R2 / (R1 + R2)', 'Örnek: 3 mA, 3 kΩ ∥ 6 kΩ → I(3 kΩ) = 3 × 6 / 9 = 2 mA'] },
      { h: 'Thévenin: dışarıdan bakış', p: 'İki ucundan bakılan her doğrusal devre, bir gerilim kaynağı ile ona seri bir dirence indirgenebilir. V_Th uçlar açıkken ölçülen gerilimdir. R_Th, kaynak kısa devre edilince uçlardan görülen dirençtir.',
        f: ['V_Th = açık uç gerilimi', 'R_Th = kaynak tel yapılınca görülen direnç'],
        r: 'Gerçek hayatta: Pilin iç direnci aslında Thévenin direncidir; yük ağırlaştıkça R_Th\'de daha çok gerilim kaybolur, uç gerilimi düşer.' },
      { h: 'Dikkat: seri mi, paralel mi?', p: 'İki direnç ancak aralarında başka bir kola ayrılma (düğüm) yoksa seridir. Paralel olmaları için iki ucunun da aynı iki düğüme bağlı olması gerekir. Emin değilsen düğümleri işaretle, sonra karar ver.' }
    ], qs: [
      { t: 'num', q: 'Kaynağın gördüğü eşdeğer direnç kaç kΩ?', c: KARMA, a: 2, u: 'kΩ',
        e: 'Önce paralel R2 ve R3\'ü tek dirence indir, sonra R1 ile topla.', f: 'R = 1 + (2 ∥ 2) = 1 + 1 = 2 kΩ' },
      { t: 'num', q: 'R2 direncinden geçen akım kaç mA?', c: KARMA, a: 2.5, u: 'mA',
        e: 'Toplam akım 5 mA. R2 ve R3 eşit olduğu için akım ikiye bölünür.', f: 'I = 10 / 2 kΩ = 5 mA → I₂ = 2,5 mA' },
      { t: 'sira', q: 'Seri-paralel devrede kol akımını bulma adımlarını sırala.', o: ['Paralel kolları tek dirence indir', 'Seri dirençlerle toplayıp eşdeğeri bul', 'Kaynak akımını I = V / R_eş ile bul', 'Paralel bloğun gerilimini hesapla', 'Kol akımını blok gerilimi / kol direnci ile bul'],
        e: 'Önce devreyi küçült, kaynak akımını bul, sonra geri açarak kollara in.', f: 'R_eş → I → V_blok → I_kol' },
      { t: 'mc', q: '9 mA, paralel 1 kΩ ve 2 kΩ dirençlere bölünüyor. 1 kΩ\'dan kaç mA geçer?', o: ['6 mA', '3 mA', '4,5 mA', '9 mA'], a: 0,
        e: 'Akım bölücüde büyük akım küçük dirençten geçer.', f: 'I₁ = 9 × 2 / (1 + 2) = 6 mA' },
      { t: 'num', q: 'a–b uçlarının Thévenin gerilimi kaç V?', c: THEVENIN, a: 4, u: 'V',
        e: 'Uçlar açıkken V_Th, R2 üzerindeki bölücü gerilimidir.', f: 'V_Th = 12 × 3 / (6 + 3) = 4 V' },
      { t: 'num', q: 'a–b uçlarının Thévenin direnci kaç kΩ?', fl: null, c: THEVENIN, a: 2, u: 'kΩ',
        e: 'Gerilim kaynağını kısa devre et. R1 ve R2 paralel kalır.', f: 'R_Th = 6 ∥ 3 = 2 kΩ' } ] } ] },

  { name: 'Kondansatör ve RC', lessons: [
    { name: 'Kondansatör', k: [
      { h: 'Bir yük deposu', p: 'Kondansatör, araları yalıtkanla ayrılmış iki levhadır ve su deposu gibi yük biriktirir. Gerilim su seviyesi, yük (Q) depodaki su, sığa (C) deponun genişliğidir. Depo dolup gerilim sabitlenince akış durur: DC\'de uzun süre sonra kondansatör açık devre gibidir.',
        f: ['i = C·dv/dt → v sabitse i = 0'] },
      { h: 'Yük ve enerji', p: 'Q coulomb, C farad, V volt cinsindendir; µF × V çarpımı µC verir. Enerji gerilimin karesiyle büyür: gerilim iki katına çıkarsa enerji dört katına çıkar.',
        f: ['Q = C·V', 'W = ½·C·V²', '1 µF = 10⁻⁶ F, 1 nF = 10⁻⁹ F, 1 pF = 10⁻¹² F'],
        r: 'Gerçek hayatta: fotoğraf makinesi flaşı 100 µF\'lık kondansatörü yaklaşık 300 V\'a doldurur ve ½·C·V² ≈ 4,5 J enerjiyi milisaniyeler içinde lambaya boşaltır.' },
      { h: 'Seri ve paralel', p: 'Paralel bağlamak levha alanını büyütür, sığalar toplanır. Seride sığa küçülür, en küçüğünden bile küçük olur ve paralel direnç gibi hesaplanır. Kurallar dirençlerin tam tersidir.',
        f: ['Paralel: C = C1 + C2', 'Seri: C = C1·C2 / (C1 + C2)'],
        c: par('12 V', [[['C', 'C1', '47 µF']], [['C', 'C2', '100 µF']]]) },
      { h: 'Dikkat: kod ve birim', p: 'Seramik kondansatördeki üç rakamlı kod pF cinsindendir: ilk iki rakam değer, üçüncüsü eklenecek sıfır sayısıdır. Hesaba başlamadan µF ve nF\'ı farada çevir, enerjide ½ çarpanını unutma.',
        f: ['472 → 47·10² pF = 4,7 nF', '221 → 22·10¹ pF = 220 pF'] } ], qs: [
      { t: 'num', q: '100 µF kondansatör 12 V ile dolduruluyor. Depolanan yük kaç mC?', a: 1.2, u: 'mC',
        e: 'Yük, sığa ile gerilimin çarpımıdır.', f: 'Q = C·V = 100 µF × 12 V = 1200 µC = 1,2 mC' },
      { t: 'num', q: '1000 µF kondansatör 10 V\'a dolu. Depolanan enerji kaç mJ?', a: 50, u: 'mJ',
        e: 'Enerji gerilimin karesiyle artar. ½ çarpanını unutma.', f: 'W = ½·C·V² = 0,5 × 10⁻³ × 100 = 50 mJ' },
      { t: 'mc', q: 'DC devrede uzun süre sonra kondansatör nasıl davranır?', o: ['Açık devre gibi', 'Kısa devre gibi', '1 kΩ direnç gibi', 'Gerilim üreteci gibi sürekli akım verir'], a: 0,
        e: 'Gerilim sabitlenince dv/dt = 0 olur ve akım kesilir.', f: 'i = C·dv/dt = 0' },
      { t: 'num', q: '10 µF ve 22 µF paralel bağlı. Eşdeğer sığa kaç µF?', a: 32, u: 'µF',
        e: 'Paralel kondansatörlerin sığaları toplanır. Dirençlerin tersidir.', f: 'C = 10 + 22 = 32 µF' },
      { t: 'num', q: '6 µF ve 3 µF seri bağlı. Eşdeğer sığa kaç µF?', a: 2, u: 'µF',
        e: 'Seri kondansatörler paralel dirençler gibi hesaplanır.', f: 'C = 6·3 / (6 + 3) = 2 µF' },
      { t: 'mc', q: 'Üzerinde "104" yazan seramik kondansatörün değeri nedir?', o: ['100 nF', '10 nF', '104 pF', '1 µF'], a: 0,
        e: 'İlk iki rakam değer, üçüncü rakam pF cinsinden 10\'un kuvvetidir.', f: '10 × 10⁴ pF = 100 000 pF = 100 nF' } ] },
    { name: 'RC dolma', k: [
      { h: 'Depo hortumla dolar', p: 'Kondansatör bir direnç üzerinden dolarken başta boştur ve akım en büyüktür. Doldukça kaynakla arasındaki fark küçülür, akım ve dolma hızı azalır. Bu yüzden eğri önce dik yükselir, sonra yataylaşır.',
        c: loop('9 V', [['S', 'Anahtar'], ['R', 'R', '22 kΩ'], ['C', 'C', '47 µF']]), fl: [{ p: [[40, 40], [160, 40], [280, 40], [280, 180], [40, 180]], v: [9, 9, 0, 0, 0], i: 0.409 }] },
      { h: 'Zaman sabiti τ', p: 'τ = R·C eğrinin hızını belirler; R ohm, C farad ise τ saniyedir. Kısa yol: kΩ × µF = ms. Her τ\'da kalan farkın %63\'ü kapanır, 5τ sonunda kondansatör dolmuş sayılır.',
        f: ['τ = R·C', 'V_C(t) = V·(1 − e^(−t/τ))', 't = τ → %63   t = 3τ → %95   t = 5τ → %99\'dan fazla'], sim: 'rc',
        r: 'Gerçek hayatta: mikrodenetleyicinin RESET ucundaki 10 kΩ ve 100 nF, açılışta τ = 1 ms\'lik gecikme verir; besleme oturana kadar işlemci bekler.' },
      { h: 'Dikkat: dolunca ne görülür?', p: 'Sağlam kondansatör dolunca akım durur: gerilimin tamamı C\'de, R üzerinde 0 V kalır. V_C kaynağa yaklaşır ama onu geçemez. Ölçümler buna uymuyorsa hangi elemanın açık ya da kısa devre olunca bu gerilimleri vereceğini düşün.' } ], qs: [
      { t: 'num', q: 'Devrenin zaman sabiti kaç saniye?', c: loop('5 V', [['S', 'Anahtar'], ['R', 'R', '10 kΩ'], ['C', 'C', '100 µF']]), fl: [{ p: [[40, 40], [160, 40], [280, 40], [280, 180], [40, 180]], v: [5, 5, 0, 0, 0], i: 0.5 }], a: 1, u: 's',
        e: 'Zaman sabiti, direnç ile sığanın çarpımıdır.', f: 'τ = R·C = 10⁴ × 10⁻⁴ = 1 s' },
      { t: 'num', q: 'Boş kondansatör 5 V kaynaktan R üzerinden doluyor. t = τ anında gerilimi kaç V?', a: 5 * (1 - Math.exp(-1)), u: 'V',
        e: 'Bir zaman sabiti sonunda son değerin %63,2\'sine ulaşılır.', f: 'v = 5 (1 − e⁻¹) = 3,16 V' },
      { t: 'mc', q: '5τ sonunda kondansatör son değerinin yaklaşık yüzde kaçına dolar?', o: ['%99,3', '%63,2', '%86,5', '%95,0'], a: 0,
        e: 'Pratikte 5τ sonunda kondansatör dolmuş kabul edilir.', f: '1 − e⁻⁵ = 0,993' },
      { t: 'sim', sim: 'rc', q: 'R ve C\'yi ayarla, zaman sabitini 0,5 s yap (±0,02 s).',
        e: 'R veya C büyüdükçe eğri yavaşlar. kΩ × µF = ms.', f: 'τ = R·C, örneğin 10 kΩ × 50 µF = 500 ms' },
      { t: 'num', q: 'Boş 1 µF kondansatör, 1 kΩ üzerinden 10 V\'a bağlanıyor. t = 2 ms\'de gerilimi kaç V?', a: 10 * (1 - Math.exp(-2)), u: 'V',
        e: 'τ = 1 ms olduğu için t = 2τ\'dur.', f: 'v = 10 (1 − e⁻²) = 8,65 V' },
      { t: 'ariza', q: 'Devre uzun süredir enerjili ve kondansatör dolmuş olmalıydı. Arızalı elemana dokun.', c: loop('9 V', [['R', 'R', '10 kΩ', '9 V'], ['C', 'C', '10 µF', '0 V']]), fl: [{ p: [[40, 40], [280, 40], [280, 180], [40, 180]], v: [9, 0, 0, 0], i: 0.9 }], a: 'C',
        e: 'Sağlam kondansatör uzun süre sonra 9 V\'a dolar ve R üzerinde 0 V kalır. Sürekli akım ve 0 V, kondansatörün kısa devre olduğunu gösterir.', f: 'Beklenen: V_C = 9 V, V_R = 0 V' } ] },
    { name: 'Boşalma ve zamanlama', k: [
      { h: 'Dolu depo boşalır', p: 'Dolu kondansatör bir dirence bağlanınca küçük bir pil gibi akım verir. Gerilim düştükçe akım da düşer, bu yüzden boşalma da üsteldir ve giderek yavaşlar. Her τ\'da gerilim o andaki değerin %37\'sine iner.',
        f: ['V_C(t) = V_0·e^(−t/τ)', 't = τ → %36,8 kalır', 'e^(−t/τ) = 0,5 → t = τ·ln 2 ≈ 0,693·τ'],
        c: [['C', 40, 180, 40, 40, 'C\n10 µF', 'C'], put(['S', 'Anahtar'], 40, 40, 160, 40), ['W', 160, 40, 280, 40], put(['R', 'R', '47 kΩ'], 280, 40, 280, 180), ['W', 280, 180, 40, 180]], fl: [{ p: [[40, 40], [160, 40], [280, 40], [280, 180], [40, 180]], v: [12, 12, 12, 0, 0], i: 0.255 }] },
      { h: 'Gerilim sıçramaz', p: 'Kondansatör gerilimi aniden değişemez; anahtarlamadan hemen sonra önceki değerinde kalır. Bu yüzden boş kondansatör ilk anda kısa devre, uzun süre sonra açık devre gibidir. Her geçici durumu başlangıç, son değer ve τ ile tek formülle çözersin.',
        f: ['v_C(0⁺) = v_C(0⁻)', 'v(t) = v(∞) + [v(0⁺) − v(∞)]·e^(−t/τ)'] },
      { h: 'RC filtre', p: 'Aynı R ve C sinyal yolunda alçak geçiren filtre olur: hızlı değişimleri kondansatör yutar, yavaş değişimler geçer. Kesim frekansında çıkış girişin 0,707 katına (−3 dB) iner.',
        f: ['f_c = 1 / (2π·R·C)'],
        r: 'Gerçek hayatta: Arduino\'nun yaklaşık 490 Hz\'lik PWM çıkışı 10 kΩ ve 10 µF ile (f_c ≈ 1,6 Hz) süzülünce neredeyse düz bir DC gerilime döner.' },
      { h: 'Dikkat: birimleri çevir', p: 'τ = R·C\'den R ya da C çekerken önce SI birimine çevir: 22 µF = 22·10⁻⁶ F. Gerilimin yarıya inmesi τ değil, yaklaşık 0,7·τ sürer.',
        f: ['R = τ / C', 'C = τ / R'] } ], qs: [
      { t: 'num', q: '12 V\'a dolu kondansatör R üzerinden boşalıyor. t = τ anında gerilimi kaç V?', a: 12 * Math.exp(-1), u: 'V',
        e: 'Bir zaman sabiti sonunda başlangıç değerinin %36,8\'i kalır.', f: 'v = 12·e⁻¹ = 4,41 V' },
      { t: 'num', q: 'R = 100 kΩ, C = 10 µF. Boşalırken gerilim kaç saniyede yarıya iner?', a: Math.LN2, u: 's',
        e: 'e^(−t/τ) = 0,5 eşitliğinden t = τ·ln 2 çıkar.', f: 't = 0,693·τ = 0,693 × 1 s = 0,693 s' },
      { t: 'sira', q: 'RC geçici durum çözümünün adımlarını sırala.', o: ['Anahtarlamadan önceki v_C(0⁻) değerini bul', 'Süreklilikten v_C(0⁺) = v_C(0⁻) yaz', 'Son değer v_C(∞) ve τ = R_Th·C\'yi bul', 'v(t) = v(∞) + [v(0⁺) − v(∞)]·e^(−t/τ) yaz', 'İstenen t değerini yerine koy'],
        e: 'Kondansatör gerilimi aniden değişemez, bu yüzden başlangıç koşulu önce bulunur.', f: 'v(t) = v(∞) + [v(0⁺) − v(∞)]·e^(−t/τ)' },
      { t: 'mc', q: 'Boş kondansatör, anahtar kapandığı ilk anda (t = 0⁺) nasıl davranır?', o: ['Kısa devre gibi', 'Açık devre gibi', 'Sonsuz direnç gibi', 'Ters kutuplu kaynak gibi'], a: 0,
        e: 'Gerilimi aniden değişemez ve 0 V\'ta kalır. 0 V\'luk eleman kısa devre gibidir.', f: 'v_C(0⁺) = v_C(0⁻) = 0 V' },
      { t: 'num', q: 'R = 1 kΩ, C = 100 nF alçak geçiren filtrenin kesim frekansı kaç kHz?', a: 1 / (2 * Math.PI * 1e3 * 1e-7) / 1e3, u: 'kHz',
        e: 'Kesim frekansında çıkış, girişin 0,707 katına (−3 dB) iner.', f: 'f_c = 1 / (2πRC) = 1,59 kHz' },
      { t: 'mc', q: 'C = 47 µF ile τ = 0,47 s elde etmek için R kaç kΩ olmalı?', o: ['10 kΩ', '1 kΩ', '22 kΩ', '100 kΩ'], a: 0,
        e: 'τ = RC bağıntısından R\'yi çek.', f: 'R = τ / C = 0,47 / 47×10⁻⁶ = 10 kΩ' } ] } ] },

  { name: 'Diyot ve transistör', lessons: [
    { name: 'Diyot', k: [
      { h: 'Tek yönlü vana', p: 'Diyot akımı yalnız anottan katoda, semboldeki üçgenin gösterdiği yönde geçirir; ters yönde kapalıdır. İleri yönde açılması için küçük bir eşik gerilimi aşılmalıdır. Benzetmenin sınırı: açıkken bile üzerinde akımdan neredeyse bağımsız sabit bir gerilim düşer.',
        f: ['Si: V_D ≈ 0,7 V', 'Schottky: V_D ≈ 0,3 V', 'Kırmızı LED: V_D ≈ 2 V'] },
      { h: 'Sabit gerilim modeli', p: 'İletimdeki diyotu 0,7 V\'luk küçük bir pil gibi düşün. Kaynaktan diyot düşümünü çıkar, kalan gerilimi dirence uygula ve akımı Ohm yasasıyla bul.',
        f: ['I = (V − V_D) / R'], c: loop('9 V', [['R', 'R', '2,2 kΩ'], ['D', 'D', 'Si']]), fl: [{ p: [[40, 40], [280, 40], [280, 180], [40, 180]], v: [9, 0.7, 0, 0], i: 3.77 }] },

      { h: 'Türev alıcı', p: 'R ile C\'nin yerini değiştir: kondansatör akımı giriş geriliminin değişim hızıyla orantılıdır. Bu akım R_F\'den geçip çıkışta gerilime döner; sabit girişte çıkış sıfırdır. Hızlı gürültüyü de büyüttüğü için pratikte C\'ye seri küçük bir direnç eklenir.',
        f: ['i = C·dV_i/dt', 'V_o = −R_F·C·dV_i/dt'] },
      { h: 'Dikkat: integral alıcı kayar', p: 'DC\'de C açık devredir, ideal integral alıcının DC kazancı sonsuzdur. Op-amp\'in birkaç mV\'luk ofseti bile sürekli integre edilir ve çıkış yavaşça doyuma kayar. C\'ye paralel büyük bir R_F DC kazancını sınırlar; köşe frekansının üstünde devre yine integral alır.',
        f: ['Kayma eğimi = V_ofset / (R·C)', 'A_DC = R_F / R', 'f_köşe = 1 / (2π·R_F·C)'] } ], qs: [
      { t: 'num', q: 'Girişe sabit 2,5 V uygulanıyor. Çıkış eğiminin büyüklüğü kaç V/ms?', c: opInv(['R', 'R', '10 kΩ'], ['C', 'C', '100 nF']), a: 2.5, u: 'V/ms',
        fl: [{ p: [[40, 96], [128, 96], [128, 40], [238, 40], [238, 112], [216, 112]], v: [2.5, 0, 0, -2.5, -2.5, -2.5], i: 0.25 }], // sabit 0,25 mA C'yi doldurur; V_o başladıktan 1 ms sonra
        e: 'Sabit giriş, kondansatöre sabit akım verir; çıkış doğrusal rampa olur.', f: '|dV_o/dt| = V_i / (RC) = 2,5 / 1 ms = 2,5 V/ms' },
      { t: 'num', q: 'İntegral alıcıda R = 4,7 kΩ, C = 100 nF. Girişe ±2 V, 1 kHz kare dalga uygulanıyor. Çıkış üçgeninin tepeden tepeye değeri kaç V?', a: 2 / 4.7e-4 * 0.5e-3, u: 'V',
        e: 'Her yarım periyotta çıkış sabit eğimle bir yöne gider.', f: 'ΔV = (V/RC) × T/2 = (2 / 0,47 ms) × 0,5 ms = 2,13 V' },
      { t: 'num', q: 'Girişe eğimi 4 V/ms olan rampa uygulanıyor. Çıkış geriliminin büyüklüğü kaç V?', c: opInv(['C', 'C', '10 nF'], ['R', 'R_F', '100 kΩ']), a: 4, u: 'V',
        fl: [{ p: [[40, 96], [128, 96], [128, 40], [238, 40], [238, 112], [216, 112]], v: [2, 0, 0, -4, -4, -4], i: 0.04 }], // i = C·dV/dt = 0,04 mA; V_i rampanın 2 V anı
        e: 'Türev alıcıda kondansatör akımı giriş eğimiyle orantılıdır.', f: '|V_o| = R_F·C·dV_i/dt = 1 ms × 4 V/ms = 4 V' },
      { t: 'mc', q: 'Pratik integral alıcıda C\'ye paralel büyük bir direnç neden konur?', o: ['Ofset ve bias akımının çıkışı yavaşça doyuma sürmesini önlemek için', 'Kazancı artırmak için', 'Kondansatörü aşırı gerilimden korumak için', 'Bant genişliğini sonsuz yapmak için'], a: 0,
        e: 'DC\'de ideal integral alıcının kazancı sonsuzdur; küçük bir ofset bile zamanla birikir. Paralel direnç DC kazancı R_F/R ile sınırlar.', f: 'A_DC = R_F / R' },
      { t: 'num', q: 'C = 10 nF\'a paralel R_F = 1 MΩ konmuş. Devre hangi frekansın üstünde integral alıcı gibi davranır (köşe frekansı, Hz)?', a: 1 / (2 * Math.PI * 1e6 * 10e-9), u: 'Hz',
        e: 'Köşenin altında devre eviren yükselteç, üstünde integral alıcıdır.', f: 'f = 1 / (2π R_F C) = 15,9 Hz' },
      { t: 'num', q: 'Girişi topraklanmış integral alıcıda op-amp ofseti 2 mV, R = 100 kΩ, C = 100 nF, doyum 10 V. Çıkış yaklaşık kaç saniyede doyar?', a: 10 / (2e-3 / (100e3 * 100e-9)), u: 's',
        e: 'Ofset gerilimi girişte sabit bir gerilim gibi integre edilir. En kötü durum hesabı budur.', f: 'Eğim = 2 mV / 10 ms = 0,2 V/s → t = 10 / 0,2 = 50 s' } ] } ] },

  { name: 'Geri besleme', lessons: [
    { name: 'Kapalı çevrim kazancı', z: 1, k: [
      { h: 'Termostat gibi düzeltme', p: 'Negatif geri beslemede çıkışın bir kesri (β) ölçülür ve girişten çıkarılır; hata büyüdükçe düzeltme de büyür. Termostat da sıcaklığı ölçer, hedefi geçince ısıtmayı kısar. Sonuç yükseltecin kendi kazancına değil, ölçme oranına bağlı kalır.',
        r: 'Gerçek hayatta: araçtaki hız sabitleyici yokuşta hız düşünce gazı açar; koşullar değişse de hız neredeyse sabit kalır.' },
      { h: 'Kapalı çevrim kazancı', p: 'A yükseltecin açık çevrim kazancı, β çıkışın geri dönen kesridir. Döngüde bir tur atınca görülen Aβ\'ya çevrim kazancı denir. Aβ ≫ 1 olunca A_f ≈ 1/β olur ve A\'nın tam değeri önemini yitirir.',
        f: ['A_f = A / (1 + A·β)', 'Aβ ≫ 1 → A_f ≈ 1 / β', 'Evirmeyen op-amp: β = R1 / (R1 + R_F)'], c: opNon(['R', 'R1', '2,2 kΩ'], ['R', 'R_F', '22 kΩ']),
        fl: [{ p: [[216, 80], [238, 80], [238, 132], [124, 132], [124, 208]], v: [5.5, 5.5, 5.5, 0.5, 0], i: 0.227 }] }, // V_i = 0,5 V varsayılır
      { h: 'Kazanç verip ne alırsın?', p: 'Geri besleme kazancı (1 + Aβ) kat düşürür; karşılığında bant genişliği yaklaşık aynı oranda artar, bozulma ve kazanç değişimleri azalır. Gerilim örnekleyip seri karıştıran tipte (evirmeyen yükselteç) giriş direnci (1 + Aβ) kat artar, çıkış direnci aynı oranda düşer.',
        f: ['A_f·f_H ≈ A·f_p', 'R_if = R_i·(1 + Aβ)', 'R_of = R_o / (1 + Aβ)', 'Analiz: tip → β → Aβ → A_f'] } ], qs: [
      { t: 'num', q: 'Açık çevrim kazancı A = 1000, geri besleme oranı β = 0,1. Kapalı çevrim kazancı kaç?', a: 1000 / 101, u: 'V/V',
        e: 'Çevrim kazancı Aβ büyükken kapalı çevrim kazancı 1/β\'ya yaklaşır.', f: 'A_f = A / (1 + Aβ) = 1000 / 101 = 9,90' },
      { t: 'mc', q: 'Negatif geri besleme kazancı ve bant genişliğini nasıl etkiler?', o: ['Kazanç düşer, bant genişliği artar', 'İkisi de artar', 'İkisi de düşer', 'Kazanç artar, bant genişliği düşer'], a: 0,
        e: 'Tek kutuplu yükselteçte kazanç–bant genişliği çarpımı sabittir; kazançtan verip bant genişliği alırsın.', f: 'A_f · f_H ≈ A · f_p' },
      { t: 'num', q: 'Evirmeyen yükselteçte R1 = 1 kΩ, R_F = 9 kΩ. Geri besleme oranı β kaç?', c: opNon(['R', 'R1', '1 kΩ'], ['R', 'R_F', '9 kΩ']), a: 0.1, u: 'V/V',
        fl: [{ p: [[216, 80], [238, 80], [238, 132], [124, 132], [124, 208]], v: [10, 10, 10, 1, 0], i: 1 }], // V_i = 1 V varsayılır
        e: 'β, çıkışın − girişine geri dönen kesridir.', f: 'β = R1 / (R1 + R_F) = 1 / 10 = 0,1' },
      { t: 'mc', q: 'Aβ çarpımına ne ad verilir?', o: ['Çevrim kazancı', 'Kapalı çevrim kazancı', 'Ortak mod kazancı', 'Geri besleme direnci'], a: 0,
        e: 'Döngüyü bir noktadan kesip bir tur dolaşınca görülen kazançtır. Kararlılık bundan okunur.', f: 'T = Aβ' },
      { t: 'mc', q: 'Gerilim örnekleyip seri karıştıran (seri-şönt) geri besleme giriş ve çıkış direncini nasıl değiştirir?', o: ['Giriş direnci artar, çıkış direnci azalır', 'İkisi de azalır', 'İkisi de artar', 'Giriş azalır, çıkış artar'], a: 0,
        e: 'Evirmeyen op-amp yükselteci bu tiptir. İki direnç de (1 + Aβ) kadar değişir.', f: 'R_if = R_i (1 + Aβ), R_of = R_o / (1 + Aβ)' },
      { t: 'sira', q: 'Geri beslemeli bir yükselteci analiz etme adımlarını sırala.', o: ['Örnekleme ve karıştırma tipini belirle', 'Geri besleme ağından β\'yı hesapla', 'Çevrim kazancı Aβ\'yı bul', 'A_f = A / (1 + Aβ) ile kapalı çevrim kazancını yaz'],
        e: 'Tip, β\'nın hangi büyüklükler arasında tanımlandığını belirler. β olmadan çevrim kazancı, çevrim kazancı olmadan A_f bulunamaz.', f: 'tip → β → Aβ → A_f' } ] },
    { name: 'Bant genişliği ve hatalar', z: 2, k: [
      { h: 'Kazanç–bant genişliği çarpımı', p: 'Op-amp\'in açık çevrim kazancı frekans arttıkça düşer; kazanç ile bant genişliğinin çarpımı (GBW) sabittir. Kazancı 10 yaparsan bant genişliği GBW\'nin onda biri olur. Bu küçük sinyal sınırıdır.',
        f: ['f_H = GBW / A_f'],
        r: 'Gerçek hayatta: kazancı 100 olan bir ses yükseltecinin 20 kHz\'e kadar düz gitmesi için op-amp\'in GBW\'si en az 2 MHz olmalıdır.' },
      { h: 'Eğim hızı: büyük sinyal sınırı', p: 'Çıkış en fazla SR (V/µs) hızıyla değişebilir. Sinüsün en dik yeri sıfır geçişidir ve orada eğim 2π·f·V_p\'dir. Bu değer SR\'yi aşarsa sinüs üçgene döner; büyük genlikte izin verilen frekans düşer.',
        f: ['En büyük eğim = 2π·f·V_p', 'f_max = SR / (2π·V_p)'] },
      { h: 'DC hatalar: ofset ve bias', p: 'Ofset gerilimi + girişe seri küçük bir pil gibidir ve (1 + R_F / R1) ile yükselir. Girişler nA düzeyinde bias akımı da çeker; − girişin akımı R_F\'den geçip çıkışta hata gerilimi yaratır. + girişe R1 ∥ R_F değerinde bir direnç koymak iki girişi dengeler.',
        f: ['V_hata = V_OS·(1 + R_F / R1)', 'V_hata = I_B·R_F  (+ giriş toprakta)', 'R_p = R1 ∥ R_F'] },
      { h: 'Geri besleme duyarsızlaştırır', p: 'A sıcaklıkla ya da üretimde değişse de kapalı çevrim kazancı (1 + Aβ) kat daha az değişir. Bu yüzden kazanç op-amp\'e değil dirençlere bağlıdır.',
        f: ['ΔA_f / A_f = (ΔA / A) / (1 + Aβ)'] } ], qs: [
      { t: 'num', q: 'Op-amp\'in kazanç–bant genişliği çarpımı 1 MHz. Kazancı 20 olan evirmeyen yükseltecin bant genişliği kaç kHz?', a: 50, u: 'kHz',
        e: 'Tek kutuplu op-amp\'te GBW sabittir.', f: 'f_H = GBW / A = 1 MHz / 20 = 50 kHz' },
      { t: 'num', q: 'Eğim hızı (slew rate) 0,5 V/µs. 5 V tepeli sinüs bozulmadan en fazla kaç kHz olabilir?', a: 0.5e6 / (2 * Math.PI * 5) / 1e3, u: 'kHz',
        e: 'Sinüsün en büyük eğimi sıfır geçişindedir: 2πf·V_p.', f: 'f_max = SR / (2π V_p) = 0,5 V/µs / (2π × 5) = 15,9 kHz' },
      { t: 'num', q: 'Açık çevrim kazancı %10 değişiyor ve 1 + Aβ = 100. Küçük değişim yaklaşımıyla kapalı çevrim kazancı yüzde kaç değişir?', a: 0.1, u: '%',
        e: 'Geri besleme, A\'daki değişimi (1 + Aβ) kadar küçültür. Buna duyarsızlaştırma denir.', f: 'ΔA_f/A_f = (ΔA/A) / (1 + Aβ) = 10 / 100 = %0,1' },
      { t: 'num', q: 'Kazancı 101 olan evirmeyen yükselteçte op-amp ofseti 2 mV. Girişi topraklıyken çıkıştaki hata kaç mV?', a: 202, u: 'mV',
        e: 'Ofset, + girişine seri küçük bir kaynak gibidir ve evirmeyen kazançla yükselir.', f: 'V_o = 101 × 2 mV = 202 mV' },
      { t: 'num', q: 'Eviren yükselteçte R_F = 1 MΩ, op-amp bias akımı 100 nA, + giriş doğrudan toprakta. Çıkıştaki hata kaç mV?', a: 100, u: 'mV',
        e: '− girişin bias akımı R_F üzerinden akar.', f: 'V_o = I_B · R_F = 100 nA × 1 MΩ = 100 mV' },
      { t: 'mc', q: 'Bias akımının çıkıştaki etkisini azaltmak için + girişle toprak arasına hangi direnç konur?', o: ['R1 ∥ R_F değerinde bir direnç', 'R1 + R_F değerinde', '1 Ω', 'Sonsuz (açık devre)'], a: 0,
        e: 'İki girişin gördüğü direnç eşitlenince eşit bias akımlarının etkileri birbirini götürür; geriye ofset akımı kalır.', f: 'R_p = R1 ∥ R_F' } ] },
    { name: 'Kararlılık ve Schmitt', z: 3, k: [
      { h: 'Pozitif geri besleme: Schmitt', p: 'Çıkışın bir kesri + girişe verilirse fark büyütülür ve çıkış hemen bir uca (±V_doy) yapışır. Eşik çıkışa bağlı olduğu için yukarı ve aşağı geçiş eşikleri farklıdır; aradaki fark histerezistir. Gürültülü sinyal eşik çevresinde titreşse bile çıkış bir kez değişir.',
        f: ['V_eşik = ±V_doy·R1 / (R1 + R2)', 'Histerezis = 2·V_doy·R1 / (R1 + R2)'], c: opNon(['R', 'R1', '4,7 kΩ'], ['R', 'R2', '47 kΩ'], { flip: 0 }),
        fl: [{ p: [[216, 80], [238, 80], [238, 132], [124, 132], [124, 208]], v: [10, 10, 10, 0.909, 0], i: 0.193 }], // çıkış +V_doy = 10 V durumu
        r: 'Gerçek hayatta: termostat kombiyi 21 °C\'de kapatıp 19 °C\'de açar; histerezis olmasa röle eşik çevresinde sürekli tıklardı.' },
      { h: 'Faz payı', p: 'Negatif geri besleme döngüsünde her kutup faz gecikmesi ekler. Çevrim kazancının 1 (0 dB) olduğu frekansta gecikme 180°\'ye ulaşırsa düzeltme ters döner ve devre salınır. Faz payı bu sınıra kalan mesafedir; 45°\'nin altı aşma ve çınlama getirir.',
        f: ['PM = 180° + ∠Aβ(f_c)', 'Bir kutbun fazı: −arctan(f / f_p)', 'Kapasitif yük yeni kutup ekler: f_p = 1 / (2π·R_o·C_L)'] },
      { h: 'Osilatör: bilerek kararsız', p: 'Salınım için döngüde kazanç tam 1, faz 0° olmalıdır. Wien köprüsü yalnız tek frekansta faz kaydırmaz ve orada sinyali 1/3\'e indirir; bu yüzden yükselteç kazancı 3 olmalıdır.',
        f: ['f = 1 / (2π·R·C)', 'A·β = 3 · 1/3 = 1'] } ], qs: [
      { t: 'num', q: 'Eviren Schmitt tetikleyicide çıkış ±10 V. Histerezis genişliği kaç V?', c: opNon(['R', 'R1', '10 kΩ'], ['R', 'R2', '90 kΩ'], { flip: 0 }), a: 2, u: 'V',
        fl: [{ p: [[216, 80], [238, 80], [238, 132], [124, 132], [124, 208]], v: [10, 10, 10, 1, 0], i: 0.1 }], // çıkış +10 V durumu: V₊ = +1 V eşiği
        e: 'Pozitif geri besleme + girişini çıkışın bir kesrine bağlar. Çıkış durum değiştirince eşik de değişir.', f: 'V_eşik = ±10 × 10 / (10 + 90) = ±1 V → genişlik 2 V' },
      { t: 'num', q: 'Çevrim kazancının 1 (0 dB) olduğu frekansta faz −125°. Faz payı kaç derece?', a: 55, u: '°',
        e: 'Faz payı, döngünün −180°\'ye ne kadar uzak olduğudur. 45°\'nin altı aşma ve çınlama demektir.', f: 'PM = 180° − 125° = 55°' },
      { t: 'num', q: 'Çevrim kazancının bir kutbu çok düşük frekansta, ikincisi kesim frekansının 3 katında. Faz payı yaklaşık kaç derece?', a: 90 - Math.atan(1 / 3) * 180 / Math.PI, u: '°',
        e: 'İlk kutup kesimde −90° verir. İkinci kutbun katkısı arctan(f_c / f_p2)\'dir.', f: 'PM = 180 − 90 − arctan(1/3) = 71,6°' },
      { t: 'mc', q: 'Op-amp çıkışına büyük kapasitif yük bağlanınca osilasyon riski neden artar?', o: ['Çıkış direnciyle yeni bir kutup oluşur ve faz payı azalır', 'Kazanç düşer', 'Besleme gerilimi artar', 'Giriş ofseti sıfırlanır'], a: 0,
        e: 'R_o ve C_L, geri besleme yoluna ek bir faz gecikmesi koyar. Çözüm genelde çıkışa seri küçük bir izolasyon direncidir.', f: 'f_p = 1 / (2π R_o C_L)' },
      { t: 'num', q: 'Wien köprülü osilatörde R = 10 kΩ, C = 16 nF. Salınım frekansı kaç Hz?', a: 1 / (2 * Math.PI * 10e3 * 16e-9), u: 'Hz',
        e: 'Bu frekansta köprünün fazı sıfırdır ve kazancı 1/3\'tür; yükselteç kazancı 3 olmalıdır.', f: 'f = 1 / (2πRC) = 995 Hz' },
      { t: 'sira', q: 'Bir döngünün kararlılığını Bode diyagramıyla denetleme adımlarını sırala.', o: ['Çevrim kazancı Aβ(f)\'yi çiz', 'Kazancın 0 dB olduğu kesim frekansını bul', 'O frekanstaki fazı oku', 'Faz payı = 180° + faz; 45°\'nin üstünde mi bak'],
        e: 'Kapalı çevrim kazancına değil, çevrim kazancına bakılır.', f: 'PM = 180° + ∠Aβ(f_c)' } ] } ] },

  { name: 'Anahtarlama ve H köprüsü', lessons: [
    { name: 'MOSFET anahtar', z: 1, k: [
      { h: 'Gerilimle açılan anahtar', p: 'N kanallı MOSFET, gate ile source arasındaki gerilimle (V_GS) açılıp kapanır; gate\'e kalıcı akım gitmez. Low-side bağlantıda yük + ray ile drain arasında, source toprakta durur. R_PD, sürücü yokken gate\'i 0 V\'ta tutar ve MOSFET kapalı kalır.',
        f: ['Tam iletim: V_GS ≫ V_th (ör. 10 V)', 'Güvenli durum: V_GS = 0'], c: LOWSIDE, fl: [{ p: [[180, 24], [150, 24], [150, 110], [150, 120], [150, 180], [150, 200]], v: [24, 24, 0.2, 0.2, 0, 0], i: 500 }, { p: [[24, 150], [95, 150], [95, 214]], v: [10, 9.99, 0], i: 1 }] },
      { h: 'İletimde küçük bir direnç', p: 'Açık MOSFET, R_DS(on) değerinde küçük bir dirence benzer; kaybı akımın karesiyle büyür. PWM\'de anahtar saniyede binlerce kez açılıp kapanır, yük ortalama gerilimi görür. Görev oranı D, iletim süresinin periyoda oranıdır.',
        f: ['P = I² · R_DS(on)', 'V_ort = D · V'],
        r: 'Gerçek hayatta: Robot süpürgenin emme motoru 14,4 V\'tan bir MOSFET\'le PWM edilir. %60 görev oranında motor ortalama 8,6 V görür; 3 A ve 10 mΩ\'da MOSFET iletimdeyken yalnız 90 mW harcar.' },
      { h: 'Bobin akımı aniden kesilemez', p: 'Röle, solenoid ve motor sargısı birer endüktanstır. MOSFET kapanınca akımın gidecek yolu yoksa v = L·di/dt çok büyür ve drain\'de beslemenin katları kadar sıçrama olur. Yüke ters paralel bir diyot akıma yol açar ve V_DS\'yi besleme + V_F\'de tutar.',
        f: ['v = L · di/dt', 'Diyotla: V_DS ≈ V + V_F'] } ], qs: [
      { t: 'mc', q: 'N kanallı MOSFET\'i low-side anahtar olarak tam iletime sokmak için ne gerekir?', o: ['V_GS, V_th\'den yeterince büyük olmalı (ör. 10 V)', 'V_GS = 0 V', 'Drain\'e negatif gerilim', 'Gate\'e sürekli akım vermek'], a: 0,
        e: 'V_th, MOSFET\'in yeni iletmeye başladığı gerilimdir. Datasheet\'teki R_DS(on), belirtilen V_GS\'te (ör. 10 V) ölçülür.', f: 'Tam iletim: V_GS ≫ V_th' },
      { t: 'num', q: 'I = 10 A, R_DS(on) = 8 mΩ. İletim kaybı kaç W?', a: 0.8, u: 'W',
        e: 'İletimdeki MOSFET bir direnç gibidir.', f: 'P = I² · R = 100 × 0,008 = 0,8 W' },
      { t: 'mc', fa: 1, q: 'Bobine ters paralel bağlı D diyotunun görevi nedir?', c: LOWSIDE, fl: [{ p: [[150, 110], [210, 110], [210, 24], [150, 24], [150, 110]], v: [24.7, 24.7, 24, 24, 24.7], i: 500 }], o: ['Kapanışta bobin akımına yol verip gerilim sıçramasını önlemek', 'Bobini hızlı çekmek', 'Ters polariteden korumak', 'PWM frekansını artırmak'], a: 0,
