<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef3ee"><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1c1a">
<meta name="description" content="Günde 3 dakikalık elektronik dersleri">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Akımlı"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Akımlı</title>
<style>
/* Düzen: ana sayfada her ünite bir baskı devre kartı, dersler bakır yolla bağlı lehim pedleri. Diğer ekranlar sade. */
:root{
  --bg:#eef3ee; --card:#fff; --ink:#12302c; --soft:#4b6661; --line:#c9d6cf;
  --mask:#15564c; --mask2:#0f463e; --silk:#eaf5ee; --copper:#d08a4a; --tin:#c9d4d0;
  --led:#f6b932; --ledink:#2c1f02; --good:#17703f; --goodbg:#dcf1e3; --bad:#b02f1f; --badbg:#fbe4df; --focus:#0b63c4; --sel:#fff1cc; --hi1:#fff1c7; --hi2:#d9ecff;
  --disp:"Roboto Condensed","sans-serif-condensed","Avenir Next Condensed","Arial Narrow","Segoe UI",sans-serif;
  --body:Roboto,"Segoe UI",system-ui,sans-serif; --mono:"Roboto Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1c1a; --card:#12302c; --ink:#e4f0ea; --soft:#9bb8b0; --line:#2a4b45;
  --mask:#134c43; --mask2:#0d3a33; --silk:#eaf5ee; --copper:#d9955a; --tin:#b9c6c1;
  --led:#f6b932; --ledink:#2c1f02; --good:#6fd79a; --goodbg:#123d28; --bad:#ff9c8b; --badbg:#46201b; --focus:#8cc4ff; --sel:#4a3c12; --hi1:#3a3110; --hi2:#123049; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1c1a; --card:#12302c; --ink:#e4f0ea; --soft:#9bb8b0; --line:#2a4b45;
  --mask:#134c43; --mask2:#0d3a33; --silk:#eaf5ee; --copper:#d9955a; --tin:#b9c6c1;
  --led:#f6b932; --ledink:#2c1f02; --good:#6fd79a; --goodbg:#123d28; --bad:#ff9c8b; --badbg:#46201b; --focus:#8cc4ff; --sel:#4a3c12; --hi1:#3a3110; --hi2:#123049; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button{user-select:none;-webkit-user-select:none;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1:focus{outline:none}
h1,h2{font-family:var(--disp);line-height:1.2;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:26px}
h2{font-size:20px}
p{margin:0}
sub{font-size:.72em;line-height:0}
#app{--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));max-width:520px;margin:0 auto;
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:16px;min-width:0}

/* Alt gezinme */
nav{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-top:1px solid var(--line);
  margin-inline:calc(-1*var(--gl)) calc(-1*var(--gr));padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--soft);position:relative}
nav button[aria-current]{color:var(--ink);font-weight:700}
nav button[aria-current]::before{content:"";position:absolute;top:-1px;width:44px;height:3px;background:var(--copper)}
nav button:focus-visible{outline-offset:-4px}
nav svg{width:24px;height:24px}
nav b{position:absolute;top:5px;left:calc(50% + 8px);min-width:20px;border-radius:10px;padding:0 5px;background:var(--bad);color:var(--bg);font-size:12px;line-height:20px;text-align:center}

/* Durum şeridi */
.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;align-items:center}
.stat span{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span+span{justify-content:flex-end}
.stat svg{width:22px;height:22px;flex:none}
.goal{grid-column:1/-1;font-size:14px;color:var(--soft);display:flex;flex-direction:column;gap:4px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--led);border-radius:5px;transition:width .3s}
.hello{display:flex;align-items:center;gap:12px}
.hello svg{width:84px;flex:none}
.hello div{min-width:0}
.hello p{color:var(--soft)}

/* Ünite kartı */
.pcb{background:var(--mask);color:var(--silk);border-radius:14px;padding:16px;box-shadow:inset 0 0 0 2px var(--mask2);min-width:0}
.pcb header{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.pcb header b{font:700 14px var(--mono);border:1.5px solid currentColor;padding:0 6px;border-radius:2px}
.pcb header h2{flex:1;min-width:0}
.pcb header small{font:13px var(--mono)}
.road{position:relative}
.road>svg{position:absolute;left:0;top:0;width:150px;pointer-events:none}
.node{display:flex;align-items:center;gap:14px;width:100%;height:96px;text-align:left;color:inherit;position:relative;border-radius:10px}
.node:nth-of-type(even){padding-left:56px}
.node:focus-visible{outline-color:#fff;outline-offset:-3px}
.pad{width:64px;height:64px;border-radius:50%;background:var(--copper);display:grid;place-items:center;flex:none;transition:transform .12s ease-out}
.node:active:not([disabled]) .pad{transform:scale(.94)}
.pad i{width:34px;height:34px;border-radius:50%;background:var(--mask2);display:grid;place-items:center;font:700 16px var(--mono);color:var(--silk)}
.node.done .pad{background:var(--tin)}
.node.done .pad i{background:var(--led);color:var(--ledink)}
.node.next .pad{box-shadow:0 0 0 5px var(--mask),0 0 0 8px var(--led)}
.node[disabled]{cursor:default}
.node[disabled] .pad{background:rgba(255,255,255,.3)}
.node em{font-style:normal;min-width:0}
.node strong{display:block;font-size:17px;line-height:1.25}
.node small{font-size:14px}

/* Ders */
.top{display:flex;align-items:center;gap:8px}
.top .bar{flex:1}
.top output{font:14px var(--mono);color:var(--soft)}
.x{width:44px;height:44px;margin-left:-10px;display:grid;place-items:center;flex:none;border-radius:8px}
.x svg{width:24px;height:24px}
.kind{font:13px var(--mono);color:var(--soft)}
.q{font-family:var(--body);font-size:20px;font-weight:600;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{width:100%;min-height:54px;padding:10px 14px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;display:flex;gap:12px;align-items:center;font-size:17px;transition:transform .1s ease-out}
.opt:active:not([disabled]){transform:scale(.985)}
.opt[aria-pressed=true]{border-color:var(--copper);background:var(--sel)}
.opt.good{border-color:var(--good);background:var(--goodbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt>span{min-width:0}
.opt kbd{font:700 15px var(--mono);width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.opt[aria-pressed=true] kbd{background:var(--led);border-color:var(--led);color:var(--ledink)}
.fig{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.fig svg{display:block;width:100%;max-width:400px;margin:auto;height:auto}
.ckt{color:var(--ink);font-family:var(--body);font-size:14px}
.ckt .ln{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ckt .fl{fill:currentColor}
.ckt text{fill:currentColor}
.ckt text.me{fill:var(--bad);font-weight:700;font-family:var(--mono);font-size:13px}
.ckt .hit{fill:transparent;stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4}
.ckt .part{cursor:pointer;outline:none}
.ckt .part:focus-visible .hit{stroke:var(--focus);stroke-width:3;stroke-dasharray:none}
.ckt .part[aria-checked=true] .hit{fill:var(--led);fill-opacity:.28;stroke:var(--copper);stroke-dasharray:none;stroke-width:2.5}
.ckt .part.good .hit{fill:var(--good);fill-opacity:.2;stroke:var(--good);stroke-dasharray:none}
.ckt .part.bad .hit{fill:var(--bad);fill-opacity:.2;stroke:var(--bad);stroke-dasharray:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:48px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-weight:700}
.seg button[aria-pressed=true]{border-color:var(--copper);background:var(--sel)}
.dmm{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;min-height:64px;padding:10px 14px;border-radius:10px;background:var(--mask2);color:var(--silk);font:14px var(--mono);box-shadow:inset 0 0 0 2px var(--mask)}
.dmm b{font-size:28px;line-height:1.2;color:var(--led);font-variant-numeric:tabular-nums;margin-right:auto}
.num{display:flex;gap:10px;align-items:center}
.num input{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:56px;font:700 24px var(--mono);padding:0 14px;background:var(--card);border:2px solid var(--line);border-radius:10px}
.num b{font:700 20px var(--mono)}
.note{font-size:14px;color:var(--soft)}
.note.err,.note .err{color:var(--bad);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots button{min-height:52px;padding:4px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;line-height:1.25}
.slots button[aria-pressed=true]{border-color:var(--copper);background:var(--sel)}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pal button{min-height:62px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:8px;min-width:0}
.pal i{width:40px;height:34px;border-radius:6px;border:1.5px solid var(--soft)}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 12px}
.sl b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sl input{grid-column:1/-1;width:100%;height:44px;margin:0;accent-color:var(--copper)}
.pred{display:grid;gap:10px}
.read{display:flex;gap:8px 28px;flex-wrap:wrap}
.read div{font-size:14px;color:var(--soft)}
.read b{display:block;font:700 24px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}

/* Alt eylem ve geri bildirim */
.foot{position:sticky;bottom:var(--kb,0px);z-index:5;display:grid;gap:10px;background:var(--bg);border-top:1px solid var(--line);margin-inline:calc(-1*var(--gl)) calc(-1*var(--gr));
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot.good{background:var(--goodbg)}
.foot.bad{background:var(--badbg)}
.btn{width:100%;min-height:52px;border-radius:10px;background:var(--led);color:var(--ledink);font-weight:700;font-size:17px;padding:8px 16px;transition:transform .1s ease-out}
.btn:active:not([disabled]){transform:scale(.98)}
.btn[disabled]{background:var(--line);color:var(--soft);cursor:default}
.btn.alt{background:none;border:2px solid var(--line);color:var(--ink)}
.fb{display:grid;grid-template-columns:72px 1fr;gap:0 12px}
.fb>svg{width:72px}
.fb>div{min-width:0;display:grid;gap:4px;align-content:center}
.foot.good h2{color:var(--good)}
.foot.bad h2{color:var(--bad)}
.fb p{font-size:15px;line-height:1.4}
.fb code{font:14px/1.45 var(--mono);overflow-wrap:anywhere}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.end>svg{width:150px}
.tbl{display:grid;grid-template-columns:1fr auto;gap:8px 0;margin:0;width:100%;text-align:left}
dt,dd{padding-bottom:8px;border-bottom:1px solid var(--line);margin:0}
dd{font:700 17px/1.5 var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding-left:16px}
.list{list-style:none;margin:0;padding:0}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl button{min-height:64px;border:2px solid var(--line);border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700}
.lvl small{font-weight:400;font-size:13px;color:var(--soft)}
.list li{padding:12px 0;border-bottom:1px solid var(--line)}
.list small{color:var(--soft);display:block;font-size:14px}
.bdg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.bdg li{display:flex;gap:10px;min-width:0;font-size:14px;line-height:1.35;color:var(--soft)}
.bdg li>span{min-width:0}
.bdg svg{width:40px;height:40px;flex:none}
.bdg b{display:block;color:var(--ink);font-size:15px}
/* Zorluk renkleri: yeşil, sarı, kırmızı nokta; yazı rengi değişmez, kontrast korunur. */
.z1{--zc:#2fbf63}.z2{--zc:#f2b200}.z3{--zc:#ff5242}
.zt{display:inline-flex;align-items:center;gap:5px}
.zt::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--zc);box-shadow:0 0 0 1.5px rgba(0,0,0,.15)}
.lvl button{border-top:6px solid var(--zc)}
.lvl .zt::before{display:none}
.bar i{background:linear-gradient(90deg,var(--led),#ff8a3d)}
.hello{background:linear-gradient(120deg,var(--hi1),var(--hi2));border-radius:14px;padding:12px 14px}
.hop{animation:hop .5s ease-out}
.glow{animation:glow 2.6s ease-in-out infinite}
@keyframes hop{0%{transform:translateY(8px)}45%{transform:translateY(-8px)}100%{transform:none}}
@keyframes glow{50%{opacity:.18}}
@media (hover:hover) and (pointer:fine){.opt:not([disabled]):hover{border-color:var(--copper)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sel{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sel select{min-height:48px;min-width:150px;font:inherit;padding:0 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)}#app{min-height:calc(100dvh - env(safe-area-inset-top,0px))}</style>

<div id="app"></div>
<script>
// Soru kimliği konumdan gelir (ünite-ders-soru). Yeni soruyu dersin sonuna ekle, yoksa kayıtlı tekrarlar kayar.
// Devre elemanı: [tip, x1, y1, x2, y2, etiket, kimlik]. Etikette "|" sonrası ölçü değeridir.
// Tip sonundaki "-" elemanı ters çevirir.

const put = (el, x1, y1, x2, y2) => {
  const [type, name, value = '', meas = '', side] = el;
  return [type, x1, y1, x2, y2, name + (value ? '\n' + value : '') + (meas ? '|' + meas : ''), name, side];
};

// Seri çevrim: kaynak solda, son eleman sağda, kalanlar üstte.
function loop(v, els) {
  const top = els.slice(0, -1), last = els[els.length - 1], step = 240 / (top.length || 1);
  return [
    ['V', 40, 180, 40, 40, v, 'Kaynak'],
    ...(top.length ? top.map((e, i) => put(e, 40 + i * step, 40, 40 + (i + 1) * step, 40)) : [['W', 40, 40, 280, 40]]),
    put(last, 280, 40, 280, 180),
    ['W', 280, 180, 40, 180]
  ];
}

// Paralel kollar: her kol yukarıdan aşağı 1 veya 2 eleman.
function par(v, branches) {
  const gap = branches.length > 2 ? 80 : 110, xs = branches.map((_, i) => 40 + gap * (i + 1));
  const end = xs[xs.length - 1];
  return [
    ['V', 40, 180, 40, 40, v, 'Kaynak'],
    ['W', 40, 40, end, 40], ['W', 40, 180, end, 180],
    ...branches.flatMap((b, i) => b.map((e, j) => put(e, xs[i], 40 + j * 140 / b.length, xs[i], 40 + (j + 1) * 140 / b.length))),
    ...xs.slice(0, -1).flatMap(x => [['N', x, 40], ['N', x, 180]])
  ];
}

const KARMA = [
  ['V', 40, 180, 40, 40, '10 V'], ['R', 40, 40, 160, 40, 'R1\n1 kΩ'], ['R', 160, 40, 160, 180, 'R2\n2 kΩ'],
  ['W', 160, 40, 250, 40], ['R', 250, 40, 250, 180, 'R3\n2 kΩ'], ['W', 40, 180, 250, 180], ['N', 160, 40], ['N', 160, 180]
];
const THEVENIN = [
  ['V', 40, 180, 40, 40, '12 V'], ['R', 40, 40, 190, 40, 'R1\n6 kΩ'], ['R', 190, 40, 190, 180, 'R2\n3 kΩ'],
  ['W', 190, 40, 285, 40], ['W', 40, 180, 285, 180], ['N', 190, 40], ['N', 190, 180], ['N', 285, 40], ['N', 285, 180],
  ['T', 296, 45, 0, 0, 'a'], ['T', 296, 185, 0, 0, 'b']
];
const ZENER = [
  ['V', 40, 180, 40, 40, '12 V'], ['R', 40, 40, 165, 40, 'R_S\n330 Ω'], ['Z', 165, 180, 165, 40, 'V_Z\n5,1 V'],
  ['W', 165, 40, 270, 40], ['R', 270, 40, 270, 180, 'R_L\n1 kΩ'], ['W', 40, 180, 270, 180], ['N', 165, 40], ['N', 165, 180]
];
const bjtFixed = (rb, rc, load = 'R') => [
  ['W', 60, 24, 190, 24], ['T', 100, 16, 0, 0, '+12 V'], ['R', 60, 24, 60, 120, 'R_B\n' + rb], ['W', 60, 120, 150, 120],
  [load, 190, 24, 190, 92, 'R_C\n' + rc], ['Q', 150, 120], ['W', 190, 148, 190, 196], ['G', 190, 196]
];
const bjtDiv = (m = {}) => [
  ['W', 60, 24, 190, 24], ['T', 100, 16, 0, 0, '+12 V'],
  ['R', 60, 24, 60, 120, 'R1\n30 kΩ', 'R1'], ['R', 60, 120, 60, 216, 'R2\n10 kΩ', 'R2'], ['W', 60, 120, 150, 120], ['N', 60, 120],
  ['R', 190, 24, 190, 92, 'RC\n2,2 kΩ', 'RC'], ['Q', 150, 120], ['R', 190, 148, 190, 216, 'RE\n1 kΩ', 'RE'],
  ['W', 60, 216, 190, 216], ['G', 125, 216],
  ...(m.vc ? [['T', 224, 104, 0, 0, '|V_C = ' + m.vc], ['T', 224, 146, 0, 0, '|V_E = ' + m.ve], ['T', 84, 136, 0, 0, '|V_B = ' + m.vb]] : [])
];

const UNITS = [
  { name: 'Yük, akım, gerilim', lessons: [
    { name: 'Elektrik yükü', qs: [
      { t: 'mc', q: 'Elektronun yükü 1,6×10⁻¹⁹ C büyüklüğündedir. 1 C yük kaç elektrona karşılık gelir?', o: ['6,25×10¹⁸', '1,6×10¹⁹', '6,02×10²³', '6,25×10¹⁵'], a: 0,
        e: 'Toplam yükü tek elektronun yüküne bölersin.', f: 'n = Q / e = 1 / 1,6×10⁻¹⁹ = 6,25×10¹⁸' },
      { t: 'num', q: 'Bir cisme 3,2 µC yük aktarıldı. Kaç elektron hareket etti? Sonucu ×10¹³ cinsinden yaz.', a: 2, u: '×10¹³',
        e: 'µC değerini C\'a çevir, sonra elektron yüküne böl.', f: 'n = 3,2×10⁻⁶ / 1,6×10⁻¹⁹ = 2×10¹³' },
      { t: 'mc', q: 'Metal bir telde akımı hangi parçacıklar taşır?', o: ['Serbest elektronlar', 'Protonlar', 'Atom çekirdekleri', 'Nötronlar'], a: 0,
        e: 'Çekirdekler kristal örgüde sabittir. Yükü, dış yörüngeden kopmuş serbest elektronlar taşır.', f: 'e = 1,6×10⁻¹⁹ C' },
      { t: 'sira', q: 'Yükleri küçükten büyüğe sırala.', o: ['500 pC', '20 nC', '3 µC', '0,1 mC'],

        e: 'DC\'de ideal integral alıcının kazancı sonsuzdur; küçük bir ofset bile zamanla birikir. Paralel direnç DC kazancı R_F/R ile sınırlar.', f: 'A_DC = R_F / R' },
      { t: 'num', q: 'C = 10 nF\'a paralel R_F = 1 MΩ konmuş. Devre hangi frekansın üstünde integral alıcı gibi davranır (köşe frekansı, Hz)?', a: 1 / (2 * Math.PI * 1e6 * 10e-9), u: 'Hz',
        e: 'Köşenin altında devre eviren yükselteç, üstünde integral alıcıdır.', f: 'f = 1 / (2π R_F C) = 15,9 Hz' },
      { t: 'num', q: 'Girişi topraklanmış integral alıcıda op-amp ofseti 2 mV, R = 100 kΩ, C = 100 nF, doyum 10 V. Çıkış yaklaşık kaç saniyede doyar?', a: 10 / (2e-3 / (100e3 * 100e-9)), u: 's',
        e: 'Ofset gerilimi girişte sabit bir gerilim gibi integre edilir. En kötü durum hesabı budur.', f: 'Eğim = 2 mV / 10 ms = 0,2 V/s → t = 10 / 0,2 = 50 s' } ] } ] },

  { name: 'Geri besleme', lessons: [
    { name: 'Kapalı çevrim kazancı', z: 1, qs: [
      { t: 'num', q: 'Açık çevrim kazancı A = 1000, geri besleme oranı β = 0,1. Kapalı çevrim kazancı kaç?', a: 1000 / 101, u: 'V/V',
        e: 'Çevrim kazancı Aβ büyükken kapalı çevrim kazancı 1/β\'ya yaklaşır.', f: 'A_f = A / (1 + Aβ) = 1000 / 101 = 9,90' },
      { t: 'mc', q: 'Negatif geri besleme kazancı ve bant genişliğini nasıl etkiler?', o: ['Kazanç düşer, bant genişliği artar', 'İkisi de artar', 'İkisi de düşer', 'Kazanç artar, bant genişliği düşer'], a: 0,
        e: 'Tek kutuplu yükselteçte kazanç–bant genişliği çarpımı sabittir; kazançtan verip bant genişliği alırsın.', f: 'A_f · f_H ≈ A · f_p' },
      { t: 'num', q: 'Evirmeyen yükselteçte R1 = 1 kΩ, R_F = 9 kΩ. Geri besleme oranı β kaç?', c: opNon(['R', 'R1', '1 kΩ'], ['R', 'R_F', '9 kΩ']), a: 0.1, u: 'V/V',
        e: 'β, çıkışın − girişine geri dönen kesridir.', f: 'β = R1 / (R1 + R_F) = 1 / 10 = 0,1' },
      { t: 'mc', q: 'Aβ çarpımına ne ad verilir?', o: ['Çevrim kazancı', 'Kapalı çevrim kazancı', 'Ortak mod kazancı', 'Geri besleme direnci'], a: 0,
        e: 'Döngüyü bir noktadan kesip bir tur dolaşınca görülen kazançtır. Kararlılık bundan okunur.', f: 'T = Aβ' },
      { t: 'mc', q: 'Gerilim örnekleyip seri karıştıran (seri-şönt) geri besleme giriş ve çıkış direncini nasıl değiştirir?', o: ['Giriş direnci artar, çıkış direnci azalır', 'İkisi de azalır', 'İkisi de artar', 'Giriş azalır, çıkış artar'], a: 0,
        e: 'Evirmeyen op-amp yükselteci bu tiptir. İki direnç de (1 + Aβ) kadar değişir.', f: 'R_if = R_i (1 + Aβ), R_of = R_o / (1 + Aβ)' },
      { t: 'sira', q: 'Geri beslemeli bir yükselteci analiz etme adımlarını sırala.', o: ['Örnekleme ve karıştırma tipini belirle', 'Geri besleme ağından β\'yı hesapla', 'Çevrim kazancı Aβ\'yı bul', 'A_f = A / (1 + Aβ) ile kapalı çevrim kazancını yaz'],
        e: 'Tip, β\'nın hangi büyüklükler arasında tanımlandığını belirler. β olmadan çevrim kazancı, çevrim kazancı olmadan A_f bulunamaz.', f: 'tip → β → Aβ → A_f' } ] },
    { name: 'Bant genişliği ve hatalar', z: 2, qs: [
      { t: 'num', q: 'Op-amp\'in kazanç–bant genişliği çarpımı 1 MHz. Kazancı 20 olan evirmeyen yükseltecin bant genişliği kaç kHz?', a: 50, u: 'kHz',
        e: 'Tek kutuplu op-amp\'te GBW sabittir.', f: 'f_H = GBW / A = 1 MHz / 20 = 50 kHz' },
      { t: 'num', q: 'Eğim hızı (slew rate) 0,5 V/µs. 5 V tepeli sinüs bozulmadan en fazla kaç kHz olabilir?', a: 0.5e6 / (2 * Math.PI * 5) / 1e3, u: 'kHz',
        e: 'Sinüsün en büyük eğimi sıfır geçişindedir: 2πf·V_p.', f: 'f_max = SR / (2π V_p) = 0,5 V/µs / (2π × 5) = 15,9 kHz' },
      { t: 'num', q: 'Açık çevrim kazancı %10 değişiyor ve 1 + Aβ = 100. Küçük değişim yaklaşımıyla kapalı çevrim kazancı yüzde kaç değişir?', a: 0.1, u: '%',
        e: 'Geri besleme, A\'daki değişimi (1 + Aβ) kadar küçültür. Buna duyarsızlaştırma denir.', f: 'ΔA_f/A_f = (ΔA/A) / (1 + Aβ) = 10 / 100 = %0,1' },
      { t: 'num', q: 'Kazancı 101 olan evirmeyen yükselteçte op-amp ofseti 2 mV. Girişi topraklıyken çıkıştaki hata kaç mV?', a: 202, u: 'mV',
        e: 'Ofset, + girişine seri küçük bir kaynak gibidir ve evirmeyen kazançla yükselir.', f: 'V_o = 101 × 2 mV = 202 mV' },
      { t: 'num', q: 'Eviren yükselteçte R_F = 1 MΩ, op-amp bias akımı 100 nA, + giriş doğrudan toprakta. Çıkıştaki hata kaç mV?', a: 100, u: 'mV',
        e: '− girişin bias akımı R_F üzerinden akar.', f: 'V_o = I_B · R_F = 100 nA × 1 MΩ = 100 mV' },
      { t: 'mc', q: 'Bias akımının çıkıştaki etkisini azaltmak için + girişle toprak arasına hangi direnç konur?', o: ['R1 ∥ R_F değerinde bir direnç', 'R1 + R_F değerinde', '1 Ω', 'Sonsuz (açık devre)'], a: 0,
        e: 'İki girişin gördüğü direnç eşitlenince eşit bias akımlarının etkileri birbirini götürür; geriye ofset akımı kalır.', f: 'R_p = R1 ∥ R_F' } ] },
    { name: 'Kararlılık ve Schmitt', z: 3, qs: [
      { t: 'num', q: 'Eviren Schmitt tetikleyicide çıkış ±10 V. Histerezis genişliği kaç V?', c: opNon(['R', 'R1', '10 kΩ'], ['R', 'R2', '90 kΩ'], { flip: 0 }), a: 2, u: 'V',
        e: 'Pozitif geri besleme + girişini çıkışın bir kesrine bağlar. Çıkış durum değiştirince eşik de değişir.', f: 'V_eşik = ±10 × 10 / (10 + 90) = ±1 V → genişlik 2 V' },
      { t: 'num', q: 'Çevrim kazancının 1 (0 dB) olduğu frekansta faz −125°. Faz payı kaç derece?', a: 55, u: '°',
        e: 'Faz payı, döngünün −180°\'ye ne kadar uzak olduğudur. 45°\'nin altı aşma ve çınlama demektir.', f: 'PM = 180° − 125° = 55°' },
      { t: 'num', q: 'Çevrim kazancının bir kutbu çok düşük frekansta, ikincisi kesim frekansının 3 katında. Faz payı yaklaşık kaç derece?', a: 90 - Math.atan(1 / 3) * 180 / Math.PI, u: '°',
        e: 'İlk kutup kesimde −90° verir. İkinci kutbun katkısı arctan(f_c / f_p2)\'dir.', f: 'PM = 180 − 90 − arctan(1/3) = 71,6°' },
      { t: 'mc', q: 'Op-amp çıkışına büyük kapasitif yük bağlanınca osilasyon riski neden artar?', o: ['Çıkış direnciyle yeni bir kutup oluşur ve faz payı azalır', 'Kazanç düşer', 'Besleme gerilimi artar', 'Giriş ofseti sıfırlanır'], a: 0,
        e: 'R_o ve C_L, geri besleme yoluna ek bir faz gecikmesi koyar. Çözüm genelde çıkışa seri küçük bir izolasyon direncidir.', f: 'f_p = 1 / (2π R_o C_L)' },
      { t: 'num', q: 'Wien köprülü osilatörde R = 10 kΩ, C = 16 nF. Salınım frekansı kaç Hz?', a: 1 / (2 * Math.PI * 10e3 * 16e-9), u: 'Hz',
        e: 'Bu frekansta köprünün fazı sıfırdır ve kazancı 1/3\'tür; yükselteç kazancı 3 olmalıdır.', f: 'f = 1 / (2πRC) = 995 Hz' },
      { t: 'sira', q: 'Bir döngünün kararlılığını Bode diyagramıyla denetleme adımlarını sırala.', o: ['Çevrim kazancı Aβ(f)\'yi çiz', 'Kazancın 0 dB olduğu kesim frekansını bul', 'O frekanstaki fazı oku', 'Faz payı = 180° + faz; 45°\'nin üstünde mi bak'],
        e: 'Kapalı çevrim kazancına değil, çevrim kazancına bakılır.', f: 'PM = 180° + ∠Aβ(f_c)' } ] } ] },

  { name: 'Anahtarlama ve H köprüsü', lessons: [
    { name: 'MOSFET anahtar', z: 1, qs: [
      { t: 'mc', q: 'N kanallı MOSFET\'i low-side anahtar olarak tam iletime sokmak için ne gerekir?', o: ['V_GS, V_th\'den yeterince büyük olmalı (ör. 10 V)', 'V_GS = 0 V', 'Drain\'e negatif gerilim', 'Gate\'e sürekli akım vermek'], a: 0,
        e: 'V_th, MOSFET\'in yeni iletmeye başladığı gerilimdir. Datasheet\'teki R_DS(on), belirtilen V_GS\'te (ör. 10 V) ölçülür.', f: 'Tam iletim: V_GS ≫ V_th' },
      { t: 'num', q: 'I = 10 A, R_DS(on) = 8 mΩ. İletim kaybı kaç W?', a: 0.8, u: 'W',
        e: 'İletimdeki MOSFET bir direnç gibidir.', f: 'P = I² · R = 100 × 0,008 = 0,8 W' },
      { t: 'mc', q: 'Bobine ters paralel bağlı D diyotunun görevi nedir?', c: LOWSIDE, o: ['Kapanışta bobin akımına yol verip gerilim sıçramasını önlemek', 'Bobini hızlı çekmek', 'Ters polariteden korumak', 'PWM frekansını artırmak'], a: 0,
        e: 'Endüktans akımı aniden kesilemez. Yol yoksa v = L·di/dt çok büyür ve MOSFET çığ kırılmasına girer.', f: 'v = L · di/dt' },
      { t: 'mc', q: 'Gate ile source arasındaki R_PD direnci neden konur?', c: LOWSIDE, o: ['Sürücü yokken (reset, kopuk kablo) gate\'i 0 V\'ta tutup MOSFET\'i kapalı tutmak için', 'Gate akımını artırmak için', 'Anahtarlamayı hızlandırmak için', 'Drain akımını ölçmek için'], a: 0,
        e: 'Yüzen gate, kaçak ve kuplajla yükselip MOSFET\'i yarı iletime sokabilir. MCU açılırken pinler bir süre yüksek empedanstadır.', f: 'Güvenli durum: V_GS = 0' },
      { t: 'ariza', q: 'MOSFET birkaç anahtarlamada yandı. Kapanışta V_DS\'de 85 V tepe ölçülüyor (besleme 24 V). Sorunlu elemana dokun.', c: LOWSIDE, a: 'D',
        e: 'Diyot sağlamken V_DS en fazla 24 V + V_F ≈ 25 V olur. 85 V, bobin akımının gidecek yeri olmadığını gösterir: D açık devre ya da takılmamış.', f: 'Yol yoksa di/dt çok büyük → v = L·di/dt' },
      { t: 'num', q: '24 V besleme %35 görev oranıyla PWM ediliyor. Yüke düşen ortalama gerilim kaç V?', a: 8.4, u: 'V',
        e: 'Ortalama gerilim, iletim süresinin periyoda oranıyla orantılıdır.', f: 'V_ort = D · V = 0,35 × 24 = 8,4 V' } ] },
    { name: 'H köprüsü', z: 2, qs: [
      { t: 'mc', q: 'Motor akımının A\'dan B\'ye akması için hangi MOSFET\'ler iletimde olmalı?', c: hbridge(), o: ['Q1 ve Q4', 'Q1 ve Q2', 'Q3 ve Q4', 'Q2 ve Q3'], a: 0,
        e: 'Akım + raydan Q1 ile A\'ya, motordan B\'ye, Q4 ile toprağa gider. Çaprazdaki çift yönü belirler.', f: '+24 V → Q1 → A → motor → B → Q4 → toprak' },
      { t: 'mc', q: 'Aynı koldaki Q1 ve Q2 aynı anda iletime girerse ne olur?', c: hbridge(), o: ['Besleme kısa devre olur (shoot-through), MOSFET\'ler yanabilir', 'Motor hızlanır', 'Motor ters döner', 'Hiçbir şey olmaz'], a: 0,
        e: 'Bu yüzden sürücüler bir MOSFET kapanıp diğeri açılmadan önce ölü zaman (dead time) bırakır.', f: 'I = 24 V / (R_DS1 + R_DS2) → yüzlerce amper' },
      { t: 'mc', q: 'Q1 ve Q3 kesimdeyken Q2 ve Q4 birlikte iletime alınırsa dönen motor nasıl davranır?', c: hbridge(), o: ['Uçları kısa devre olur, dinamik fren yapar', 'Tam hızla döner', 'Ters yönde hızlanır', 'Bus\'ı şarj eder'], a: 0,
        e: 'Dönen motor zıt EMK üretir; kısa devre edilen uçlardan akan akım frenleyici tork verir.', f: 'I = E / R_a, T = K_t · I (frenleyici)' },
      { t: 'sim', sim: 'hb', q: 'Kilitli ters faz (locked anti-phase) PWM ile motor ortalama gerilimini +9,6 V yap (±0,3 V).',
        e: 'Bu yöntemde köprü sürekli yön değiştirir; %50 görev oranı 0 V verir.', f: 'V_ort = (2D − 1)·V, örneğin 24 V, D = %70 → 9,6 V' },
      { t: 'num', q: 'İletimdeki iki MOSFET\'in her biri 15 mΩ, motor akımı 8 A. Köprünün toplam iletim kaybı kaç W?', a: 2 * 64 * 0.015, u: 'W',
        e: 'Akım her an iki MOSFET\'ten seri geçer.', f: 'P = 2 · I² · R = 2 × 64 × 0,015 = 1,92 W' },
      { t: 'ariza', q: 'Q1 ve Q4\'e iletim komutu verildi. A = 24 V, B = 24 V ölçülüyor ve motor akımı 0 A. Arızalı MOSFET\'e dokun.', c: hbridge({ ra: '|24 V', rb: '|24 V' }), a: 'Q4',
        e: 'Q1 iletimde, A = 24 V. Q4 iletseydi B toprağa yakın olurdu. B = 24 V ve akım 0 ise Q4 iletmiyor. Q3 kısa devre olsaydı B yine 24 V olur ama Q4 üzerinden büyük akım akardı.', f: 'Beklenen: V_A − V_B ≈ 24 V' } ] },
    { name: 'Sürüş ve kayıplar', z: 3, qs: [
      { t: 'mc', q: 'Yarım köprüde üst MOSFET hızlı açılınca alt MOSFET\'in gate\'inde gerilim sıçraması görülüyor. En doğrudan çözüm hangisi?', o: ['Alt MOSFET için güçlü kapatma yolu: küçük R_g,off veya Miller clamp', 'Gate direncini 10 kat büyütmek', 'Ölü zamanı sıfırlamak', 'Besleme gerilimini yükseltmek'], a: 0,
        e: 'Faz düğümündeki dv/dt, C_gd üzerinden alt gate\'e akım basar. Bu akım kapatma yolu direncinde gerilim oluşturur; V_th\'yi aşarsa shoot-through olur.', f: 'V_GS ≈ C_gd · dV/dt · (R_g,off + R_sürücü)' },
      { t: 'num', q: 'R_DS(on) 25 °C\'de 8 mΩ ve 110 °C\'de 1,6 katına çıkıyor. 10 A\'de sıcak durumdaki iletim kaybı kaç W?', a: 100 * 0.008 * 1.6, u: 'W',
        e: 'Isıl hesap en kötü durumda, sıcak R_DS(on) ile yapılır. 25 °C değeriyle yapılan hesap kaybı küçük gösterir.', f: 'P = 10² × 8 mΩ × 1,6 = 1,28 W' },
      { t: 'num', q: '48 V, 10 A anahtarlanıyor; t_r + t_f = 60 ns, f_sw = 100 kHz. Yaklaşık anahtarlama kaybı kaç W?', a: 0.5 * 48 * 10 * 60e-9 * 1e5, u: 'W',
        e: 'Geçiş sırasında gerilim ve akım aynı anda vardır. Kayıp frekansla doğru orantılıdır.', f: 'P ≈ ½ · V · I · (t_r + t_f) · f = ½ × 48 × 10 × 60 ns × 100 kHz = 1,44 W' },
      { t: 'num', q: 'High-side MOSFET\'in Q_g\'si 100 nC. Bootstrap kondansatöründe her açılışta en fazla 0,5 V düşüm isteniyor. Minimum C_boot kaç nF?', a: 200, u: 'nF',
        e: 'Gate yükü bootstrap kondansatöründen çekilir. Pratikte bu minimumun birkaç katı seçilir.', f: 'C ≥ Q_g / ΔV = 100 nC / 0,5 V = 200 nF' },
      { t: 'num', q: 'V_dc = 48 V, ölü zaman 500 ns, f_sw = 20 kHz. Ölü zamanın yarattığı ortalama gerilim hatası kaç V?', a: 48 * 500e-9 * 20e3, u: 'V',
        e: 'Ölü zamanda çıkış gerilimi akım yönüne göre diyot tarafından belirlenir. Düşük hızda motor akımını bozar.', f: 'ΔV ≈ V_dc · t_d · f_sw = 48 × 500 ns × 20 kHz = 0,48 V' },
      { t: 'num', q: 'MOSFET 5 W harcıyor. R_th,jc = 0,8, R_th,cs = 0,5, R_th,sa = 6 °C/W, ortam 40 °C. Jonksiyon sıcaklığı kaç °C?', a: 40 + 5 * 7.3, u: '°C',
        e: 'Isıl dirençler seri toplanır. Termal ped (R_th,cs) çoğu zaman ihmal edilemez.', f: 'T_j = 40 + 5 × (0,8 + 0,5 + 6) = 76,5 °C' } ] } ] },

  { name: 'Anahtarlamalı güç kaynakları', lessons: [
    { name: 'Buck dönüştürücü', z: 1, qs: [
      { t: 'num', q: 'İdeal buck dönüştürücü 12 V\'tan 5 V üretiyor. Görev oranı yüzde kaç?', c: buck({ vin: '12 V' }), a: 500 / 12, u: '%',
        e: 'CCM\'de buck çıkışı, giriş geriliminin görev oranı kadarıdır.', f: 'D = V_o / V_in = 5 / 12 = %41,7' },
      { t: 'mc', q: 'CCM\'de çalışan buck dönüştürücüde endüktör akımının ortalaması neye eşittir?', o: ['Çıkış (yük) akımına', 'Giriş akımına', 'Sıfıra', 'Tepe akımın iki katına'], a: 0,
        e: 'Kalıcı durumda kondansatörün ortalama akımı sıfırdır; endüktör akımı ortalamada yüke gider.', f: 'Ī_L = I_o' },

        e: 'Endüktör akımı aniden değişemez; anahtarlama düğümünü negatife çekerek diyotu iletime sokar.', f: 'v_L = −V_o (kesimde)' },
      { t: 'num', q: 'Dönüştürücü 15 W veriyor ve girişten 16,5 W çekiyor. Verim yüzde kaç?', a: 1500 / 16.5, u: '%',
        e: 'Aradaki 1,5 W ısıya dönüşür: anahtar, diyot, endüktör ve kondansatör kayıpları.', f: 'η = 15 / 16,5 = %90,9' },
      { t: 'sim', sim: 'buck', q: 'Buck çıkışını 5 V yap (±0,1 V).',
        e: 'İdeal buck\'ta çıkış görev oranıyla doğru orantılıdır.', f: 'V_o = D · V_in, örneğin 12 V × %42 = 5,04 V' },
      { t: 'num', q: 'İdeal buck 12 V\'tan 5 V, 3 A veriyor. Girişten çekilen ortalama akım kaç A?', a: 15 / 12, u: 'A',

    { name: 'Boost ve buck-boost', z: 2, qs: [
      { t: 'num', q: 'Boost dönüştürücü 5 V\'tan 12 V üretiyor. Görev oranı yüzde kaç?', c: BOOST, a: (1 - 5 / 12) * 100, u: '%',
        e: 'Boost\'ta V_o = V_in / (1 − D).', f: 'D = 1 − 5/12 = %58,3' },
      { t: 'num', q: 'Buck: 12 V → 5 V, L = 10 µH, f_sw = 500 kHz. Endüktör akımının tepeden tepeye dalgalanması kaç A?', a: 7 * (5 / 12) / (10e-6 * 5e5), u: 'A',

      { t: 'num', q: 'Boost dönüştürücüde D = 0,6, yük akımı 1 A. Endüktörün ortalama akımı kaç A?', a: 2.5, u: 'A',

const dayNum = (d = new Date()) => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);

const fresh = () => ({ xp: 0, done: {}, wrong: [], ok: {}, perfect: 0, fixed: 0, last: -1, streak: 0, bestStreak: 0, freeze: true, refill: 0, day: -1, dayXp: 0, goalDays: 0, rem: 0 });

function parseState(raw, validIds) {
  const s = fresh();
  let p;
  try { p = JSON.parse(raw); } catch { return s; }
  if (!p || typeof p !== 'object') return s;
  for (const k in s) if (typeof p[k] === typeof s[k] && Array.isArray(p[k]) === Array.isArray(s[k]) && p[k] !== null && (typeof p[k] !== 'number' || Number.isFinite(p[k]))) s[k] = p[k];
  s.wrong = s.wrong.filter(id => validIds.includes(id));
  // Yedek dosyası dışarıdan gelir ve done değerleri ekrana yazılır: yalnız bilinen dersler ve sayaç değerleri kalır.
  const lessons = new Set(validIds.map(id => id.replace(/-[^-]+$/, ''))), count = v => Number.isInteger(v) && v >= 0;
  s.done = Object.fromEntries(Object.entries(s.done).filter(([k, v]) => lessons.has(k) && count(v)));
  s.ok = Object.fromEntries(Object.entries(s.ok).filter(([, v]) => count(v)));
  return s;
}

function touchStreak(s, today) {
  const gap = s.last < 0 ? Infinity : today - s.last;
  if (gap <= 0) return; // aynı gün ya da saat geri alınmış
  if (gap === 1 || (gap === 2 && s.freeze)) {
    s.streak++;
    if (gap === 2) { s.freeze = false; s.refill = 7; }
    else if (!s.freeze && --s.refill <= 0) s.freeze = true;
  } else { s.streak = 1; s.freeze = true; }
  s.last = today;
  s.bestStreak = Math.max(s.bestStreak, s.streak);
}

const liveStreak = (s, today) => s.last >= 0 && (today - s.last <= 1 || (today - s.last === 2 && s.freeze)) ? s.streak : 0;
const todayXp = (s, today) => s.day === today ? s.dayXp : 0;

function addXp(s, n, today) {
  touchStreak(s, today);
  if (s.day !== today) { s.day = today; s.dayXp = 0; }
  if (s.dayXp < GOAL && s.dayXp + n >= GOAL) s.goalDays++;
  s.dayXp += n; s.xp += n;
}

function record(s, id, type, right, today, z = 1) {
  const i = s.wrong.indexOf(id);
  if (!right) { if (i < 0) s.wrong.push(id); return; }
  s.ok[type] = (s.ok[type] || 0) + 1;
  s.ok['z' + z] = (s.ok['z' + z] || 0) + 1;
  if (i >= 0) { s.wrong.splice(i, 1); s.fixed++; }
  addXp(s, XP_Z[z], today);
}

function finishLesson(s, lid, right, total, today) {
  s.done[lid] = Math.max(s.done[lid] || 0, right);
  if (right === total) s.perfect++;
  addXp(s, XP_FINISH + (right === total ? XP_PERFECT : 0), today);
}

// "1.500" Türkçede 1500, klavyede 1,5 olabilir: iki yorum da aday.
function parseNum(str) {
  const t = String(str).replace(/\s/g, '').replace('−', '-');
  if (!/^-?[\d.,]+$/.test(t) || !/\d/.test(t)) return [];
  const c = new Set();
  if (t.includes(',')) c.add(Number(t.replace(/\./g, '').replace(',', '.')));
  else { c.add(Number(t)); if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) c.add(Number(t.replace(/\./g, ''))); }
  return [...c].filter(Number.isFinite);
}

function grade(q, ans, SIMS) {

    case 'ariza': return ans === q.a;

    case 'kur': return ans.every((v, i) => v === q.a[i]);
    case 'sim': { const m = SIMS[q.sim], x = m.calc(ans)[m.key]; return x >= m.min - 1e-9 && x <= m.max + 1e-9; }
    default: { const c = parseNum(ans); return c.length ? c.some(x => within(x, q.a)) : null; }

}

function clue(ans, a) {

const roadPath = n => { let d = 'M32 48'; for (let k = 1; k < n; k++) d += `V${96 * k - 24}L${k % 2 ? 88 : 32} ${96 * k + 32}V${96 * k + 48}`; return d; };

function bindBackup() {
  const st = $('#yst'), inp = $('#yfile'), note = (t, err) => { st.textContent = t; st.classList.toggle('err', err); };
  $('#ydown').onclick = async () => {
    const name = `akimli-yedek-${new Date(dayNum() * 864e5).toISOString().slice(0, 10)}.json`, file = new File([JSON.stringify(S)], name, { type: 'application/json' });
    // iPhone ana ekran uygulamasında <a download> çalışmaz; paylaşım menüsü Dosyalar'a kaydetmeyi sunar.
    if (navigator.standalone && navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file] }); note('Yedek paylaşıldı. Dosyayı güvenli bir yere koy.', false); }
      catch (e) { if (e.name !== 'AbortError') note('Paylaşılamadı. Bir daha dene.', true); }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = name;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1e4);
    note('Yedek indirildi. Dosyayı güvenli bir yere koy.', false);
  };
  $('#yup').onclick = () => inp.click();
  inp.onchange = async () => {
    const f = inp.files[0]; inp.value = '';
    if (!f) return;
    const raw = await f.text().catch(() => '');
    let p; try { p = JSON.parse(raw); } catch {}
    // parseState bozuk dosyada sıfır ilerleme döner; yedek olmayanı burada ayırırız.
    if (!p || typeof p !== 'object' || typeof p.xp !== 'number' || !p.done || typeof p.done !== 'object') return note('Bu dosya bir Akımlı yedeği değil. İlerlemen değişmedi.', true);
    const n = parseState(raw, Object.keys(QUESTIONS));
    if (!confirm(`Şu anki ilerlemen (${S.xp} XP, ${Object.keys(S.done).length} ders) silinip yedektekiyle (${n.xp} XP, ${Object.keys(n.done).length} ders) değiştirilsin mi?`)) return note('Yükleme iptal edildi.', false);
    S = n; save(); route(); setTimeout(() => $('#yst').textContent = 'Yedek yüklendi.', 100); // route ekranı yeniden çizer; yeni canlı bölge önce yerleşmeli ki okunsun
  };
}

/* ---------- Soru oturumu ---------- */
let C = null; // etkin oturum; lid yoksa Tekrar
const KIND = { mc: 'Çoktan seçmeli', num: 'Hesapla', oku: 'Renk kodu', kur: 'Renk kodu', ariza: 'Arızayı bul', sira: 'Sırala', sim: 'Simülasyon' };
function start(ids, lid, practice) { C = { queue: [...ids], total: ids.length, n: 0, right: 0, lid, practice, xp0: S.xp, had: BADGES.map(b => b[2](S)) }; question(); }
const answer = (v, ready = true) => { C.ans = v; $('#ok').disabled = !ready; };
const fig = q => q.c ? `<div class="fig">${circuit(q.c)}</div>` : '';
const optList = (q, badge) => `<div class="opts">${C.perm.map(i => `<button class="opt" aria-pressed="false" data-i="${i}">${badge ? '<kbd></kbd>' : ''}<span>${tx(q.o[i])}</span></button>`).join('')}</div>`;

// Önce tahmin: p[0] kaydırıcısı artınca p[1] çıktısı ne olur? Diğer kaydırıcılar başlangıç değerinde; yön calc'tan çıkar.
const PRED = ['Artar', 'Azalır', 'Değişmez'];
const simDir = m => { const v = Object.fromEntries(m.s.map(s => [s[0], s[5]])), k = m.s.find(s => s[0] === m.p[0]), y = x => m.calc({ ...v, [k[0]]: x })[m.p[1]], d = y(k[3]) - y(k[2]); return d > 1e-9 ? 0 : d < -1e-9 ? 1 : 2; };
const simPred = m => { const y = m.out.find(o => o[0] === m.p[1])[1]; return [m.s.find(s => s[0] === m.p[0])[1], /^\p{Lu}\p{Ll}/u.test(y) ? y[0].toLocaleLowerCase('tr') + y.slice(1) : y]; };

// Arıza sorusu: etiketteki "|" sonrası rakamlı ölçü, kullanıcı ölçene kadar gizli kalır.
const reading = e => { const m = (e && e[5] || '').split('|')[1]; return m && /\d/.test(m) ? m : ''; };
const VIEW = {
  mc: q => { C.perm = shuffle(q.o.length); return fig(q) + optList(q); },
  num: q => (q.b ? `<div class="fig">${resistor(q.b)}</div><p class="note">Bantlar: ${q.b.join(', ')}</p>` : fig(q)) + `<form class="num"><input id="n" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-label="Cevap, birim ${q.u}" aria-describedby="nerr"><b>${q.u}</b></form><p class="note" id="nerr" aria-live="polite">±%2 tolerans. Virgül veya nokta kullanabilirsin.</p>`,
  kur: () => `<div class="fig" id="res"></div><div class="slots">${[0, 1, 2].map(i => `<button data-s="${i}"></button>`).join('')}</div><div class="pal">${COLORS.map(c => `<button data-c="${c}"><i style="background:${HEX[c]}"></i>${c}</button>`).join('')}</div>`,
  ariza: q => { const m = q.c.some(e => e[6] && reading(e)); return (m ? '<div class="seg" role="group" aria-label="Dokunma modu"><button aria-pressed="true">Ölç</button><button aria-pressed="false">Seç</button></div>' : '') + `<div class="fig">${circuit(q.c, { pick: true })}</div>` + (m ? '<p class="dmm" aria-live="polite"><small>Ölçmek için bir elemana dokun. Arızalıyı bulunca Seç’e geç.</small></p>' : ''); },
  sira: q => { do C.perm = shuffle(q.o.length); while (C.perm.every((v, i) => v === i)); return '<p class="note">İlk sıradan başlayarak dokun. Geri almak için tekrar dokun.</p>' + optList(q, true); },
  sim: q => { const [x, y] = simPred(SIMS[q.sim]); return `<div class="fig" id="sv"></div><div class="read" id="rd"></div><div class="pred"><p><b>Önce tahmin et.</b> ${tx(x)} artarsa ${tx(y)} ne olur?</p><div class="opts">${PRED.map((o, i) => `<button class="opt" aria-pressed="false" data-p="${i}"><span>${o}</span></button>`).join('')}</div><p class="note" id="pn" aria-live="polite"></p></div><div>${SIMS[q.sim].s.map(([k, n, a, b, st, v]) => `<label class="sl"><span>${tx(n)}</span><b id="o-${k}"></b><input type="range" id="s-${k}" min="${a}" max="${b}" step="${st}" value="${v}" disabled></label>`).join('')}</div><p class="note" id="warn" aria-live="polite"></p>`; }
};
const BIND = {
  mc: () => $$('.opt').forEach(b => b.onclick = () => { $$('.opt').forEach(x => x.setAttribute('aria-pressed', x === b)); answer(+b.dataset.i); }),
  num: () => { const n = $('#n'); n.oninput = () => answer(n.value, n.value.trim() !== ''); $('form').onsubmit = e => { e.preventDefault(); if (!$('#ok').disabled) check(); }; },
  kur: () => {
    const v = [null, null, null], names = ['1. rakam', '2. rakam', 'Çarpan']; let cur = 0;
    const draw = () => { $$('[data-s]').forEach((b, i) => { b.setAttribute('aria-pressed', i === cur); b.textContent = v[i] ? `${names[i]}: ${v[i]}` : names[i]; }); $('#res').innerHTML = resistor([...v, 'altın']); };
    $$('[data-s]').forEach((b, i) => b.onclick = () => { cur = i; draw(); });
    $$('[data-c]').forEach(b => b.onclick = () => { v[cur] = b.dataset.c; const e = v.indexOf(null); if (e >= 0) cur = e; draw(); answer([...v], e < 0); });
    draw();
  },
  ariza: q => {
    const hid = {}, seg = $$('.seg button'), val = p => reading(q.c.find(e => e[6] === p.dataset.id)); let olc = seg.length > 0, n = 0;
    const sel = p => { if (C.checked) return; $$('.part').forEach(x => x.setAttribute('aria-checked', x === p)); answer(p.dataset.id); };
    const show = p => { const h = hid[p.dataset.id]; if (!h) return; $('.me', p).innerHTML = h[0]; p.setAttribute('aria-label', h[1]); hid[p.dataset.id] = null; };
    const meas = p => { const v = val(p); if (hid[p.dataset.id]) n++; show(p); $('.dmm').innerHTML = `<small>${tx(p.dataset.id)}</small><b>${v ? esc(v) : '– – –'}</b><small>${v ? `${n} ölçüm` : 'Burada ölçüm yok'}</small>`; };
    if (olc) $$('.part').forEach(p => { const v = val(p), t = $('.me', p), l = p.getAttribute('aria-label'); if (v && t) { hid[p.dataset.id] = [t.innerHTML, l]; t.textContent = '?'; p.setAttribute('aria-label', l.replace(', ölçülen ' + v, '')); } });
    seg.forEach((b, i) => b.onclick = () => { olc = !i; seg.forEach(x => x.setAttribute('aria-pressed', x === b)); });
    $$('.part').forEach(p => { p.onclick = () => (olc ? meas : sel)(p); p.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); (olc ? meas : sel)(p); } }; });
    $('#ok').addEventListener('click', () => $$('.part').forEach(show)); // cevaptan sonra tüm ölçüler görünür
  },
  sira: q => {
    const seq = [];
    $$('.opt').forEach(b => b.onclick = () => {
      const i = +b.dataset.i, k = seq.indexOf(i);
      if (k < 0) seq.push(i); else seq.splice(k, 1);
      $$('.opt').forEach(x => { const p = seq.indexOf(+x.dataset.i); x.setAttribute('aria-pressed', p >= 0); $('kbd', x).textContent = p < 0 ? '' : p + 1; });
      answer([...seq], seq.length === q.o.length);
    });
  },
  sim: q => {
    let go = false; C.miss = '';
    const m = SIMS[q.sim], upd = () => {
      const v = {}; m.s.forEach(([k, , , , , , u]) => { const i = $('#s-' + k), s = `${fmt(v[k] = +i.value)} ${u}`; $('#o-' + k).textContent = s; i.setAttribute('aria-valuetext', s); });
      const r = m.calc(v);
      $('#rd').innerHTML = m.out.map(([k, n, u]) => `<div>${tx(n)}<b>${fmt(+r[k].toFixed(3))} ${u}</b></div>`).join('');
      $('#sv').innerHTML = SIMVIEW[q.sim](v, r, Math.min(1, m.glow(r)));
      $('#warn').textContent = m.warn ? m.warn(r) : '';
      answer(v, go);
    };
    $$('[data-p]').forEach(b => b.onclick = () => {
      const d = simDir(m), ok = +b.dataset.p === d, [x, y] = simPred(m);
      $$('[data-p]').forEach(o => { o.disabled = true; o.setAttribute('aria-pressed', o === b); });
      b.classList.add(ok ? 'good' : 'bad');
      $('#pn').textContent = ok ? 'Doğru tahmin.' : 'Tahminin tutmadı, simülasyonda kendin gör.';
      if (!ok) C.miss = `${x} artınca ${y} ${PRED[d].toLocaleLowerCase('tr')}.`;
      go = true; $$('.sl input').forEach(i => i.disabled = false); upd();
      $('.sl input').focus(); // basılan düğme kilitlendi; odak açılan ilk kaydırıcıya geçer
    });
    m.s.forEach(s => $('#s-' + s[0]).oninput = upd); upd();
  }
};
VIEW.oku = VIEW.num; BIND.oku = BIND.num;
const SIMVIEW = {
  ohm: (v, r, glow) => circuit(loop(`${fmt(v.V)} V`, [['L', 'Lamba', `${fmt(v.R)} Ω`]]), { glow }),
  led: (v, r, glow) => circuit(loop(`${fmt(v.V)} V`, [['R', 'R', `${fmt(v.R)} Ω`], ['LED', 'LED', '2 V']]), { glow }),
  bolucu: v => circuit([...loop('12 V', [['R', 'R1', `${fmt(v.R1)} kΩ`], ['R', 'R2', `${fmt(v.R2)} kΩ`]]), ['N', 280, 40], ['N', 280, 180]]),
  rc: (v, r) => rcCurve(r.T),
  bjt: (v, r, glow) => circuit(bjtFixed(`${fmt(v.RB)} kΩ`, `${fmt(v.RC)} kΩ`, 'L'), { glow }),
  opamp: v => circuit(opNon(['R', 'R1', `${fmt(v.R1)} kΩ`], ['R', 'R_F', `${fmt(v.RF)} kΩ`], { vi: 'V_i\n0,5 V' })),
  buck: v => circuit(buck({ vin: `${fmt(v.V)} V`, t: `|D = %${fmt(v.D)}` })),
  hb: v => circuit(hbridge({ m: `D = %${fmt(v.D)}` }))
};

function question() {
  const q = C.q = QUESTIONS[C.queue[0]]; C.ans = null; C.checked = false;
  app.innerHTML = `<main class="scr"><div class="top"><button class="x" data-go="${C.lid ? 'ana' : 'tekrar'}" aria-label="Çık">${ICON.x}</button>${bar(C.n, C.total, 'İlerleme')}<output>${C.lid ? `${C.n + 1}/${C.total}` : `${C.queue.length} kaldı`}</output></div>
  <div><p class="kind">${zTag(q.z)} · ${KIND[q.t]}</p><h1 class="q" tabindex="-1">${tx(q.q)}</h1></div>${VIEW[q.t](q)}</main><div class="foot" aria-live="polite"><button class="btn" id="ok" disabled>Kontrol et</button></div>`;
  BIND[q.t](q);
  $('#ok').onclick = check;
  focusTop();
}

function check() {
  if (C.checked) return;
  const q = C.q, id = C.queue[0], ok = grade(q, C.ans, SIMS);
  if (ok === null) { const e = $('#nerr'); e.textContent = 'Bunu sayı olarak okuyamadım. Yalnızca rakam yaz, örneğin 2,5.'; e.className = 'note err'; $('#n').focus(); return; }
  C.checked = true; C.queue.shift();
  record(S, id, q.t, ok, dayNum(), q.z);
  if (ok) C.right++;
  if (ok || C.lid) C.n++; else C.queue.push(id); // Tekrar'da yanlış soru kuyruğun sonuna döner
  if (C.lid && !C.queue.length) finishLesson(S, C.lid, C.right, C.total, dayNum());
  save();
  const mark = (el, v) => { if (v === String(q.a)) el.classList.add('good'); else if (v === String(C.ans)) el.classList.add('bad'); };
  if (q.t === 'mc') $$('.opt').forEach(b => mark(b, b.dataset.i));
  if (q.t === 'ariza') $$('.part').forEach(p => mark(p, p.dataset.id));
  if (q.t === 'sira' && !ok) $$('.opt').sort((a, b) => a.dataset.i - b.dataset.i).forEach((b, i) => { $('kbd', b).textContent = i + 1; b.parentNode.append(b); });
  $$('main button:not(.x),main input').forEach(b => b.disabled = true);
  const right = { mc: () => q.o[q.a], ariza: () => q.a, kur: () => q.a.join(', '), num: () => `${fmt(q.a)} ${q.u}`, oku: () => `${fmt(q.a)} ${q.u}`, sira: () => 'sıra yukarıda', sim: () => '' }[q.t]();
  const foot = $('.foot'), hint = !ok && (q.t === 'num' || q.t === 'oku') ? clue(C.ans, q.a) : '';
  foot.className = 'foot ' + (ok ? 'good' : 'bad');
  foot.innerHTML = `<div class="fb">${mascot(ok ? 'iyi' : 'kotu')}<div><h2>${ok ? `Doğru, +${XP_Z[q.z]} XP` : 'Yanlış'}</h2>${ok ? '' : `${right ? `<p><b>Doğru cevap: ${tx(right)}</b></p>` : ''}${hint ? `<p>${tx(hint)}</p>` : ''}<p>${tx(q.e)}</p>`}<code>${tx(q.f)}</code></div></div><button class="btn" id="nx">Devam</button>`;
  if (q.t === 'sim' && C.miss) $('.fb h2').insertAdjacentHTML('afterend', `<p>${tx(C.miss)}</p>`);
  $('#nx').onclick = () => C.queue.length ? question() : finish();
  $('#nx').focus({ preventScroll: true });
}

function finish() {
  const t = dayNum(), wrong = C.lid ? C.total - C.right : 0, fresh = BADGES.filter((b, i) => !C.had[i] && b[2](S));
  app.innerHTML = `<main class="scr"><div class="end">${mascot(wrong < 3 ? 'iyi' : 'normal')}<h1 tabindex="-1">${!C.lid ? (C.practice ? 'Antrenman tamam' : 'Tekrar temizlendi') : wrong ? 'Ders tamam' : 'Hatasız bitirdin'}</h1>
  <dl class="tbl"><dt>Kazanılan</dt><dd>${S.xp - C.xp0} XP</dd>${C.lid ? `<dt>Doğru</dt><dd>${C.right} / ${C.total}</dd>` : ''}<dt>Bugün</dt><dd>${todayXp(S, t)} / ${GOAL} XP</dd><dt>Seri</dt><dd>${liveStreak(S, t)} gün</dd>${fresh.map(b => `<dt>Yeni rozet</dt><dd>${b[0]}</dd>`).join('')}</dl></div></main>
  <div class="foot">${wrong ? '<button class="btn" data-go="tekrar-coz">Yanlışları tekrar et</button><button class="btn alt" data-go="ana">Derslere dön</button>' : '<button class="btn" data-go="ana">Derslere dön</button>'}</div>`;
  focusTop();
}

/* ---------- Yönlendirme: Android geri tuşu hash geçmişiyle çalışır ---------- */
function route() {
  const h = location.hash.slice(1), l = LESSONS.find(x => 'ders-' + x.id === h);
  if (shown) scrollMem[shown] = scrollY;
  shown = null;
  if (l && unlocked(l)) return start(l.qs.map((_, i) => `${l.id}-${i + 1}`), l.id);
  if (h === 'tekrar-coz' && S.wrong.length) return start(S.wrong, null);
  const pz = /^pratik-([123])$/.exec(h);
  if (pz) { const ids = byZ(+pz[1]), p = shuffle(ids.length).slice(0, 8); return start(p.map(i => ids[i]), null, true); }
  C = null;
  shown = h === 'profil' ? 'profil' : h.startsWith('tekrar') ? 'tekrar' : 'ana';
  app.innerHTML = { profil: profile, tekrar: review, ana: home }[shown]();
  if (shown === 'profil') { bindReminder(); bindBackup(); }
  focusTop(scrollMem[shown] || 0);
  // Uygulama yeni açıldığında sıradaki ders ekranın ortasına gelir.
  if (shown === 'ana' && !(shown in scrollMem) && S.xp) $('.node.next')?.scrollIntoView({ block: 'center' });
}
app.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (!b || b.disabled) return;
  if ('#' + b.dataset.go === location.hash) route(); else location.hash = b.dataset.go;
});
addEventListener('hashchange', route);
// iOS klavyesi sayfayı küçültmez; alt çubuğu klavyenin üstüne taşı. Android'de fark 0 çıkar.
const vv = window.visualViewport;
if (vv) vv.onresize = vv.onscroll = () => document.documentElement.style.setProperty('--kb', (vv.scale > 1.01 ? 0 : Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop))) + 'px');
route();
shareState();
if (S.rem) armReminder(false); // kayıt silinmişse açılışta yeniden kurar
</script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
navigator.storage?.persist?.().catch(() => {}); // tarayıcıdan kaydı silmemesini ister
</script>
