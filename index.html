      { t: 'mc', q: 'Gate ile source arasındaki R_PD direnci neden konur?', c: LOWSIDE, fl: null, o: ['Sürücü yokken (reset, kopuk kablo) gate\'i 0 V\'ta tutup MOSFET\'i kapalı tutmak için', 'Gate akımını artırmak için', 'Anahtarlamayı hızlandırmak için', 'Drain akımını ölçmek için'], a: 0,
        e: 'Yüzen gate, kaçak ve kuplajla yükselip MOSFET\'i yarı iletime sokabilir. MCU açılırken pinler bir süre yüksek empedanstadır.', f: 'Güvenli durum: V_GS = 0' },
      { t: 'ariza', q: 'MOSFET birkaç anahtarlamada yandı. Kapanışta V_DS\'de 85 V tepe ölçülüyor (besleme 24 V). Sorunlu elemana dokun.', c: LOWSIDE, fl: [{ p: [[180, 24], [150, 24], [150, 110], [150, 120], [150, 180], [150, 200]], v: [24, 24, 85, 85, 0, 0], i: 500 }], a: 'D',
        e: 'Diyot sağlamken V_DS en fazla 24 V + V_F ≈ 25 V olur. 85 V, bobin akımının gidecek yeri olmadığını gösterir: D açık devre ya da takılmamış.', f: 'Yol yoksa di/dt çok büyük → v = L·di/dt' },
      { t: 'num', q: '24 V besleme %35 görev oranıyla PWM ediliyor. Yüke düşen ortalama gerilim kaç V?', a: 8.4, u: 'V',
        e: 'Ortalama gerilim, iletim süresinin periyoda oranıyla orantılıdır.', f: 'V_ort = D · V = 0,35 × 24 = 8,4 V' } ] },
    { name: 'H köprüsü', z: 2, k: [
      { h: 'Dört anahtar, iki yön', p: 'Motor, iki kolun orta noktaları A ile B arasındadır. Çaprazdaki iki MOSFET iletince akım bir yönde akar, öteki çapraz çift yönü çevirir. Akım her an iki MOSFET\'ten seri geçer, kayıp da ikisinde oluşur.',
        f: ['Çapraz çift iletir: yönü hangi çaprazın açık olduğu belirler', 'Ters yön: öteki çapraz çift', 'P_iletim = 2 · I² · R_DS(on)'], c: hbridge(), fl: [{ p: [[160, 24], [84, 24], [84, 50], [84, 110], [84, 130], [236, 130], [236, 150], [236, 210], [236, 236], [160, 236]], v: [24, 24, 24, 23.9, 23.9, 0.1, 0.1, 0, 0, 0], i: 2000 }] },
      { h: 'Yasak durum ve fren', p: 'Aynı koldaki üst ve alt MOSFET birlikte açılırsa beslemeyi kısa devre eder; buna shoot-through denir. Sürücü, birini kapatıp ötekini açmadan önce kısa bir ölü zaman bekler. Motor uçları kısa devre edilirse dönen motor kendi zıt EMK\'sıyla frenlenir.',
        f: ['Shoot-through: I = V / (R_DS1 + R_DS2)', 'Fren: I = E / R_a'] },
      { h: 'Hız ve yön: PWM ortalaması', p: 'Kilitli ters faz sürüşte köprü her periyotta iki yön arasında gidip gelir; motor ortalamayı görür. D = %50 sıfır verir, üstü bir yön, altı öteki yöndür. Kaydırıcılarla dene.',
        f: ['V_ort = (2D − 1) · V', 'Örnek: 24 V, D = %75 → +12 V'], sim: 'hb',
        r: 'Gerçek hayatta: Robot süpürgenin tekerlek motorları H köprüsüyle sürülür; aynı köprü ileri, geri ve fren için kullanılır.' },
      { h: 'Dikkat: düğümleri oku', p: 'İletimdeki üst MOSFET kendi düğümünü + raya, alttaki toprağa çeker. Bir düğüm komuta uymuyorsa o düğüme bağlı MOSFET\'lerden birine şüphelen. Akım sıfırsa yol bir yerde açık kalmıştır; akım çok büyükse bir yerde kısa devre vardır.' } ], qs: [
      { t: 'mc', fa: 1, q: 'Motor akımının A\'dan B\'ye akması için hangi MOSFET\'ler iletimde olmalı?', c: hbridge(), fl: [{ p: [[160, 24], [84, 24], [84, 50], [84, 110], [84, 130], [236, 130], [236, 150], [236, 210], [236, 236], [160, 236]], v: [24, 24, 24, 23.9, 23.9, 0.1, 0.1, 0, 0, 0], i: 2000 }], o: ['Q1 ve Q4', 'Q1 ve Q2', 'Q3 ve Q4', 'Q2 ve Q3'], a: 0,
        e: 'Akım + raydan Q1 ile A\'ya, motordan B\'ye, Q4 ile toprağa gider. Çaprazdaki çift yönü belirler.', f: '+24 V → Q1 → A → motor → B → Q4 → toprak' },
      { t: 'mc', fa: 1, q: 'Aynı koldaki Q1 ve Q2 aynı anda iletime girerse ne olur?', c: hbridge(), fl: [{ p: [[160, 24], [84, 24], [84, 50], [84, 110], [84, 150], [84, 210], [84, 236], [160, 236]], v: [24, 24, 24, 12, 12, 0, 0, 0], i: 200000 }], o: ['Besleme kısa devre olur (shoot-through), MOSFET\'ler yanabilir', 'Motor hızlanır', 'Motor ters döner', 'Hiçbir şey olmaz'], a: 0,
        e: 'Bu yüzden sürücüler bir MOSFET kapanıp diğeri açılmadan önce ölü zaman (dead time) bırakır.', f: 'I = 24 V / (R_DS1 + R_DS2) → yüzlerce amper' },
      { t: 'mc', fa: 1, q: 'Q1 ve Q3 kesimdeyken Q2 ve Q4 birlikte iletime alınırsa dönen motor nasıl davranır?', c: hbridge(), fl: [{ p: [[84, 130], [84, 150], [84, 210], [84, 236], [236, 236], [236, 210], [236, 150], [236, 130], [84, 130]], v: [0.2, 0.2, 0, 0, 0, 0, -0.2, -0.2, 0.2], i: 2000 }], o: ['Uçları kısa devre olur, dinamik fren yapar', 'Tam hızla döner', 'Ters yönde hızlanır', 'Bus\'ı şarj eder'], a: 0,
        e: 'Dönen motor zıt EMK üretir; kısa devre edilen uçlardan akan akım frenleyici tork verir.', f: 'I = E / R_a, T = K_t · I (frenleyici)' },
      { t: 'sim', sim: 'hb', q: 'Kilitli ters faz (locked anti-phase) PWM ile motor ortalama gerilimini +9,6 V yap (±0,3 V).',
        e: 'Bu yöntemde köprü sürekli yön değiştirir; %50 görev oranı 0 V verir.', f: 'V_ort = (2D − 1)·V, örneğin 24 V, D = %70 → 9,6 V' },
      { t: 'num', q: 'İletimdeki iki MOSFET\'in her biri 15 mΩ, motor akımı 8 A. Köprünün toplam iletim kaybı kaç W?', a: 2 * 64 * 0.015, u: 'W',
        e: 'Akım her an iki MOSFET\'ten seri geçer.', f: 'P = 2 · I² · R = 2 × 64 × 0,015 = 1,92 W' },
      { t: 'ariza', q: 'Q1 ve Q4\'e iletim komutu verildi, motor akımı 0 A. A ve B düğümlerini ölç, arızalı MOSFET\'e dokun.', c: hbridge({ ra: '|A = 24 V', rb: '|B = 24 V' }), fl: null, a: 'Q4',
        e: 'Q1 iletimde, A = 24 V. Q4 iletseydi B toprağa yakın olurdu. B = 24 V ve akım 0 ise Q4 iletmiyor. Q3 kısa devre olsaydı B yine 24 V olur ama Q4 üzerinden büyük akım akardı.', f: 'Beklenen: V_A − V_B ≈ 24 V' } ] },
    { name: 'Sürüş ve kayıplar', z: 3, k: [
      { h: 'İki tür kayıp', p: 'MOSFET iletimdeyken R_DS(on) üzerinde, açılıp kapanırken de geçiş anında ısınır. Geçişte gerilim ve akım bir an birlikte bulunur; bu kayıp her periyotta tekrarlandığı için frekansla büyür. R_DS(on) sıcakta artar, hesap sıcak değerle yapılır.',
        f: ['P_iletim = I² · R_DS(on) (sıcak değer)', 'P_anahtarlama ≈ ½ · V · I · (t_r + t_f) · f_sw', 'P_gate = Q_g · V_GS · f_sw (sürücüden çekilir)'] },
      { h: 'Gate sürüşü', p: 'High-side MOSFET\'in gate\'ini bootstrap kondansatörü sürer; her açılışta ona Q_g kadar yük verir. Faz düğümünün hızlı dv/dt\'si, C_gd üzerinden kapalı MOSFET\'in gate\'ine akım basar. Kapatma yolu zayıfsa gate V_th\'yi aşar ve shoot-through olur.',
        f: ['C_boot ≥ Q_g / ΔV', 'V_GS ≈ C_gd · dV/dt · R_kapatma'] },
      { h: 'Ölü zaman bedava değil', p: 'Ölü zamanda iki MOSFET de kapalıdır; akımı gövde diyodu taşır ve çıkış gerilimini akımın yönü belirler. Her periyotta kaybedilen bu kısa süre, ortalama gerilimde küçük bir hata yaratır.',
        f: ['ΔV ≈ V_dc · t_d · f_sw'] },
      { h: 'Isı bir dizi dirençten geçer', p: 'Isıl direnç, her watt için kaç derece ısınma olduğunu söyler (°C/W). Isı jonksiyondan kılıfa, kılıftan soğutucuya, oradan havaya seri bir yoldan geçer; dirençler toplanır.',
        f: ['T_j = T_a + P · (R_th,jc + R_th,cs + R_th,sa)'],
        r: 'Gerçek hayatta: Drone ESC\'sindeki küçük MOSFET\'ler soğutucusuzdur, pervane rüzgârıyla soğur. 2 W kayıp ve toplam 40 °C/W ile jonksiyon ortamdan 80 °C sıcak olur; 30 °C\'lik bir günde 110 °C eder.' } ], qs: [
      { t: 'mc', q: 'Yarım köprüde üst MOSFET hızlı açılınca alt MOSFET\'in gate\'inde gerilim sıçraması görülüyor. En doğrudan çözüm hangisi?', o: ['Alt MOSFET için güçlü kapatma yolu: küçük R_g,off veya Miller clamp', 'Gate direncini 10 kat büyütmek', 'Ölü zamanı sıfırlamak', 'Besleme gerilimini yükseltmek'], a: 0,
        e: 'Faz düğümündeki dv/dt, C_gd üzerinden alt gate\'e akım basar. Bu akım kapatma yolu direncinde gerilim oluşturur; V_th\'yi aşarsa shoot-through olur.', f: 'V_GS ≈ C_gd · dV/dt · (R_g,off + R_sürücü)' },
      { t: 'num', q: 'R_DS(on) 25 °C\'de 8 mΩ ve 110 °C\'de 1,6 katına çıkıyor. 10 A\'de sıcak durumdaki iletim kaybı kaç W?', a: 100 * 0.008 * 1.6, u: 'W',
        e: 'Isıl hesap en kötü durumda, sıcak R_DS(on) ile yapılır. 25 °C değeriyle yapılan hesap kaybı küçük gösterir.', f: 'P = 10² × 8 mΩ × 1,6 = 1,28 W' },
      { t: 'num', q: '48 V, 10 A anahtarlanıyor; t_r + t_f = 60 ns, f_sw = 100 kHz. Yaklaşık anahtarlama kaybı kaç W?', a: 0.5 * 48 * 10 * 60e-9 * 1e5, u: 'W',
        e: 'Geçiş sırasında gerilim ve akım aynı anda vardır. Kayıp frekansla doğru orantılıdır.', f: 'P ≈ ½ · V · I · (t_r + t_f) · f = ½ × 48 × 10 × 60 ns × 100 kHz = 1,44 W' },
      { t: 'num', q: 'High-side MOSFET\'in Q_g\'si 100 nC. Bootstrap kondansatöründe her açılışta en fazla 0,5 V düşüm isteniyor. Minimum C_boot kaç nF?', a: 200, u: 'nF',
        e: 'Gate yükü bootstrap kondansatöründen çekilir. Pratikte bu minimumun birkaç katı seçilir.', f: 'C ≥ Q_g / ΔV = 100 nC / 0,5 V = 200 nF' },
      { t: 'num', q: 'V_dc = 48 V, ölü zaman 500 ns, f_sw = 20 kHz. Ölü zamanın yarattığı ortalama gerilim hatası kaç V?', a: 48 * 500e-9 * 20e3, u: 'V',
        e: 'Ölü zamanda çıkış gerilimi akım yönüne göre diyot tarafından belirlenir. Düşük hızda motor akımını bozar.', f: 'ΔV ≈ V_dc · t_d · f_sw = 48 × 500 ns × 20 kHz = 0,48 V' },
      { t: 'num', q: 'MOSFET 5 W harcıyor. R_th,jc = 0,8, R_th,cs = 0,5, R_th,sa = 6 °C/W, ortam 40 °C. Jonksiyon sıcaklığı kaç °C?', a: 40 + 5 * 7.3, u: '°C',
        e: 'Isıl dirençler seri toplanır. Termal ped (R_th,cs) çoğu zaman ihmal edilemez.', f: 'T_j = 40 + 5 × (0,8 + 0,5 + 6) = 76,5 °C' } ] } ] },

  { name: 'Anahtarlamalı güç kaynakları', lessons: [
    { name: 'Buck dönüştürücü', z: 1, k: [
      { h: 'Doğrayıp ortalamak', p: 'Buck, girişi S anahtarıyla hızla açıp kapatır; L ile C bu darbeleri düzgün bir DC\'ye ortalar. S kesime girince endüktör akımı duramaz, volan gibi D diyotu üzerinden dönmeye devam eder. Kalıcı durumda kondansatörün ortalama akımı sıfırdır, yani endüktörün ortalama akımı yük akımıdır.',
        f: ['Ī_L = I_o', 'Kesimde: v_L = −V_o'], c: buck(), fl: [{ p: [[120, 50], [220, 50], [290, 50], [290, 180], [120, 180], [120, 50]], v: [-0.7, 5, 5, 0, 0, -0.7], i: 1000 }] },
      { h: 'Görev oranı gerilimi belirler', p: 'CCM\'de çıkış gerilimi, giriş geriliminin görev oranı kadarıdır. Kaydırıcılarla giriş gerilimini ve görev oranını değiştirip çıkışı izle.',
        f: ['V_o = D · V_in', 'D = V_o / V_in'], sim: 'buck' },
      { h: 'Güç korunur, akım artar', p: 'İdeal dönüştürücüde giriş gücü çıkış gücüne eşittir: gerilim düşerken akım artar, girişten çekilen akım yük akımından küçüktür. Gerçekte anahtar, diyot ve endüktör ısınır; verim %85–95 dolayındadır.',
        f: ['V_in · I_in = V_o · I_o (ideal)', 'η = P_çıkış / P_giriş'],
        r: 'Gerçek hayatta: Arabanın USB şarj soketi 12 V aküden buck ile 5 V üretir. Telefona 5 V, 2 A (10 W) verirken %90 verimle aküden yaklaşık 0,93 A çeker.' } ], qs: [
      { t: 'num', q: 'İdeal buck dönüştürücü 12 V\'tan 5 V üretiyor. Görev oranı yüzde kaç?', c: buck({ vin: '12 V' }), fl: null, a: 500 / 12, u: '%',
        e: 'CCM\'de buck çıkışı, giriş geriliminin görev oranı kadarıdır.', f: 'D = V_o / V_in = 5 / 12 = %41,7' },
      { t: 'mc', q: 'CCM\'de çalışan buck dönüştürücüde endüktör akımının ortalaması neye eşittir?', o: ['Çıkış (yük) akımına', 'Giriş akımına', 'Sıfıra', 'Tepe akımın iki katına'], a: 0,
        e: 'Kalıcı durumda kondansatörün ortalama akımı sıfırdır; endüktör akımı ortalamada yüke gider.', f: 'Ī_L = I_o' },
      { t: 'mc', fa: 1, q: 'S kesime girince endüktör akımı hangi yoldan akmaya devam eder?', c: buck({ vin: '12 V' }), fl: [{ p: [[120, 50], [220, 50], [290, 50], [290, 180], [120, 180], [120, 50]], v: [-0.7, 5, 5, 0, 0, -0.7], i: 1000 }], o: ['D diyotu üzerinden', 'Kaynak üzerinden', 'Kondansatörden toprağa', 'Akım hemen sıfırlanır'], a: 0,
        e: 'Endüktör akımı aniden değişemez; anahtarlama düğümünü negatife çekerek diyotu iletime sokar.', f: 'v_L = −V_o (kesimde)' },
      { t: 'num', q: 'Dönüştürücü 15 W veriyor ve girişten 16,5 W çekiyor. Verim yüzde kaç?', a: 1500 / 16.5, u: '%',
        e: 'Aradaki 1,5 W ısıya dönüşür: anahtar, diyot, endüktör ve kondansatör kayıpları.', f: 'η = 15 / 16,5 = %90,9' },
      { t: 'sim', sim: 'buck', q: 'Buck çıkışını 5 V yap (±0,1 V).',
        e: 'İdeal buck\'ta çıkış görev oranıyla doğru orantılıdır.', f: 'V_o = D · V_in, örneğin 12 V × %42 = 5,04 V' },
      { t: 'num', q: 'İdeal buck 12 V\'tan 5 V, 3 A veriyor. Girişten çekilen ortalama akım kaç A?', a: 15 / 12, u: 'A',
        e: 'Kayıpsız dönüştürücüde giriş ve çıkış gücü eşittir. Buck gerilimi düşürür, akımı artırır.', f: 'I_in = 5 × 3 / 12 = 1,25 A' } ] },
    { name: 'Boost ve buck-boost', z: 2, k: [
      { h: 'Boost: bobinin tekmesi', p: 'S iletince endüktör girişten akım çekip enerji depolar. S açılınca endüktör akımını sürdürmek için kendi gerilimini girişe ekler ve D üzerinden çıkışı doldurur. Endüktör akımı yalnız (1 − D) süresince çıkışa gittiği için ortalaması yük akımından büyüktür.',
        f: ['V_o = V_in / (1 − D)', 'Ī_L = I_o / (1 − D)'], c: BOOST, fl: [{ p: [[30, 50], [130, 50], [220, 50]], v: [5, 12, 12], i: 2400 }, { p: [[220, 50], [220, 180]], v: [12, 0], i: 1400 }, { p: [[220, 50], [290, 50], [290, 180], [220, 180]], v: [12, 12, 0, 0], i: 1000 }, { p: [[220, 180], [30, 180]], v: [0, 0], i: 2400 }],
        r: 'Gerçek hayatta: Powerbank, 3,7 V\'luk Li-ion hücreden USB\'nin 5 V\'unu boost ile üretir: D = 1 − 3,7 / 5 ≈ %26. Hücre 3,2 V\'a inince denetleyici D\'yi %36\'ya çıkarır.' },
      { h: 'Buck-boost: ters işaretli çıkış', p: 'S iletirken enerji yalnız endüktörde birikir, S kesilince D üzerinden çıkışa boşalır. Çıkış girişe göre negatiftir; D = 0,5\'te büyüklük girişe eşittir, altında düşük, üstünde yüksektir.',
        f: ['|V_o| = V_in · D / (1 − D)'], c: BBINV, fl: [{ p: [[120, 180], [220, 180]], v: [0, 0], i: 1667 }, { p: [[220, 180], [220, 50]], v: [0, -8], i: 667 }, { p: [[220, 180], [290, 180], [290, 50], [220, 50]], v: [0, 0, -8, -8], i: 1000 }, { p: [[220, 50], [120, 50], [120, 180]], v: [-8, -8, 0], i: 1667 }] },
      { h: 'Dalgalanma ve DCM', p: 'Endüktör akımı her periyotta bir üçgen çizer; eğimi, endüktör üstündeki gerilimin L\'ye oranıdır. Buck\'ta iletim süresince L\'ye V_in − V_o düşer. Yük akımı dalgalanmanın yarısının altına inerse akım her periyotta sıfıra değer: bu DCM\'dir ve V_o artık yüke de bağlıdır.',
        f: ['di/dt = v_L / L', 'ΔI_L = (V_in − V_o) · D / (L · f_sw) (buck)', 'DCM sınırı: I_o < ΔI_L / 2'] },
      { h: 'Dikkat: anahtarlama düğümü', p: 'Sağlam dönüştürücüde anahtarlama düğümü kare dalga yapar; buck\'ta ortalaması çıkış gerilimine yakındır. Düğüm hep aynı gerilimde takılı kalıyorsa, onu o gerilime bağlayan elemanı düşün.' } ], qs: [
      { t: 'num', q: 'Boost dönüştürücü 5 V\'tan 12 V üretiyor. Görev oranı yüzde kaç?', c: BOOST, fl: null, a: (1 - 5 / 12) * 100, u: '%',
        e: 'Boost\'ta V_o = V_in / (1 − D).', f: 'D = 1 − 5/12 = %58,3' },
      { t: 'num', q: 'Buck: 12 V → 5 V, L = 10 µH, f_sw = 500 kHz. Endüktör akımının tepeden tepeye dalgalanması kaç A?', a: 7 * (5 / 12) / (10e-6 * 5e5), u: 'A',
        e: 'İletim süresince endüktöre V_in − V_o uygulanır.', f: 'ΔI = (V_in − V_o)·D / (L·f) = 7 × 0,417 / (10 µH × 500 kHz) = 0,583 A' },
      { t: 'num', q: 'Boost dönüştürücüde D = 0,6, yük akımı 1 A. Endüktörün ortalama akımı kaç A?', a: 2.5, u: 'A',
        e: 'Boost\'ta endüktör akımı yalnız (1 − D) süresince yüke gider.', f: 'Ī_L = I_o / (1 − D) = 1 / 0,4 = 2,5 A' },
      { t: 'num', q: 'Eviren buck-boost dönüştürücüde D = 0,4, V_in = 12 V. Çıkış geriliminin büyüklüğü kaç V?', c: BBINV, fl: null, a: 8, u: 'V',
        e: 'Çıkış girişe göre ters işaretlidir; D = 0,5\'te büyüklük girişe eşittir.', f: '|V_o| = V_in · D / (1 − D) = 12 × 0,4 / 0,6 = 8 V' },
      { t: 'mc', q: 'Hafif yükte buck dönüştürücü DCM\'e geçiyor. Bunun işareti nedir?', o: ['Endüktör akımı her periyotta bir süre sıfırda kalır', 'Endüktör akımı hiç sıfıra inmez', 'Çıkış D·V_in\'e tam eşit kalır', 'Anahtar hiç kapanmaz'], a: 0,
        e: 'Ortalama akım, dalgalanmanın yarısının altına inince akım sıfıra değer. DCM\'de V_o artık yalnız D\'ye değil yüke de bağlıdır.', f: 'DCM sınırı: I_o < ΔI_L / 2' },
      { t: 'ariza', q: 'Görev oranı %42 komut ediliyor ama çıkış 12 V. Anahtarlama düğümünü ölç, arızalı elemana dokun.', c: buck({ vin: '12 V', t: '|V_SW = 12 V' }), fl: [{ p: [[30, 50], [120, 50], [220, 50], [290, 50], [290, 180], [30, 180]], v: [12, 12, 12, 12, 0, 0], i: 1000 }], a: 'S',
        e: 'Anahtar hiç kesime girmiyor: S kısa devre. Çıkış girişe yapışır ve 5 V\'luk yük aşırı gerilim görür. D kısa devre olsaydı anahtarlama düğümü 0 V\'ta kalırdı.', f: 'Beklenen V_o = 0,42 × 12 = 5 V' } ] },
    { name: 'Flyback ve kontrol', z: 3, k: [
      { h: 'Flyback: depola, sonra bırak', p: 'Flyback\'in trafosu iki sargılı bir endüktör gibi çalışır. S iletirken primer enerji depolar, sekonder diyodu ters kutuplu olduğu için çıkışa akım gitmez; S açılınca enerji sekonderden çıkışa boşalır. Sarım oranı gerilimi ölçekler ve girişle çıkışı yalıtır.',
        f: ['V_o = V_in · D / (1 − D) · N_s / N_p', 'V_DS = V_in + (N_p / N_s) · V_o (+ kaçak sıçraması)'], c: FLYBACK, fl: [{ p: [[230, 190], [150, 190], [150, 120], [150, 40], [230, 40]], v: [0, 0, 0, 8, 8], i: 1667 }, { p: [[230, 40], [230, 190]], v: [8, 0], i: 667 }, { p: [[230, 40], [295, 40], [295, 190], [230, 190]], v: [8, 8, 0, 0], i: 1000 }],
        r: 'Gerçek hayatta: Telefonun USB-C şarj adaptörü bir flyback\'tir. 230 V şebeke doğrultulunca yaklaşık 325 V DC olur; küçük trafo bunu yalıtarak 5–20 V\'a indirir.' },
      { h: 'Çıkış dalgalanması ve CCM sınırı', p: 'Buck\'ta endüktörün üçgen dalgalanma akımı kondansatöre gider ve küçük bir gerilim dalgalanması yaratır. En hafif yükte de CCM\'de kalmak için dalgalanmanın yarısı yük akımını aşmamalıdır; bu, L için bir alt sınır verir.',
        f: ['ΔV_o = ΔI_L / (8 · f_sw · C) (ESR ihmal)', 'L_min = (V_in − V_o) · D / (2 · I_o,min · f_sw)'] },
      { h: 'Kontrol döngüsü tuzakları', p: 'Boost ve flyback\'te D artınca enerji önce endüktörde birikir, çıkış bir an düşer: bu ters tepki sağ yarı düzlem sıfırıdır (RHPZ) ve döngü kesimi onun birkaç kat altında tutulur. Tepe akım modunda D > 0,5 iken alt harmonik salınım çıkar; akım sinyaline rampa eklenir.',
        f: ['f_RHPZ = (1 − D)² · R / (2π · L) (boost)', 'Eğim kompanzasyonu: S_e ≥ ½ · S_f'] } ], qs: [
      { t: 'num', q: 'Flyback CCM\'de D = 0,4. Çıkış gerilimi kaç V? (Diyot düşümünü ihmal et.)', c: FLYBACK, fl: null, a: 48 * (0.4 / 0.6) / 4, u: 'V',
        e: 'Flyback, sarım oranı eklenmiş bir buck-boost\'tur.', f: 'V_o = V_in · D / (1 − D) · N_s/N_p = 48 × 0,667 / 4 = 8 V' },
      { t: 'num', q: 'Aynı flyback\'te anahtar kesimdeyken üzerindeki gerilim kaç V olur? (Kaçak endüktans sıçramasını ihmal et.)', c: FLYBACK, fl: [{ p: [[230, 190], [150, 190], [150, 120], [150, 40], [230, 40]], v: [0, 0, 0, 8, 8], i: 1667 }, { p: [[230, 40], [230, 190]], v: [8, 0], i: 667 }, { p: [[230, 40], [295, 40], [295, 190], [230, 190]], v: [8, 8, 0, 0], i: 1000 }], a: 48 + 4 * 8, u: 'V',
        e: 'Kesimde çıkış gerilimi primere sarım oranıyla yansır ve girişe eklenir. Gerçekte kaçak endüktans bunun üstüne sıçrama ekler; MOSFET buna göre seçilir.', f: 'V_DS = V_in + n·V_o = 48 + 4 × 8 = 80 V' },
      { t: 'num', q: 'Buck çıkışında ΔI_L = 0,6 A, f_sw = 500 kHz, C = 22 µF (ESR ihmal). Çıkış gerilim dalgalanması kaç mV?', a: 0.6 / (8 * 5e5 * 22e-6) * 1e3, u: 'mV',
        e: 'Dalgalanma akımı kondansatörden geçer; üçgen akımın kondansatörde ürettiği gerilim budur.', f: 'ΔV = ΔI / (8 f C) = 0,6 / (8 × 500 kHz × 22 µF) = 6,8 mV' },
      { t: 'num', q: 'Buck: 12 V → 5 V, 500 kHz. 0,2 A yükte bile CCM\'de kalmak için en küçük L kaç µH?', a: 7 * (5 / 12) / (2 * 0.2 * 5e5) * 1e6, u: 'µH',
        e: 'CCM sınırında ortalama akım, dalgalanmanın yarısına eşittir.', f: 'L_min = (V_in − V_o)·D / (2 I_o f) = 7 × 0,417 / (2 × 0,2 × 500 kHz) = 14,6 µH' },
      { t: 'mc', q: 'CCM boost ve flyback\'te döngü kesim frekansı neden düşük tutulur?', o: ['Sağ yarı düzlem sıfırı (RHPZ) faz geciktirir ve kompanze edilemez', 'Anahtarlama frekansı yüksek olduğu için', 'Çıkış kondansatörü büyük olduğu için', 'Endüktör doyduğu için'], a: 0,
        e: 'Görev oranı artınca enerji önce endüktörde birikir, çıkış bir an düşer. Bu ters tepki RHPZ\'dir; kesim, en kötü RHPZ\'nin birkaç kat altında seçilir.', f: 'f_RHPZ = (1 − D)² R / (2π L) (boost)' },
      { t: 'mc', q: 'Tepe akım modlu kontrolde D > 0,5 iken akım dalga biçimi bir geniş bir dar darbe veriyor. Çözüm nedir?', o: ['Eğim kompanzasyonu: akım sinyaline rampa eklemek', 'Kondansatörü büyütmek', 'Anahtarlama frekansını düşürmek', 'Endüktörü küçültmek'], a: 0,
        e: 'Bu alt harmonik salınımdır. Eklenen rampa, endüktör akımı iniş eğiminin en az yarısı olmalıdır.', f: 'S_e ≥ ½ · S_f' } ] } ] },

  { name: 'Batarya yönetimi (BMS)', lessons: [
    { name: 'Hücre ve paket', z: 1, k: [
      { h: 'Seri gerilim, paralel kapasite', p: 'Seri bağlı hücrelerin gerilimleri toplanır, kapasite bir hücreninki kadar kalır. Paralel bağlı hücreler kapasiteyi toplar, gerilim aynı kalır. 10S4P, 10 seri grup ve her grupta 4 paralel hücre demektir.',
        f: ['V_paket = S · V_hücre', 'C_paket = P · C_hücre (Ah)', 'E = V_nom · C_paket (Wh)'] },
      { h: 'Hücre gerilimi ve C oranı', p: 'NMC hücre nominal 3,6 V, tam dolu 4,2 V\'tur; LFP nominal 3,2 V, tam dolu 3,65 V\'tur. Gerilim sınıfı tam dolu değere göre seçilir. C oranı akımı kapasiteye göre söyler: 1C paketi bir saatte boşaltır.',
        f: ['I = C oranı × kapasite', 'Örnek: 50 Ah, 0,5C → 25 A'],
        r: 'Gerçek hayatta: Bir e-bisiklet paketi 13S4P olabilir: 3,5 Ah\'lik NMC hücrelerle 46,8 V, 14 Ah ve yaklaşık 655 Wh. Tam dolu 54,6 V olduğu için şarj cihazı 54,6 V verir.' },
      { h: 'BMS: paketin bekçisi', p: 'Li-ion hücre aşırı şarj, aşırı deşarj, aşırı akım ve yanlış sıcaklıkta kalıcı hasar görür ya da termal kaçağa girer. BMS her hücrenin gerilimini, paket akımını ve sıcaklıkları izler. Bir sınır aşılınca MOSFET ya da kontaktörle akımı keser.' } ], qs: [
      { t: 'num', q: '10S (10 seri) Li-ion (NMC) paket tam doluyken kaç V olur?', a: 42, u: 'V',
        e: 'Paket gerilimi hücre gerilimlerinin toplamıdır. Gerilim sınıfı seçimi nominale değil tam dolu değere göre yapılır.', f: 'V = 10 × 4,2 = 42 V' },
      { t: 'num', q: 'Her biri 3 Ah olan hücrelerle 10S4P paket kuruluyor. Paket kapasitesi kaç Ah?', a: 12, u: 'Ah',
        e: 'Paralel hücreler kapasiteyi, seri hücreler gerilimi artırır.', f: 'C = 4 × 3 = 12 Ah' },
      { t: 'num', q: '36 V nominal, 12 Ah paketin enerjisi kaç Wh?', a: 432, u: 'Wh',
        e: 'Enerji, nominal gerilim ile kapasitenin çarpımıdır.', f: 'E = 36 × 12 = 432 Wh' },
      { t: 'mc', q: 'BMS\'in temel görevi nedir?', o: ['Hücre gerilimini, akımı ve sıcaklığı izleyip güvenli aralık dışında akımı kesmek', 'Motor hızını kontrol etmek', 'Paket gerilimini sabit tutmak', 'Şarj cihazının yerine geçmek'], a: 0,
        e: 'Li-ion hücreler aşırı şarj, aşırı deşarj, aşırı akım ve yanlış sıcaklıkta kalıcı hasar görür veya termal kaçağa girer.', f: 'İzle → karşılaştır → kes' },
      { t: 'num', q: '12 Ah paket 2C ile deşarj ediliyor. Akım kaç A?', a: 24, u: 'A',
        e: 'C oranı, akımın kapasiteye oranıdır. 1C, paketi bir saatte boşaltan akımdır.', f: 'I = 2 × 12 = 24 A' },
      { t: 'mc', q: 'NMC kimyalı Li-ion hücrenin tipik tam şarj gerilimi kaçtır?', o: ['4,2 V', '3,65 V', '3,2 V', '5,0 V'], a: 0,
        e: '3,65 V LFP hücrelerin tam şarj gerilimidir. Kesin değer hücrenin datasheet\'inden alınır.', f: 'NMC ≈ 4,2 V, LFP ≈ 3,65 V' } ] },
    { name: 'Ölçüm ve balans', z: 2, k: [
      { h: 'Neden balans?', p: 'Seri hücreler aynı akımı taşır ama kapasiteleri ve kaçakları biraz farklıdır; zamanla bazıları daha dolu kalır. Şarj, en dolu hücre sınıra varınca durmak zorundadır. Pasif balans, dolu hücreye bir dirençle küçük bir deşarj yolu açıp fazlalığı ısıya çevirir.',
        f: ['P = V_hücre² / R_bal', 't = ΔQ / I_bal (Ah / A = saat)'], c: loop('V_hücre', [['S', 'S'], ['R', 'R_bal']]), fl: [{ p: [[40, 40], [280, 40], [280, 180], [40, 180]], v: [4.2, 4.2, 0, 0], i: 100 }] },
      { h: 'SOC: depoda ne kaldı?', p: 'SOC, kalan yükün kapasiteye oranıdır. Coulomb sayma akımı zamanla toplar, ama küçük bir ölçüm ofseti bile günlerce birikir; dinlenmiş açık devre gerilimiyle (OCV) düzeltilir. LFP\'de OCV eğrisi orta bölgede çok düz olduğu için gerilimden SOC okumak zordur.',
        f: ['SOC = SOC₀ − ∫I dt / C', 'Sabit akımda: ΔSOC = I · t / C'] },
      { h: 'Akımı şöntle ölçmek', p: 'Şönt, akım yoluna seri konan çok küçük bir dirençtir; üzerindeki gerilim akımla orantılıdır. Direnci küçük olsa da yüksek akımda kayda değer ısınır.',
        f: ['V_şönt = I · R', 'P = I² · R'],
        r: 'Gerçek hayatta: Elektrikli arabanın BMS\'i 100 µΩ\'luk bir şöntle 300 A\'i ölçer: şöntte 30 mV düşer, 9 W ısı çıkar. Göstergedeki yüzde, bu akımdan hesaplanan SOC\'tur.' } ], qs: [
      { t: 'num', q: 'Pasif balansta 4,2 V\'luk hücreye 42 Ω direnç bağlanıyor. Dirençte harcanan güç kaç W?', c: loop('4,2 V', [['S', 'S'], ['R', 'R_bal', '42 Ω']]), fl: [{ p: [[40, 40], [280, 40], [280, 180], [40, 180]], v: [4.2, 4.2, 0, 0], i: 100 }], a: 4.2 * 4.2 / 42, u: 'W',
        e: 'Pasif balans fazla enerjiyi ısıya çevirir. BMS kartında bu ısı dağıtılmalıdır.', f: 'P = V² / R = 17,64 / 42 = 0,42 W' },
      { t: 'num', q: 'Hücreler arasında 0,5 Ah fark var ve balans akımı 100 mA. Dengeleme kaç saat sürer?', a: 5, u: 'h',
        e: 'Pasif balans yavaştır. Büyük paketlerde aktif balans tercih edilir.', f: 't = 0,5 Ah / 0,1 A = 5 h' },
      { t: 'num', q: 'Paket akımı 0,5 mΩ şöntle ölçülüyor. 100 A\'de şöntte harcanan güç kaç W?', a: 5, u: 'W',
        e: 'Küçük direnç bile yüksek akımda ciddi ısı üretir. Ölçüm gerilimi 50 mV\'tur.', f: 'P = I² · R = 10 000 × 0,0005 = 5 W' },
      { t: 'mc', q: 'Yalnız akım sayarak (Coulomb sayma) SOC hesaplamanın zayıf yanı nedir?', o: ['Akım ofseti ve başlangıç hatası zamanla birikir', 'Çok fazla işlem gücü ister', 'Akım ölçülemez', 'Yalnız LFP\'de çalışır'], a: 0,
        e: 'Açık çevrimli bir integraldir; küçük ofset bile günlerce birikir. Dinlenmiş OCV ile periyodik düzeltilir.', f: 'SOC = SOC₀ − ∫I dt / C' },
      { t: 'mc', q: 'LFP pakette gerilimden SOC tahmini neden zordur?', o: ['OCV eğrisi orta SOC aralığında çok düzdür', 'LFP hücrelerin gerilimi ölçülemez', 'LFP\'nin iç direnci sıfırdır', 'LFP gerilimi sıcaklıktan etkilenmez'], a: 0,
        e: '%20–80 aralığında gerilim yalnız birkaç on mV değişir; ölçüm hatası ve histerezis bunu yutar.', f: 'dV/dSOC ≈ 0 (orta bölge)' },
      { t: 'num', q: '50 Ah paket %80 SOC\'tan başlayıp 1,5 saat boyunca 10 A veriyor. Yeni SOC yüzde kaç?', a: 50, u: '%',
        e: 'Çekilen yükü kapasiteye oranla ve düş.', f: 'ΔQ = 10 × 1,5 = 15 Ah = %30 → SOC = %50' } ] },
    { name: 'Koruma ve ön şarj', z: 3, k: [
      { h: 'Ön şarj: yumuşak kalkış', p: 'İnverterin bus kondansatörü boşken kısa devre gibidir; ana kontaktör doğrudan kapansa dev bir akım darbesi kontakları kaynatabilir. Önce K2 kapanır ve C_bus, R_pre üzerinden yavaşça dolar. Gerilim farkı küçülünce K1 kapanır.',
        f: ['I_tepe = V / R_pre', 'τ = R_pre · C_bus', '%95: t = τ · ln 20 ≈ 3τ; 5τ\'da %99'], c: PRECHARGE, fl: [{ p: [[30, 80], [60, 80], [60, 30], [130, 30], [210, 30], [210, 80], [250, 80], [250, 200], [30, 200]], v: [110, 110, 110, 110, 0, 0, 0, 0, 0], i: 2340 }],
        r: 'Gerçek hayatta: Elektrikli arabayı çalıştırınca duyulan "tık… tık" sesi kontaktörlerdir: önce ön şarj kontaktörü, kısa süre sonra ana kontaktör kapanır.' },
      { h: 'Dirençteki ısı', p: 'Boş kondansatör dirençle doldurulurken, kondansatörde depolanan enerji kadar enerji de dirençte ısıya döner. Bu enerji direnç değerinden bağımsızdır; R_pre bu darbeye dayanacak şekilde seçilir. Ön şarj süre aşımıyla izlenir: beklenen sürede bitmiyorsa bir arıza vardır.',
        f: ['E_R = ½ · C · V²'] },
      { h: 'Geri besleme bus\'ı şişirir', p: 'Frenleyen motor jeneratör olur ve enerjiyi bus\'a iter. Batarya bu enerjiyi alamıyorsa (bağlantı koptu ya da paket dolu), gidecek tek yer kondansatördür ve gerilim hızla yükselir. Çözüm rejen sınırı, fren kıyıcı ve hızlı aşırı gerilim korumasıdır.',
        f: ['P = C · V · dV/dt → dV/dt = P / (C · V)'] } ], qs: [
      { t: 'num', q: 'K2 kapandığı anda R_pre\'den geçen tepe akım kaç A?', c: PRECHARGE, fl: [{ p: [[30, 80], [60, 80], [60, 30], [130, 30], [210, 30], [210, 80], [250, 80], [250, 200], [30, 200]], v: [110, 110, 110, 110, 0, 0, 0, 0, 0], i: 2340 }], a: 110 / 47, u: 'A',
        e: 'İlk anda boş kondansatör kısa devre gibidir; gerilimin tamamı dirençtedir.', f: 'I_pk = 110 / 47 = 2,34 A' },
      { t: 'num', q: 'Ön şarj direnci 100 Ω, C_bus = 1 mF. Bus geriliminin %95\'e ulaşması kaç saniye sürer?', a: 0.1 * Math.log(20), u: 's',
        e: 'Ana kontaktör ancak gerilim farkı küçükken kapatılır; yoksa kontaklar kaynayabilir.', f: 't = τ · ln 20 = 0,1 s × 3,0 = 0,30 s' },
      { t: 'num', q: '110 V\'luk paket 1 mF\'lık bus\'ı ön şarj ediyor. Ön şarj direncinde harcanan toplam enerji kaç J?', a: 0.5 * 1e-3 * 110 * 110, u: 'J',
        e: 'Bu enerji direnç değerinden bağımsızdır. Direnç, bu darbe enerjisine göre seçilir.', f: 'E = ½ C V² = 0,5 × 1 mF × 110² = 6,05 J' },
      { t: 'num', q: 'Batarya bağlantısı koptu, motor 2 kW geri besleme veriyor. 1 mF\'lık bus 110 V\'tayken gerilim kaç V/ms yükselir?', a: 2000 / (1e-3 * 110) / 1e3, u: 'V/ms',
        e: 'Gücün gidecek tek yeri bus kondansatörüdür. Birkaç ms\'de onlarca volt yükselir; aşırı gerilim koruması hızlı olmalıdır.', f: 'dV/dt = P / (C·V) = 2000 / (1 mF × 110 V) = 18,2 V/ms' },
      { t: 'mc', q: 'Paket tam doluyken motor rejeneratif fren yapıyor ve BMS şarj akımını kesiyor. Ne olur, ne yapılmalı?', o: ['DC bus pompalanır; fren kıyıcı veya rejen sınırı gerekir', 'Hiçbir şey olmaz, kondansatör emer', 'Motor hızlanır', 'Paket boşalır'], a: 0,
        e: 'Akımın gidecek yeri kalmaz; MOSFET\'lerin gövde diyotları motoru doğrultucu yapar. Sürücü ile BMS haberleşmeli, rejen tam doluyken kısılmalıdır.', f: 'dV/dt = P / (C·V)' },
      { t: 'ariza', q: 'K2 kapalı, aradan 5 s geçti. R_pre uçlarında hâlâ 110 V, C_bus 0 V. İnverter bağlı değil. Arızalı elemana dokun.', c: PRECHARGE, fl: [{ p: [[30, 80], [60, 80], [60, 30], [130, 30], [210, 30], [210, 80], [250, 80], [250, 200], [30, 200]], v: [110, 110, 110, 110, 0, 0, 0, 0, 0], i: 2340 }], a: 'C_bus',
        e: 'Sağlam devrede birkaç τ sonra C_bus 110 V\'a ulaşır ve R_pre\'de 0 V kalır. Sürekli 110 V, C_bus\'ın kısa devre olduğunu gösterir. R_pre sürekli V²/R = 257 W ile ısınır; ön şarj zaman aşımıyla kesilmelidir.', f: 'τ = 47 Ω × 1 mF = 47 ms → 5 s ≫ 5τ' } ] } ] },

  { name: 'Elektrik motorları', lessons: [
    { name: 'DC motor', z: 1, k: [
      { h: 'Motor aynı zamanda jeneratördür', p: 'Dönen DC motor, hızıyla orantılı bir zıt EMK (E) üretir; bu, uygulanan gerilime karşı koyar. Akımı, uygulanan gerilimle zıt EMK arasındaki fark ve armatür direnci R_a belirler. Kalıcı durumda L_a akımı etkilemez.',
        f: ['E = K_e · ω', 'I = (V − E) / R_a'], c: loop('V', [['R', 'R_a'], ['I', 'L_a'], ['M', 'E', 'K_e · ω']]), fl: [{ p: [[40, 40], [160, 40], [280, 40], [280, 180], [40, 180]], v: [24, 20, 20, 0, 0], i: 8000 }] },
      { h: 'Tork akımdan gelir', p: 'Tork akımla orantılıdır; akım ters dönerse tork da ters döner, bu yüzden polariteyi çevirmek yönü çevirir. Kalkışta ω = 0, yani E = 0\'dır; akımı yalnız R_a sınırlar ve en büyük akım bu andadır. SI birimlerinde K_t ile K_e sayısal olarak eşittir.',
        f: ['T = K_t · I', 'I_kalkış = V / R_a'],
        r: 'Gerçek hayatta: Akülü matkap vidayı sıkıp durduğunda motor neredeyse kalkış akımı çeker ve en büyük torku verir. Uzun süre böyle zorlanırsa sargılar ısınır.' },
      { h: 'Dikkat: rpm değil rad/s', p: 'Formüllerdeki ω, rad/s cinsindendir; motor etiketleri ise rpm yazar. Bir tur 2π radyan, bir dakika 60 saniyedir.',
        f: ['ω = n · 2π / 60', '1000 rpm ≈ 105 rad/s'] } ], qs: [
      { t: 'num', q: 'Motorun zıt EMK sabiti K_e = 0,05 V/(rad/s). 300 rad/s\'de zıt EMK kaç V?', a: 15, u: 'V',

    { h: 'İdeal op-amp iki kural', p: 'Bu sınavda her yerde "ideal" deniyor. İdeal op-amp için iki kural yeter: girişlerine akım girmez, negatif geri besleme varsa iki giriş aynı gerilimde kalır. Eviren girişin yanında toprağa bağlı + giriş varsa o noktaya sanal toprak denir. Akım bir dirençten gelip op-amp\'a giremediği için geri besleme direncinden çıkışa akmak zorundadır.',
      f: ['I_giriş = 0', 'V₊ = V₋', 'Eviren: V_o = −(R_f / R_1) · V_i'] },
    { h: 'Ferrit boncuk', p: 'Ferrit boncuk frekansla direnci artan bir bobin gibi davranır. Yüksek frekansta empedansının büyük kısmı dirençseldir ve gürültü enerjisini ısıya çevirir. Sinyal hatlarında da, besleme hatlarında da (MCU, ADC, RF beslemesi) kullanılır. Ama DC akım artınca ferrit doyar ve empedansı düşer; DC direnci (DCR) de besleme hattında gerilim düşürür.',
      f: ['Z(f) = R(f) + jX(f)', 'Seçim: empedans tepesi gürültü bandında, I_DC < doyma akımı'] },
    { h: 'I²C protokolü', p: 'I²C iki hatlı (SDA ve SCL) bir seri veri yoludur. Hatlar açık savaklı (open-drain) çıkıştır, pull-up dirençleriyle VCC\'ye çekilir. Her slave\'in 7 veya 10 bitlik benzersiz adresi vardır. Saati master üretir, slave saati LOW tutarak yavaşlatabilir (clock stretching). Tek veri hattı olduğu için aynı anda yalnız bir yönde veri gider.',
      f: ['t_yükselme ≈ 0,8473 · R_p · C_hat', 'Standart 100 kHz, Hızlı 400 kHz, Hızlı+ 1 MHz'] },
    { h: 'Zener + emetör izleyici regülatör', p: 'Zener bazı sabit bir gerilimde tutar. NPN transistör emetör izleyicidir: çıkış, baz geriliminden bir V_BE düşük olur. Yük akımı emetörden çıkar; bazdan bunun yalnız 1/(β+1) kadarı çekilir. Seri direnç akımı zener ile baz arasında paylaşılır.',
      f: ['V_o = V_Z − V_BE', 'I_B = I_E / (β + 1)', 'I_R = (V_i − V_Z) / R', 'I_Z = I_R − I_B'] },
    { h: 'Diyotlu kırpıcı', p: 'Diyot, anodu katodundan daha pozitif olunca (ideal diyotta 0 V eşik) iletime geçer ve kısa devre gibi davranır. Diyot bir pile seri bağlanıp çıkışa paralel konursa, çıkış pil gerilimini aşmaya çalıştığında diyot iletir ve çıkışı o seviyede tutar. Diyot ters yönde kalırken hiç akım geçmez, çıkış girişi aynen izler.',
      f: ['V_i > V_bat → diyot iletir → V_o = V_bat', 'V_i < V_bat → diyot kesimde → V_o = V_i'] } ], qs: [
    { t: 'mc', q: 'Soru 1: Devrede I_L akımı kaç mA? (Tüm elemanlar ideal.)', c: BK_OPINV, fl: BK_FL1, fa: true, o: ['6 mA', '4 mA', '1,33 mA', '2 mA', '1 mA'], a: 1,
      e: 'Sanal toprak: R1\'den gelen akımın tamamı R_L\'den akar.', f: 'I_L = V_1 / R1 = 8 V / 2 kΩ = 4 mA  (B şıkkı)',
      s: ['İdeal op-amp: girişlerine akım girmez; negatif geri besleme olduğu için V₊ = V₋.',
        'R_C\'den akım geçmez, uçlarında gerilim düşmez → V₊ = 0 V. O hâlde V₋ = 0 V (sanal toprak).',
        'R1 uçlarındaki gerilim 8 − 0 = 8 V → I = 8 V / 2 kΩ = 4 mA, kaynaktan op-amp\'a doğru (soldan sağa) akar.',
        'Bu akım − girişe giremez; tamamı R_L üzerinden çıkışa gider: I_L = 4 mA (şekildeki ok yönünde).',
        'Kontrol: V_o = 0 − 4 mA × 4 kΩ = −16 V. Akış çiziminde gerilim 8 V (kırmızı) → 0 V → −16 V (mavi) iniyor. Cevap: B) 4 mA.'] },
    { t: 'mc', q: 'Soru 2: Ferrit boncuklarla ilgili hangi ifade YANLIŞTIR?', o: ['DC akım arttıkça ferrit boncuk manyetik doyuma girer ve empedansı düşer.', 'Ferrit boncuğun tepe empedans frekansı bastırılacak gürültü bandıyla örtüşmelidir.', 'Ferrit boncuklar yüksek empedanslı sinyaller için düşük empedanslı gürültüyü bastırır; bu yüzden yalnız sinyal hatlarında kullanılır, besleme hatlarında kullanılmaz.', 'Ferrit boncuğun dirençsel bileşeni gürültü enerjisini ısıya çevirerek emer.', 'DCR\'si yüksek ferrit boncuk besleme hattında istenmeyen gerilim düşümüne yol açabilir.'], a: 2,
      e: 'Ferrit boncuklar besleme hatlarında en yaygın filtre elemanlarından biridir.', f: 'Yanlış ifade: C şıkkı',
      s: ['A doğru: DC bias akımı ferriti doyurur, geçirgenlik ve empedans düşer. Bu yüzden datasheet\'te empedans-DC akım eğrisine bakılır.',
        'B doğru: Boncuk, empedansının en yüksek olduğu frekans bandında en iyi bastırır.',
        'D doğru: Yüksek frekansta empedansın baskın kısmı R\'dir; gürültü yansıtılmaz, ısıya çevrilir.',
        'E doğru: DCR × I kadar gerilim düşer ve I²·DCR kadar ısınır.',
        'C yanlış: Ferrit boncuk özellikle besleme hatlarında (MCU, ADC, PLL, RF beslemesi) kullanılır. "Yalnız sinyal hattında" ifadesi hatalı. Cevap: C.'] },
    { t: 'mc', q: 'Soru 3: I²C protokolüyle ilgili hangi ifade YANLIŞTIR?', o: ['I²C yalnız iki hat kullanır, SDA ve SCL; ikisi de açık savaklıdır ve pull-up dirençleriyle VCC\'ye çekilir.', 'Aynı I²C yolundaki her slave cihazın benzersiz bir 7 bit (veya 10 bit) adresi olmalıdır.', 'I²C tam çift yönlü (full-duplex) çalışır; master aynı anda slave\'e veri gönderip slave\'den veri alabilir.', 'SCL hattını master üretir; ancak slave, SCL\'yi LOW tutarak haberleşmeyi geçici olarak yavaşlatabilir (clock stretching).', 'Pull-up direnci çok büyükse yol kapasitesi yüzünden yükselme süresi uzar; bu, yüksek hızlarda haberleşme hatalarına yol açabilir.'], a: 2,
      e: 'I²C\'de tek veri hattı (SDA) var; aynı anda yalnız bir yönde veri taşır. Full-duplex olan SPI\'dır (MOSI ve MISO).', f: 'Yanlış ifade: C şıkkı (I²C yarı çift yönlüdür)',
      s: ['A doğru: Open-drain çıkışlar hattı yalnız LOW\'a çekebilir; HIGH seviyesini pull-up verir. Bu sayede çok cihaz aynı hatta çakışmadan bağlanır.',
        'B doğru: Master, adres baytıyla hangi slave ile konuştuğunu seçer; iki cihaz aynı adreste olamaz.',
        'D doğru: Clock stretching standardın parçasıdır.',
        'E doğru: τ = R_p · C_hat; R_p büyüdükçe kenarlar yavaşlar, 400 kHz ve üstünde eşik zamanında aşılamaz.',
        'C yanlış: SDA tek hat olduğundan iletişim half-duplex\'tir. Cevap: C.'] },
    { t: 'mc', q: 'Soru 4: Devredeki zener akımı I_Z kaç mA? (V_BE = 0,7 V, β = 40, V_Z = 12,7 V, tüm elemanlar ideal.)', c: BK_REG, fl: BK_FL4, fa: true, o: ['50,0', '50,2', '50,4', '50,6', '50,8'], a: 4,
      e: 'R\'den gelen 51 mA\'in küçük bir kısmı bazdan gider, kalanı zenerden akar.', f: 'I_Z = (28 − 12,7)/300 − (12/1,5 k)/41 = 51 − 0,195 = 50,8 mA  (E şıkkı)',
      s: ['Baz zenerle 12,7 V\'ta sabit: V_B = V_Z = 12,7 V.',
        'Emetör izleyici: V_o = V_B − V_BE = 12,7 − 0,7 = 12 V.',
        'Yük (emetör) akımı: I_E = V_o / R_L = 12 V / 1,5 kΩ = 8 mA.',
        'Baz akımı: I_B = I_E / (β + 1) = 8 / 41 = 0,195 mA (I_B = I_C/β ile de 0,195 ≈ 0,2 mA çıkar).',
        'Seri direnç akımı: I_R = (28 − 12,7) / 300 Ω = 15,3 / 300 = 51 mA.',
        'Düğümde KCL: I_Z = I_R − I_B = 51 − 0,195 = 50,8 mA. Akış çiziminde 51 mA iki kola ayrılıyor: kalın ok zenerden aşağı (50,8 mA), ince ok baza (0,195 mA). Cevap: E) 50,8.'] },
    { t: 'mc', q: 'Soru 5: Şekildeki devrenin çıkış dalga biçimi nedir? (Diyot ve pil ideal.)', c: BK_CLIP, fl: BK_FL5, fa: true, o: ['Kırpılmamış tam sinüs', 'İki yarım dalgada da kırpılmış sinüs', 'Sabit bir DC seviye', 'Pozitif tepesi V_bat seviyesinde düz kesilmiş, negatif yarım dalgası tam sinüs'], a: 3,
      e: 'Diyot yalnız çıkış V_bat\'ı aşmaya çalıştığında iletir; negatif yarıda hep kesimdedir.', f: 'V_i > V_bat → V_o = V_bat ;  V_i < V_bat → V_o = V_i  (D şıkkı)',
      s: ['Diyotun anodu çıkış düğümüne, katodu pilin + ucuna bağlı. İletmesi için V_o > V_bat olmalı.',
        'v_i < V_bat iken diyot kesimde: R\'den akım geçmez, R\'de gerilim düşmez → V_o = v_i (çıkış girişi aynen izler). Negatif yarım dalganın tamamı bu bölgededir.',
        'v_i > V_bat iken diyot iletir ve kısa devre gibi davranır: V_o = V_bat sabit kalır, fazla gerilim (v_i − V_bat) R üzerinde düşer.',
        'Akış çizimi pozitif tepe anını gösteriyor (örnek V_bat = 5 V, R = 1 kΩ): 10 V → R\'de 5 V düşer → diyot → pile + ucundan girer, I = 5 mA.',
        'Sonuç: tepesi V_bat\'ta düz kesilmiş, negatif kısmı tam sinüs. Sınavdaki D şeklidir. Cevap: D.'] } ] },

  { name: 'Sorular 6–10: EMI bobini, iki op-amp, push-pull, ikiye tümleyen, BLDC', z: 2, k: [
    { h: 'Bobinin doyma akımı', p: 'Bobin çekirdeği belli bir akıdan sonra doyar. Doyumda geçirgenlik düşer, endüktans hızla azalır; bobin artık akım dalgalanmasını ve gürültüyü süzemez, akım tepeleri büyür. EMI filtresindeki bobin, en büyük giriş akımında bile doymamalıdır.',
      f: ['L = N² · μ · A / l', 'Doyumda μ ↓ → L ↓'] },
    { h: 'Op-amp\'a iki girişten sinyal', p: 'Bir op-amp\'ın iki girişine de sinyal geliyorsa süperpozisyon kullanılır: + girişin etkisi eviremeyen kazançla, − girişin etkisi eviren kazançla hesaplanır, sonra toplanır. Dirençli bölücü + girişe bir gerilim verir. Ardışık katlarda ilk katın çıkışı ikinci katın girişidir; sonucu ±V_sat ile sınırla.',
      f: ['V_o = V₊ (1 + R_f/R_1) − V_i · R_f/R_1', 'Eviremeyen: V_o = V_i (1 + R_f/R_g)', '|V_o| ≤ V_sat'] },
    { h: 'Push-pull (B sınıfı) çıkış', p: 'NPN ve PNP transistörün bazları ve emetörleri birleştirilir. Baz pozitifse NPN iletir, PNP kesimde kalır; negatifse tersi. İletimdeki transistör emetör izleyici gibi çalışır. Baz direnci, transistörün içinden bakıldığında yük direncinin (β+1) katı görünür.',
      f: ['V_o = V_B − V_BE', 'I_E = (β + 1) I_B', 'I_B = (V_s − V_BE) / (R_B + (β+1) R_E)'] },
    { h: 'İkiye tümleyen (2\'s complement)', p: 'Negatif bir sayıyı n bitte yazmak için: önce mutlak değeri ikili yaz, bütün bitleri ters çevir (1\'e tümleyen), sonra 1 ekle. 8 bitte aralık −128 … +127\'dir. En soldaki bit 1 ise sayı negatiftir.',
      f: ['−x = (NOT x) + 1', '−x = 2ⁿ − x', '8 bit: −128 … +127'] },
    { h: '6 adımlı (trapezoidal) BLDC sürüş', p: 'Üç faz yıldız bağlı. Her 60 elektriksel derecelik adımda bir faz + baraya, biri − baraya bağlanır, üçüncüsü boşta (yüzer) kalır. Akım iki sargıdan seri geçer. Boştaki fazın uç geriliminden zıt EMK ölçülerek sensörsüz sürüş yapılabilir.',
      f: ['6 adım × 60° = 360° elektriksel', 'Komütasyon sırası: AB, AC, BC, BA, CA, CB'] } ], qs: [
    { t: 'mc', q: 'Soru 6: 28 VDC\'yi 12 VDC\'ye çeviren bir buck dönüştürücünün giriş EMI filtresinde bobinin doyma akımı değeri neden önemlidir?', o: ['Çıkış gerilimini doğrudan 12 V\'ta tutar.', 'Bobin doyunca endüktansı düşer; bu da filtreleme başarımını azaltabilir.', 'Dönüştürücünün anahtarlama frekansını belirler.', 'Doyuma yaklaşınca endüktans artar; bu, gürültü filtrelemeyi iyileştirir ama bobini ısıtır.', 'Bütün anahtarlama gürültüsünün girişe ulaşmasını engeller.'], a: 1,
      e: 'Doyum, endüktansı düşürür; filtre köşe frekansı yükselir ve gürültü geçer.', f: 'Doyumda L ↓ → f_c = 1/(2π√(LC)) ↑ → süzme ↓  (B şıkkı)',
      s: ['EMI filtresi L ve C ile alçak geçiren süzgeçtir; köşe frekansı f_c = 1/(2π√(LC)).',
        'Buck giriş akımı darbelidir; filtre bobininden geçen ortalama ve tepe akım çekirdeği mıknatıslar.',
        'Akım doyma değerini aşarsa çekirdek doyar, μ ve L düşer → f_c yükselir → anahtarlama gürültüsü süzülmeden kaynağa geçer.',
        'A ve C yanlış: çıkış gerilimini ve frekansı kontrol katı belirler. D yanlış: doyumda endüktans artmaz, düşer. E yanlış: hiçbir filtre gürültünün tamamını durdurmaz.',
        'Cevap: B.'] },
    { t: 'mc', q: 'Soru 7: Op-amplerin doyma gerilimi ±15 V ve giriş V_in = −3,5 V ise devrenin çıkışı V_out kaç V olur? (Tüm elemanlar ideal.)', c: BK_TWO, fl: BK_FL7, fa: true, o: ['11 V', '7,5 V', '15 V', '5,5 V', '9 V'], a: 0,
      e: 'Birinci kat 5,5 V verir, ikinci kat eviremeyen ×2 kazançla 11 V yapar.', f: 'V₊ = 1 V → V_o1 = 1·2 − (−3,5)·1 = 5,5 V → V_out = 5,5 × 2 = 11 V  (A şıkkı)',
      s: ['1. op-amp, + giriş: +2 V iki eşit 1 kΩ\'luk bölücüden geçer → V₊ = 2 × 1/(1+1) = 1 V. Bu bölücüden 1 mA akar.',
        'Negatif geri besleme var → V₋ = V₊ = 1 V.',
        'R1 akımı: (1 − (−3,5)) / 2 kΩ = 2,25 mA, düğümden V_in\'e doğru (sağdan sola) akar.',
        'Bu akım op-amp girişine giremez, R2 üzerinden çıkıştan gelir: V_o1 = 1 + 2,25 mA × 2 kΩ = 5,5 V. Formülle: V_o1 = 1·(1 + 2/2) − (−3,5)·(2/2) = 2 + 3,5 = 5,5 V.',
        '2. op-amp eviremeyen yükselteç: V₊ = 5,5 V, geri besleme 2,2 kΩ / 2,2 kΩ → kazanç 1 + 2,2/2,2 = 2.',
        'V_out = 5,5 × 2 = 11 V; |11| < 15 V olduğu için doyum yok. R5 ve R6\'dan (11 − 5,5)/2,2 k = 2,5 mA akar. Cevap: A) 11 V.'] },
    { t: 'mc', q: 'Soru 8: Tüm BJT\'ler ideal. V_out kaç V? (V_BE = 0,7 V, β = 100)', c: BK_PP, fl: BK_FL8, fa: true, o: ['4,12 V', '2,81 V', '3,94 V', '1,42 V', '4,87 V'], a: 2,
      e: 'Baz +5 V\'tan beslendiği için Q1 (NPN) iletir, Q2 (PNP) kesimdedir; Q1 emetör izleyicidir.', f: 'I_B = 4,3 / (10 k + 101 × 1 k) = 38,7 µA → V_out = 101 × 38,7 µA × 1 kΩ ≈ 3,91 V ≈ 3,94 V  (C şıkkı)',
      s: ['Bazlar R_B üzerinden +5 V\'a bağlı, çıkış ise toprağa 1 kΩ ile iniyor → baz emetörden yüksek: Q1 (NPN) iletimde, Q2 (PNP) ters kutuplu, kesimde.',
        'Q1 için baz çevrimi: 5 = I_B · 10 kΩ + 0,7 + I_E · 1 kΩ, I_E = (β+1) I_B.',
        'I_B = (5 − 0,7) / (10 k + 101 × 1 k) = 4,3 / 111 k = 38,7 µA.',
        'I_E = 101 × 38,7 µA = 3,91 mA → V_out = 3,91 mA × 1 kΩ ≈ 3,91 V.',
        'Şıklardaki en yakın değer 3,94 V (anahtar paydada β = 100, payda β + 1 almış: 101 × 4,3 / 110 = 3,95). Kontrol: V_B = 3,91 + 0,7 = 4,61 V, R_B\'de 0,39 V düşer = 38,7 µA × 10 kΩ ✓. Cevap: C.'] },
    { t: 'mc', q: 'Soru 9: Onluk −32 sayısını 8 bitlik ikiye tümleyen biçime çevir.', o: ['0101 1001', '1101 1111', '0001 1111', '1110 0000', '1100 0011'], a: 3,
      e: 'Mutlak değerin bitlerini ters çevir, 1 ekle.', f: '32 = 0010 0000 → 1101 1111 → +1 → 1110 0000  (D şıkkı)',
      s: ['+32\'yi 8 bit ikili yaz: 32 = 2⁵ → 0010 0000.',
        'Bütün bitleri ters çevir (1\'e tümleyen): 1101 1111. (B şıkkı tuzaktır: 1 eklenmemiş hâli.)',
        '1 ekle: 1101 1111 + 1 = 1110 0000.',
        'Kontrol: 2⁸ − 32 = 224 = 1110 0000 ✓. Ya da −128 + 64 + 32 = −32 ✓.',
        'Cevap: D) 1110 0000.'] },
    { t: 'mc', q: 'Soru 10: 6 adımlı (trapezoidal) blok komütasyonla sürülen standart 3 fazlı BLDC motorda herhangi bir anda sargıların durumu nedir?', o: ['Yalnız bir faz enerjilidir, diğer ikisi boştadır.', 'Aynı anda iki faz enerjilidir: biri + beslemeye, diğeri − beslemeye bağlıdır. Üçüncü faz boştadır (yüzer).', 'Üç faz da aynı anda eşit olarak enerjilidir.', 'Elektromanyetik frenleme için üç faz kısa devre edilir.', 'İki faz kısa devre edilir, üçüncü faz beslemeden enerjilenir.'], a: 1,
      e: 'Her 60° adımda üst anahtarlardan biri ve başka bir fazın alt anahtarı iletir.', f: 'Örnek adım AB: A → +V_DC, B → −V_DC, C boşta  (B şıkkı)',
      s: ['İnverterde 6 anahtar var (her fazda üst ve alt). 6 adımlı sürüşte her an bir üst ve farklı bir fazın bir alt anahtarı iletir.',
        'Böylece akım + baradan bir faza girer, yıldız noktasından geçip ikinci fazdan − baraya döner: iki sargı seri enerjilidir.',
        'Üçüncü fazın iki anahtarı da kapalıdır; o faz yüzer. Sensörsüz sürüşte zıt EMK sıfır geçişi bu fazdan okunur.',
        'Her 60° elektrikselde Hall durumu değişir, iletimdeki çift bir adım kayar: AB → AC → BC → BA → CA → CB.',
        'A, C, D, E bu sürüşü tanımlamaz (C sinüs/FOC sürüşüne, D aktif kısa devre frenine benzer). Cevap: B.'] } ] },

  { name: 'Sorular 11–15: DC motor, kutup ve hız, zener, Boole, flyback', z: 2, k: [
    { h: 'DC motor eşdeğer devresi', p: 'Armatür bir direnç (R_a), bir endüktans (L_a) ve dönme hızıyla orantılı zıt EMK (e) kaynağının serisidir. Kirchhoff gerilim yasasıyla uygulanan gerilim bu üç elemanın gerilimlerinin toplamına eşittir. Zıt EMK, akımı sınırlayan yönde (pasif işaretle) durur.',
      f: ['Bobin gerilimi: v_L = L · di/dt', 'e = K_e · ω'] },
    { h: 'Elektriksel ve mekanik hız', p: 'P kutuplu bir makinede bir mekanik turda P/2 elektriksel periyot vardır. Bu yüzden mekanik hız, elektriksel hızın P/2\'ye bölünmüşüdür. Asenkron motorda rotor senkron hızdan kayma kadar yavaş döner.',
      f: ['n_s = 120 · f / P (rpm)', 'ω_m = 2π f / (P/2) (rad/s)', 's = (n_s − n) / n_s'] },
    { h: 'Zener regülatöründe güç', p: 'Zener iletimdeyse yük ucundaki gerilim V_Z\'de sabittir. Seri dirençteki gerilim kaynak ile V_Z farkıdır; direnç akımı bu gerilimden gelir ve zener ile yük arasında paylaşılır.',
      f: ['V_Rs = V_in − V_Z', 'P_Rs = V_Rs² / R_s', 'I_Z = I_S − I_L'] },

const XP_Z = [0, 4, 6, 8], XP_RIGHT = 4, XP_FINISH = 10, XP_PERFECT = 6, GOAL = 30;

// Yerel takvim günü; UTC ile sayılır ki yaz saati geçişi günü kaydırmasın.
const dayNum = (d = new Date()) => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);

const fresh = () => ({ xp: 0, done: {}, box: {}, ok: {}, perfect: 0, fixed: 0, last: -1, streak: 0, bestStreak: 0, freeze: true, refill: 0, day: -1, dayXp: 0, goalDays: 0, rem: 0, coins: 0, qd: -1, qp: [0, 0, 0] });

// Akıllı tekrar kutusu: box[id] = [seviye 0-3, vade günü]. Doğru cevap bir üst seviyeye çıkarır ve GAPS gün sonraya atar; 3'te doğru kutudan çıkarır.
const GAPS = [0, 1, 3, 7], dueIds = (s, t) => Object.keys(s.box).filter(id => s.box[id][1] <= t);

function parseState(raw, validIds, today = dayNum()) {
  const s = fresh();
  let p;
  try { p = JSON.parse(raw); } catch { return s; }
  if (!p || typeof p !== 'object') return s;
  for (const k in s) if (typeof p[k] === typeof s[k] && Array.isArray(p[k]) === Array.isArray(s[k]) && p[k] !== null && (typeof p[k] !== 'number' || Number.isFinite(p[k]))) s[k] = p[k];
  // box dışarıdan gelir (yedek, bulut): yalnız bilinen sorular, tam sayı seviye 0-3 ve tam sayı gün kalır.
  s.box = Object.fromEntries(Object.entries(s.box).filter(([id, v]) => validIds.includes(id) && Array.isArray(v) && Number.isInteger(v[0]) && v[0] >= 0 && v[0] <= 3 && Number.isInteger(v[1])).map(([id, v]) => [id, [v[0], v[1]]]));
  if (Array.isArray(p.wrong)) for (const id of p.wrong) if (validIds.includes(id) && !(id in s.box)) s.box[id] = [0, today]; // eski kayıt: yanlışlar bugün tekrar
  // Yedek dosyası dışarıdan gelir ve done değerleri ekrana yazılır: yalnız bilinen dersler ve sayaç değerleri kalır.
  const lessons = new Set(validIds.map(id => id.replace(/-[^-]+$/, ''))), count = v => Number.isInteger(v) && v >= 0;
  s.done = Object.fromEntries(Object.entries(s.done).filter(([k, v]) => lessons.has(k) && count(v)));
  s.ok = Object.fromEntries(Object.entries(s.ok).filter(([, v]) => count(v)));
  if (!Number.isSafeInteger(s.coins) || s.coins < 0) s.coins = 0;
  if (!Number.isInteger(s.qd) || s.qd < 0 || s.qp.length !== 3 || !s.qp.every(count)) { s.qd = -1; s.qp = [0, 0, 0]; }
  return s;
}

function touchStreak(s, today) {
  const gap = s.last < 0 ? Infinity : today - s.last;
  if (gap <= 0) return; // aynı gün ya da saat geri alınmış
  if (gap === 1 || (gap === 2 && s.freeze)) {
    s.streak++;
    if (gap === 2) { s.freeze = false; s.refill = 7; }
    else if (!s.freeze && --s.refill <= 0) s.freeze = true;
  } else { s.streak = 1; s.freeze = true; }
  s.last = today;
  s.bestStreak = Math.max(s.bestStreak, s.streak);
}

const liveStreak = (s, today) => s.last >= 0 && (today - s.last <= 1 || (today - s.last === 2 && s.freeze)) ? s.streak : 0;
const todayXp = (s, today) => s.day === today ? s.dayXp : 0;

function addXp(s, n, today) {
  touchStreak(s, today);
  if (s.day !== today) { s.day = today; s.dayXp = 0; }
  if (s.dayXp < GOAL && s.dayXp + n >= GOAL) s.goalDays++;
  s.dayXp += n; s.xp += n;
}

function record(s, id, type, right, today, z = 1, xp = XP_Z[z]) { // xp: ipucu alınınca düşük
  const b = s.box[id];
  if (!right) { s.box[id] = [0, today]; return; }
  s.ok[type] = (s.ok[type] || 0) + 1;
  s.ok['z' + z] = (s.ok['z' + z] || 0) + 1;
  // Ders içinde de Tekrar'daki gibi sayılır, ama yalnız vadesi geldiyse; vadesi gelmemiş soru olduğu gibi kalır.
  if (b && b[1] <= today) { if (b[0] >= 3) { delete s.box[id]; s.fixed++; } else s.box[id] = [b[0] + 1, today + GAPS[b[0] + 1]]; }
  addXp(s, xp, today);
}

function finishLesson(s, lid, right, total, today) {
  s.done[lid] = Math.max(s.done[lid] || 0, right);
  if (right === total) s.perfect++;
  addXp(s, XP_FINISH + (right === total ? XP_PERFECT : 0), today);
}

// "1.500" Türkçede 1500, klavyede 1,5 olabilir: iki yorum da aday.
function parseNum(str) {
  const t = String(str).replace(/\s/g, '').replace('−', '-');
  if (!/^-?[\d.,]+$/.test(t) || !/\d/.test(t)) return [];
  const c = new Set();
  if (t.includes(',')) c.add(Number(t.replace(/\./g, '').replace(',', '.')));
  else { c.add(Number(t)); if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) c.add(Number(t.replace(/\./g, ''))); }
  return [...c].filter(Number.isFinite);
}

function grade(q, ans, SIMS) {

const QUESTS = [
  [['3 soruyu doğru çöz', 3, 3, (e, p) => p + e.ok], ['Bir ders bitir', 1, 3, (e, p) => p + e.fin], ['Bugün 20 XP topla', 20, 3, e => e.xp, 'xp']],
  [['3 soruyu arka arkaya doğru yap', 3, 5, (e, p) => Math.max(p, e.combo), 'seri'], ['Bir arıza sorusu çöz', 1, 5, (e, p) => p + (e.ok && e.t === 'ariza')],
    ['Bir simülasyon sorusu çöz', 1, 5, (e, p) => p + (e.ok && e.t === 'sim')], ['Tekrar’da 2 soru çöz', 2, 5, (e, p) => p + (e.ok && e.rev)]],
  [['Hatasız bir ders bitir', 1, 8, (e, p) => p + e.perfect], ['Zor düzeyde 2 soru çöz', 2, 8, (e, p) => p + (e.ok && e.z === 3)],
    ['Bugün 40 XP topla', 40, 8, e => e.xp, 'xp'], ['5 soruyu arka arkaya doğru yap', 5, 8, (e, p) => Math.max(p, e.combo), 'seri']]

  return QUESTS.map((g, i) => {

  if (s.qd !== t) { s.qd = t; s.qp = [0, 0, 0]; }

  ['LED', 'LED', 'Işık yayan diyot. İletimde üzerinde rengine göre yaklaşık sabit V_F düşer (kırmızıda ≈ 2 V); akımı seri dirençle sınırlanmalıdır.'],
  ['İleri gerilim (V_F, V_D)', 'V_F|V_D', 'İletimdeki diyot ya da LED\'in uçlarında düşen gerilim; akımdan neredeyse bağımsızdır.'],
  ['Ters kutuplama', 'ters kutuplu*|ters yönde', 'Diyot ya da jonksiyonda katodun anoda göre daha pozitif olması. Diyot bu yönde akım geçirmez (zener kendi gerilimine kadar).'],
  ['Doğrultma', 'doğrult*', 'AC\'yi tek yönlü akıma çevirme. Yarım dalgada bir diyot, köprü doğrultucuda dört diyot kullanılır.'],
  ['Dalgalanma (ripple)', 'dalgalanma*', 'DC çıkıştaki küçük periyodik iniş çıkış (ΔV). Doğrultucuda kondansatör, dönüştürücüde L ve C ile küçültülür.'],
  ['Transistör', 'transistör*', 'Küçük bir kontrol sinyaliyle büyük akımı açıp kapayan ya da yükselten yarı iletken. Kendisi enerji üretmez, akışı ayarlar.'],
  ['BJT', 'BJT', 'Bipolar jonksiyon transistör: bazdan giren küçük akım, kollektörden emetöre akan büyük akımı kontrol eder. Uçları baz (B), kollektör (C), emetör (E).'],
  ['npn ve pnp', 'npn|pnp', 'BJT\'nin iki türü. npn\'de baz pozitif sürülür ve akım kollektörden emetöre akar; pnp\'de yönler terstir.'],
  ['Baz (B)', 'baz|bazdan|bazın|baza|bazda', 'BJT\'nin kontrol ucu. Buradan giren küçük baz akımı (I_B) kollektör akımını belirler.'],
  ['Kollektör (C)', 'kollektör*', 'BJT\'de büyük akımın girdiği uç (npn\'de). Aktif bölgede kollektör akımı I_C = β·I_B\'dir.'],
  ['Emetör (E)', 'emetör*', 'BJT\'de akımın çıktığı uç (npn\'de). Emetör akımı baz ve kollektör akımlarının toplamıdır: I_E = I_C + I_B.'],
  ['Emetör izleyici', 'emetör izleyic*', 'Çıkışı emetörden alınan BJT katı. Çıkış, girişi bir V_BE (≈ 0,7 V) aşağıdan izler; gerilim kazancı ≈ 1, akım kazancı büyüktür.'],
  ['Beta (β)', 'β|beta', 'BJT\'de akım kazancı: aktif bölgede I_C = β·I_B (tipik 50–300). Geri besleme konusunda β, çıkışın girişe geri dönen kesridir.'],
  ['I_B (baz akımı)', 'I_B', 'BJT\'nin bazına giren küçük kontrol akımı. Op-amp konusunda aynı simge giriş bias akımı için de kullanılır.'],
  ['I_C (kollektör akımı)', 'I_C', 'BJT\'nin kollektöründen geçen büyük akım. Aktif bölgede I_C = β·I_B; doyumda devre buna üst sınır koyar.'],
  ['I_E (emetör akımı)', 'I_E', 'BJT\'nin emetöründen çıkan akım: I_E = I_C + I_B = (β + 1)·I_B.'],
  ['V_BE', 'V_BE', 'Baz–emetör gerilimi. Silisyum BJT iletimdeyken yaklaşık 0,7 V\'tur.'],
  ['V_CE', 'V_CE', 'Kollektör–emetör gerilimi. Aktif bölgede beslemenin ortalarında olur; doyumda yaklaşık 0,2 V\'a iner.'],
  ['V_CC, V_BB', 'V_CC|V_BB', 'V_CC transistör devresinin pozitif besleme gerilimidir; V_BB baz devresini besleyen gerilimdir.'],
  ['Aktif bölge', 'aktif bölge*', 'BE jonksiyonu ileri, BC ters kutuplu çalışma. I_C = β·I_B ile orantılıdır; transistör yükselteç gibi davranır.'],
  ['Doyum', 'doy*', 'Bir büyüklüğün daha fazla artamadığı sınır. BJT\'de iki jonksiyon da ileridir ve V_CE ≈ 0,2 V olur; op-amp\'te çıkış besleme sınırına yapışır; bobinde çekirdek doyunca endüktans düşer.'],
  ['Kesim', 'kesim*', 'Transistörün ya da anahtarın tamamen kapalı, akım geçirmediği durum. BJT\'de baz akımı sıfırdır.'],
  ['Q noktası', 'q noktas*', 'Durgun çalışma noktası: sinyal yokken transistörün DC akımı ve gerilimi (I_C, V_CE).'],
  ['Kutuplama', 'kutupla*', 'Transistörü istenen çalışma noktasına oturtmak için verilen DC gerilim ve akımlar.'],
  ['Jonksiyon', 'jonksiyon*', 'Yarı iletkende p ve n bölgelerinin birleştiği eklem. BJT\'de BE ve BC olmak üzere iki tane vardır; ısıl hesapta T_j bunun sıcaklığıdır.'],
  ['Kazanç (A)', 'kazanç*|kazanc*', 'Çıkışın girişe oranı, A = V_o / V_i. Eksi işaret, sinyalin ters çevrildiğini gösterir.'],
  ['g_m (geçiş iletkenliği)', 'g_m', 'V_BE\'deki küçük değişimin kollektör akımını ne kadar değiştirdiği: g_m = I_C / V_T. Birimi siemens (S).'],
  ['V_T (ısıl gerilim)', 'V_T', 'Oda sıcaklığında yaklaşık 25 mV olan sabit (kT/q). Diyot ve BJT denklemlerinde görünür.'],
  ['Op-amp', 'op-amp*|opamp*', 'İşlemsel yükselteç: iki girişi (+ ve −) arasındaki farkı çok büyük kazançla yükselten entegre. Geri beslemeyle kazancı dış dirençler belirler.'],
  ['Eviren', 'eviren*', 'Sinyalin işaretini ters çeviren. Op-amp\'in − girişi eviren giriştir; eviren yükselteçte V_o = −(R_F / R1)·V_i.'],
  ['Evirmeyen', 'evirmeyen*|eviremeyen*', 'Sinyalin işaretini koruyan. Evirmeyen yükselteçte sinyal + girişe gelir: V_o = (1 + R_F / R1)·V_i.'],
  ['Gerilim izleyici', 'gerilim izleyic*|izleyic*', 'Kazancı 1 olan op-amp devresi; çıkış girişi aynen izler. Giriş akım çekmediği için zayıf bir kaynağı yükten ayırır (tampon).'],
  ['R_F (geri besleme direnci)', 'R_F|R_f', 'Op-amp çıkışından − girişe bağlanan direnç. R1 ile birlikte devrenin kazancını belirler.'],
  ['Sanal toprak', 'sanal toprak*|sanal toprağ*', 'Negatif geri beslemeli op-amp\'te + giriş topraktayken − girişin de 0 V\'ta kalması. Bu uç toprağa bağlı değildir, oradan toprağa akım akmaz.'],
  ['Sanal kısa devre', 'sanal kısa devre*', 'Negatif geri beslemeli ideal op-amp\'te iki girişin aynı gerilimde olması (V₊ ≈ V₋). Girişler arasından akım akmaz; gerçek bir kısa devre değildir.'],
  ['Geri besleme', 'geri besleme*', 'Çıkışın bir kısmını girişe geri vermek. Negatif geri besleme hatayı küçültüp kazancı sabitler; pozitif geri besleme farkı büyütür (Schmitt, osilatör).'],
  ['Açık çevrim', 'açık çevrim*', 'Geri besleme olmadan çalışma. Op-amp\'in açık çevrim kazancı (A) çok büyüktür, 10⁵ düzeyinde.'],
  ['Kapalı çevrim kazancı (A_f)', 'kapalı çevrim*|A_f', 'Geri beslemeli devrenin kazancı: A_f = A / (1 + Aβ). Aβ ≫ 1 ise A_f ≈ 1/β olur.'],
  ['Çevrim kazancı (Aβ)', 'çevrim kazanc*|Aβ', 'Geri besleme döngüsünde bir tur dolaşan sinyalin gördüğü kazanç. Kararlılık buradan okunur.'],
  ['Bant genişliği (GBW)', 'bant genişliğ*|GBW', 'Yükseltecin kazancını koruduğu frekans aralığı. Op-amp\'te kazanç × bant genişliği (GBW) yaklaşık sabittir: f_H = GBW / A_f.'],
  ['Eğim hızı (SR)', 'eğim hız*|slew rate|SR', 'Op-amp çıkışının değişebileceği en büyük hız (V/µs). Sinüste bozulmasız en yüksek frekans f_max = SR / (2π·V_p).'],
  ['Ofset gerilimi (V_OS)', 'ofset*|V_OS', 'Girişler eşitken bile çıkışta hata yaratan küçük iç gerilim (birkaç mV). Evirmeyen kazançla birlikte yükselir.'],
  ['Bias akımı', 'bias*', 'Op-amp girişlerinin çektiği çok küçük DC akım (nA düzeyi). Geri besleme direncinden geçince çıkışta hata gerilimi yaratır.'],
  ['Ortak mod, CMRR', 'ortak mod*|CMRR', 'Ortak mod, iki girişe birlikte gelen gerilimdir (ör. parazit). CMRR, fark kazancının ortak mod kazancına oranıdır: A_fark / A_ortak.'],
  ['Fark yükselteci', 'fark yükselte*', 'İki giriş arasındaki farkı yükseltip ortak gerilimi yok sayan op-amp devresi: V_o = (R2/R1)·(V₂ − V₁).'],
  ['Enstrümantasyon yükselteci', 'enstrümantasyon*', 'Girişleri tamponlanmış, kazancı tek bir R_G direnciyle ayarlanan, CMRR\'si yüksek fark yükselteci. Sensör ölçümünde kullanılır.'],
  ['Toplayıcı', 'toplayıc*', 'Girişlerin ağırlıklı toplamını ters işaretli veren eviren op-amp devresi: V_o = −R_F·(V₁/R1 + V₂/R2).'],
  ['İntegral alıcı', 'integral alıc*', 'Geri beslemede kondansatör olan op-amp devresi; çıkış girişin zamana göre integralidir. Sabit giriş doğrusal rampa verir.'],
  ['Türev alıcı', 'türev alıc*', 'Girişte kondansatör olan op-amp devresi; çıkış girişin değişim hızıyla orantılıdır: V_o = −R_F·C·dV_i/dt.'],
  ['Schmitt tetikleyici', 'schmitt*', 'Pozitif geri beslemeli karşılaştırıcı. Yukarı ve aşağı geçiş eşikleri farklıdır; gürültülü girişte çıkış bir kez değişir.'],
  ['Histerezis', 'histerezis*', 'Bir sistemin çıkışının geçmişe bağlı olması; Schmitt\'te iki eşik arasındaki fark. Bataryada şarj ve deşarj gerilim eğrilerinin farklı olmasıdır.'],
  ['Faz payı (PM)', 'faz pay*|PM', 'Çevrim kazancının 1 (0 dB) olduğu frekansta fazın −180°\'ye uzaklığı. 45°\'nin altı aşma ve çınlama getirir.'],
  ['Kutup', 'kutup*|kutb*', 'Motorda mıknatıs alanının N ya da S ucu; P kutup = P/2 kutup çifti. Frekans cevabında ise kazancın düşmeye, fazın gecikmeye başladığı frekanstır (f_p).'],
  ['Osilatör', 'osilatör*|osilasyon*|salınım*', 'Kendi kendine periyodik sinyal üreten devre. Salınım için döngüde kazanç tam 1, faz 0° olmalıdır.'],
  ['MOSFET', 'MOSFET', 'Gerilimle kontrol edilen transistör: gate–source gerilimi (V_GS) drain–source kanalını açar. Gate\'e kalıcı akım gitmez.'],
  ['Gate, drain, source', 'gate*|drain*|source*', 'MOSFET\'in üç ucu. Gate kontrol ucudur ve kanaldan yalıtılmıştır; ana akım drain ile source arasından akar.'],
  ['V_GS', 'V_GS', 'MOSFET\'in gate–source gerilimi. V_th\'yi aşınca kanal açılır; tam iletim için çok üstünde (ör. 10 V) olmalıdır.'],
  ['V_th (eşik gerilimi)', 'V_th', 'MOSFET\'in iletmeye yeni başladığı V_GS. Bu gerilimde MOSFET henüz tam açık değildir.'],
  ['V_DS', 'V_DS', 'MOSFET\'in drain–source gerilimi. Kapanışta bobin yüzünden sıçrarsa MOSFET\'i yakabilir.'],
  ['R_DS(on)', 'R_DS(on)', 'Tam iletimdeki MOSFET\'in drain–source direnci (mΩ düzeyi). İletim kaybı P = I²·R_DS(on); sıcaklıkla artar.'],
  ['Low-side ve high-side', 'low-side*|high-side*', 'Low-side anahtar yük ile toprak arasında, high-side anahtar besleme ile yük arasında durur. High-side N-MOSFET\'in gate\'i beslemenin üstüne çıkarılmalıdır (bootstrap).'],
  ['Bootstrap', 'bootstrap*', 'High-side MOSFET\'in gate\'ini sürmek için her periyotta dolan, beslemenin üstüne gerilim sağlayan kondansatör düzeni.'],
  ['Q_g (gate yükü)', 'Q_g', 'MOSFET\'i açmak için gate\'e verilmesi gereken toplam yük (nC). Sürücü her açılışta bunu sağlar.'],
  ['Gövde diyodu', 'gövde diyo*', 'MOSFET yapısında drain ile source arasında doğal olarak bulunan diyot. Ölü zamanda akımı taşır.'],
  ['PWM', 'PWM', 'Darbe genişlik modülasyonu: anahtar sabit frekansta açılıp kapanır, açık kalma oranı (D) değiştirilerek ortalama gerilim ayarlanır.'],
  ['Görev oranı (D)', 'görev oran*', 'Bir periyotta anahtarın iletimde kaldığı sürenin periyoda oranı (0–1 ya da %). PWM\'de V_ort = D·V.'],
  ['Bobin (endüktör)', 'bobin*|endüktör*', 'Tel sargısından oluşan, enerjiyi manyetik alanda depolayan eleman. Akımı aniden değişemez; DC kalıcı durumda kısa devre gibidir.'],
  ['Endüktans (L)', 'endüktans*', 'Bobinin akım değişimine karşı koyma ölçüsü: v = L·di/dt. Birimi henry (H); pratikte µH ve mH kullanılır.'],
  ['Kaçak endüktans', 'kaçak endüktans*', 'Trafo sargıları arasında tam bağlanamayan akıdan doğan küçük seri endüktans. Anahtar kesilince gerilim sıçraması yapar.'],
  ['H köprüsü', 'h köprüs*|h köprü', 'Dört anahtarlı devre; çaprazdaki iki anahtar iletince motor bir yönde, öteki çift iletince ters yönde döner.'],
  ['Shoot-through', 'shoot-through*', 'Aynı koldaki üst ve alt anahtarın birlikte iletip beslemeyi kısa devre etmesi. Çok büyük akım anahtarları yakar.'],
  ['Ölü zaman', 'ölü zaman*', 'Bir anahtar kapandıktan sonra öteki açılmadan önce bırakılan kısa bekleme. Shoot-through\'u önler.'],
  ['Zıt EMK (E)', 'zıt emk*', 'Dönen motorun hızıyla orantılı ürettiği, uygulanan gerilime karşı koyan gerilim: E = K_e·ω.'],
  ['Armatür (R_a, L_a)', 'armatür*|R_a|L_a', 'DC motorun dönen, akım taşıyan sargısı. Direnci R_a, endüktansı L_a ile gösterilir.'],
  ['Tork (T)', 'tork*', 'Döndürme momenti; birimi Nm. DC motorda akımla orantılıdır: T = K_t·I.'],
  ['K_t ve K_e', 'K_t|K_e', 'Motor sabitleri. K_t tork sabitidir (T = K_t·I, Nm/A); K_e zıt EMK sabitidir (E = K_e·ω, V·s/rad). SI\'da sayısal olarak eşittirler.'],
  ['Kv', 'kv', 'Motorun yüksüz hızının gerilime oranı (rpm/V). Kv\'si düşük motor amper başına daha çok tork verir.'],
  ['Açısal hız (ω)', 'ω', 'Dönme hızı, rad/s cinsinden. rpm\'den çevirmek için: ω = n·2π / 60.'],
  ['rpm', 'rpm', 'Dakikadaki tur sayısı. 1000 rpm ≈ 105 rad/s.'],
  ['Rotor ve stator', 'rotor*|stator*', 'Motorun dönen kısmı rotor, duran kısmı statordur.'],
  ['Fırça', 'fırça*', 'Fırçalı DC motorda dönen sargıya akım taşıyan kayan kontak. Akım yönünü mekanik olarak çevirir (komütatör).'],
  ['BLDC motor', 'BLDC|fırçasız*', 'Fırçasız DC motor: mıknatıslar rotorda, sargılar statordadır. Sürücü sargıları rotor konumuna göre sırayla anahtarlar.'],
  ['Komütasyon', 'komütasyon*', 'Motor sargılarındaki akımın sırayla bir sargıdan ötekine aktarılması. Fırçalı motorda fırçalar, BLDC\'de sürücü yapar.'],
  ['Hall sensörü', 'hall*', 'Manyetik alanı algılayan sensör. BLDC\'de üç Hall sensörü rotor konumunu 60° elektriksel çözünürlükle verir.'],
  ['Asenkron motor', 'asenkron*', 'Rotoru stator alanından biraz yavaş dönen AC motor (indüksiyon motoru). Hız farkı (kayma) rotorda akım ve tork doğurur.'],
  ['Senkron hız (n_s)', 'senkron*|n_s', 'Stator döner alanının hızı: n_s = 120·f / P (rpm, P kutup sayısı). Senkron motor tam bu hızda döner.'],
  ['Kayma (s)', 'kayma|kaymadan', 'Asenkron motorda rotorun senkron hızdan geri kalma oranı: s = (n_s − n) / n_s.'],
  ['Step motor', 'step motor*|mikro adım*', 'Her darbede sabit bir açı dönen motor; konum darbeler sayılarak bilinir. Mikro adımda her tam adım küçük parçalara bölünür.'],
  ['FOC', 'FOC|i_q|i_d', 'Alan yönlendirmeli kontrol: faz akımlarını rotorla dönen i_d ve i_q bileşenlerine ayırır. Torku i_q belirler, i_d normalde sıfır tutulur.'],
  ['V/f kontrol', 'v/f', 'Asenkron motorda gerilimi frekansla orantılı değiştirme. Akı V/f ile orantılı olduğu için sabit kalır, çekirdek doymaz.'],
  ['Akı (Φ)', 'akı|akıya|akısı|akısına|akıdan|akıyla|Φ', 'Manyetik akı: bir yüzeyden geçen manyetik alan miktarı. Birimi weber (Wb).'],
  ['Rejeneratif fren', 'rejen*', 'Frenlenen motorun jeneratör gibi çalışıp enerjiyi bus\'a ya da bataryaya geri vermesi.'],
  ['Bus (DC bara)', 'bus*|bara*|C_bus', 'Sürücü ya da inverterin DC besleme hattı. Üzerindeki büyük bus kondansatörü (C_bus) ani akımları karşılar.'],
  ['İnverter', 'inverter*', 'DC\'yi AC\'ye çeviren güç devresi; motor sürücülerinde üç fazlı köprüdür.'],
  ['Ön şarj (R_pre)', 'ön şarj*|R_pre', 'Ana kontaktör kapanmadan önce bus kondansatörünü bir dirençle (R_pre) yavaşça doldurma. Ani akım darbesini ve kontak kaynamasını önler.'],
  ['Kontaktör ve röle', 'kontaktör*|röle*', 'Bobinle çekilen kontaklarla devreyi açıp kapayan elektromekanik anahtar. Kontaktör büyük akımlar için yapılmış rölesidir.'],
  ['Sigorta', 'sigorta*', 'Aşırı akımda erip devreyi açan koruma elemanı.'],
  ['Anahtar', 'anahtar|anahtarı|anahtarın|anahtarda|anahtarlar*', 'Devreyi açıp kapayan eleman. Kapalı anahtar iletir ve üzerinde 0 V düşer; açık anahtar akımı keser.'],
  ['BMS', 'BMS', 'Batarya yönetim sistemi: hücre gerilimlerini, akımı ve sıcaklığı izler; sınır aşılınca akımı keser ve hücreleri dengeler.'],
  ['Hücre', 'hücre*', 'Bataryanın tek elektrokimyasal birimi. Paket, hücrelerin seri ve paralel bağlanmasıyla kurulur (10S4P: 10 seri grup, her grupta 4 paralel).'],
  ['Li-ion', 'li-ion*', 'Lityum iyon pil: hafif ve enerji yoğun. Aşırı şarj, derin deşarj ve yanlış sıcaklıkta kalıcı hasar görür.'],
  ['NMC ve LFP', 'NMC|LFP', 'Li-ion kimyaları. NMC: nominal 3,6 V, tam dolu 4,2 V. LFP: nominal 3,2 V, tam dolu 3,65 V; gerilim eğrisi çok düzdür.'],
  ['Nominal gerilim', 'nominal*', 'Bir hücrenin ortalama, tasarım gerilimi; enerji hesabında kullanılır (NMC\'de 3,6 V).'],
  ['C oranı', 'c oran*', 'Şarj ya da deşarj akımının kapasiteye oranı. 1C paketi bir saatte boşaltır; 50 Ah pakette 1C = 50 A.'],
  ['SoC (şarj durumu)', 'soc', 'Kalan yükün kapasiteye oranı (%). Coulomb sayma ve dinlenmiş OCV ile tahmin edilir.'],
  ['OCV', 'OCV', 'Açık devre gerilimi: yük bağlı değilken, dinlenmiş hücrenin gerilimi. SoC tahmininde kullanılır.'],
  ['Balans (dengeleme)', 'balans*', 'Seri hücreleri aynı doluluğa getirme. Pasif balans fazlalığı dirençte ısıya çevirir, aktif balans enerjiyi hücreler arasında taşır.'],
  ['Termal kaçak', 'termal kaçak*|termal kaçağ*', 'Hücrenin ısınmasının kendini besleyip kontrolden çıkması; yangına yol açabilir.'],
  ['Buck dönüştürücü', 'buck', 'Gerilim düşüren anahtarlamalı dönüştürücü: V_o = D·V_in. Akım ise girişten büyük olur.'],
  ['Boost dönüştürücü', 'boost', 'Gerilim yükselten anahtarlamalı dönüştürücü: V_o = V_in / (1 − D).'],

function bindBackup() {
  const st = $('#yst'), inp = $('#yfile'), note = (t, err) => { st.textContent = t; st.classList.toggle('err', err); };
  $('#ydown').onclick = async () => {
    const name = `akimli-yedek-${new Date(dayNum() * 864e5).toISOString().slice(0, 10)}.json`, file = new File([JSON.stringify(S)], name, { type: 'application/json' });
    // iPhone ana ekran uygulamasında <a download> çalışmaz; paylaşım menüsü Dosyalar'a kaydetmeyi sunar.
    if (navigator.standalone && navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file] }); note('Yedek paylaşıldı. Dosyayı güvenli bir yere koy.', false); }
      catch (e) { if (e.name !== 'AbortError') note('Paylaşılamadı. Bir daha dene.', true); }
      return;
    }

    a.href = URL.createObjectURL(file); a.download = name;

  };
  $('#yup').onclick = () => inp.click();
  inp.onchange = async () => {
    const f = inp.files[0]; inp.value = '';

    let p; try { p = JSON.parse(raw); } catch {}
    // parseState bozuk dosyada sıfır ilerleme döner; yedek olmayanı burada ayırırız.
    if (!p || typeof p !== 'object' || typeof p.xp !== 'number' || !p.done || typeof p.done !== 'object') return note('Bu dosya bir Akımlı yedeği değil. İlerlemen değişmedi.', true);
    const n = parseState(raw, Object.keys(QUESTIONS));
    if (!confirm(`Şu anki ilerlemen (${S.xp} XP, ${Object.keys(S.done).length} ders) silinip yedektekiyle (${n.xp} XP, ${Object.keys(n.done).length} ders) değiştirilsin mi?`)) return note('Yükleme iptal edildi.', false);
    S = n; save(); route(); setTimeout(() => $('#yst').textContent = 'Yedek yüklendi.', 100); // route ekranı yeniden çizer; yeni canlı bölge önce yerleşmeli ki okunsun
  };
}

/* ---------- Soru oturumu ---------- */
let C = null; // etkin oturum; lid yoksa Tekrar

const fig = q => q.c ? `<div class="fig">${circuit(q.c)}</div>${C.fl && !q.fa ? FLOWBTN : ''}` : ''; // fa: akış cevabı gösteriyorsa ipucu cevaptan sonra

  const r = m.calc(v);
  $(`#${p}rd`).innerHTML = m.out.map(([k, n, u]) => `<div>${tx(n)}<b>${fmt(+r[k].toFixed(3))} ${u}</b></div>`).join('');

// Önce tahmin: p[0] kaydırıcısı artınca p[1] çıktısı ne olur? Diğer kaydırıcılar başlangıç değerinde; yön calc'tan çıkar.

const simDir = m => { const v = Object.fromEntries(m.s.map(s => [s[0], s[5]])), k = m.s.find(s => s[0] === m.p[0]), y = x => m.calc({ ...v, [k[0]]: x })[m.p[1]], d = y(k[3]) - y(k[2]); return d > 1e-9 ? 0 : d < -1e-9 ? 1 : 2; };
const simPred = m => { const y = m.out.find(o => o[0] === m.p[1])[1]; return [m.s.find(s => s[0] === m.p[0])[1], /^\p{Lu}\p{Ll}/u.test(y) ? y[0].toLocaleLowerCase('tr') + y.slice(1) : y]; };

// Arıza sorusu: etiketteki "|" sonrası rakamlı ölçü, kullanıcı ölçene kadar gizli kalır.
const reading = e => { const m = (e && e[5] || '').split('|')[1]; return m && /\d/.test(m) ? m : ''; };
const nodes = q => q.c.filter(e => (e[0] === 'T' || e[0] === 'P') && reading(e));
const nodeName = e => { const [a, m] = e[5].split('|'); return a ? a.split('\n')[0] : m.split(' = ')[0]; }, nodeVal = e => reading(e).split(' = ').pop();
const VIEW = {
  mc: q => { C.perm = shuffle(q.o.length); return fig(q) + optList(q); },
  num: q => (q.b ? `<div class="fig">${resistor(q.b)}</div><p class="note">Bantlar: ${q.b.join(', ')}</p>` : fig(q)) + `<form class="num"><input id="n" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-label="Cevap, birim ${q.u}" aria-describedby="nerr"><b>${q.u}</b></form><p class="note" id="nerr" aria-live="polite">±%2 tolerans. Virgül veya nokta kullanabilirsin.</p>`,
  kur: () => `<div class="fig" id="res"></div><div class="slots">${[0, 1, 2].map(i => `<button data-s="${i}"></button>`).join('')}</div><div class="pal">${COLORS.map(c => `<button data-c="${c}"><i style="background:${HEX[c]}"></i>${c}</button>`).join('')}</div>`,
  ariza: q => { const m = q.c.some(e => e[6] && reading(e)), nd = nodes(q); return (m ? '<div class="seg" role="group" aria-label="Dokunma modu"><button aria-pressed="true">Ölç</button><button aria-pressed="false">Seç</button></div>' : '') + `<div class="fig">${circuit(q.c, { pick: true })}</div>`
    + (nd.length ? `<div class="prb" role="group" aria-label="Ölçüm noktaları"><span>Ölç:</span>${nd.map((e, i) => `<button data-n="${i}">${tx(nodeName(e))}</button>`).join('')}</div>` : '')
    + (m || nd.length ? `<p class="dmm" aria-live="polite"><small>${m ? 'Ölçmek için bir elemana dokun. Arızalıyı bulunca Seç’e geç.' : 'Bir ölçüm noktasına dokun, sonra arızalı elemanı seç.'}</small></p>` : ''); },
  sira: q => { do C.perm = shuffle(q.o.length); while (C.perm.every((v, i) => v === i)); return '<p class="note">İlk sıradan başlayarak dokun. Geri almak için tekrar dokun.</p>' + optList(q, true); },
  sim: q => { const [x, y] = simPred(SIMS[q.sim]); return `<div class="fig" id="sv"></div><div class="read" id="rd"></div><div class="pred"><p><b>Önce tahmin et.</b> ${tx(x)} artarsa ${tx(y)} ne olur?</p><div class="opts">${PRED.map((o, i) => `<button class="opt" aria-pressed="false" data-p="${i}"><span>${o}</span></button>`).join('')}</div><p class="note" id="pn" aria-live="polite"></p></div><div>${simSliders(q.sim, '', ' disabled')}</div><p class="note" id="warn" aria-live="polite"></p>`; }
};
const BIND = {
  mc: () => $$('.opt').forEach(b => b.onclick = () => { $$('.opt').forEach(x => x.setAttribute('aria-pressed', x === b)); answer(+b.dataset.i); }),
  num: () => { const n = $('#n'); n.oninput = () => answer(n.value, n.value.trim() !== ''); $('form').onsubmit = e => { e.preventDefault(); if (!$('#ok').disabled) check(); }; },
  kur: () => {
    const v = [null, null, null], names = ['1. rakam', '2. rakam', 'Çarpan']; let cur = 0;
    const draw = () => { $$('[data-s]').forEach((b, i) => { b.setAttribute('aria-pressed', i === cur); b.textContent = v[i] ? `${names[i]}: ${v[i]}` : names[i]; }); $('#res').innerHTML = resistor([...v, 'altın']); };
    $$('[data-s]').forEach((b, i) => b.onclick = () => { cur = i; draw(); });

    const nd = nodes(q), gs = $$('.ckt .node'), nhid = gs.map((g, i) => { const t = $('.me', g), h = t.innerHTML, v = esc(nodeVal(nd[i])), k = h.lastIndexOf(v); t.innerHTML = h.slice(0, k) + '?' + h.slice(k + v.length); return h; });

  },

      b.classList.add(ok ? 'good' : 'bad');
      $('#pn').textContent = ok ? 'Doğru tahmin.' : 'Tahminin tutmadı, simülasyonda kendin gör.';
      if (!ok) C.miss = `${x} artınca ${y} ${PRED[d].toLocaleLowerCase('tr')}.`;
      go = true; $$('.sl input').forEach(i => i.disabled = false); upd();
      $('.sl input').focus(); // basılan düğme kilitlendi; odak açılan ilk kaydırıcıya geçer
    });

  }
};
VIEW.oku = VIEW.num; BIND.oku = BIND.num;
const SIMVIEW = {
  ohm: (v, r, glow) => circuit(loop(`${fmt(v.V)} V`, [['L', 'Lamba', `${fmt(v.R)} Ω`]]), { glow, flow: true }),
  led: (v, r, glow) => circuit(loop(`${fmt(v.V)} V`, [['R', 'R', `${fmt(v.R)} Ω`], ['LED', 'LED', '2 V']]), { glow, flow: true }),
  bolucu: v => circuit([...loop('12 V', [['R', 'R1', `${fmt(v.R1)} kΩ`], ['R', 'R2', `${fmt(v.R2)} kΩ`]]), ['N', 280, 40], ['N', 280, 180]], { flow: true }),
  rc: (v, r) => rcCurve(r.T),
