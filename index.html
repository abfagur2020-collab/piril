};

// Konu anlatımı: sorulardan önce kısa kartlar. Alttaki düğme tek dokunuşla sorulara geçirir.
function intro(l) {
  C = null;
  const n = l.k.length, seen = new Set(), sim = (c, p) => `<div class="fig" id="${p}sv"></div><div class="read" id="${p}rd"></div><div>${simSliders(c.sim, p)}</div><p class="note" id="${p}warn" aria-live="polite"></p>`;
  app.innerHTML = `<main class="scr"><div class="top"><button class="x" data-go="ana" aria-label="Çık">${ICON.x}</button><p class="kind">Konu anlatımı · ${n} kart</p></div><h1 tabindex="-1">${tx(l.name)}</h1>
  ${l.k.map((c, i) => `<section class="kart"><p class="kind">${i + 1}/${n}</p><h2>${tx(c.h)}</h2><p>${txg(c.p, seen)}</p>${c.f ? `<div class="frm">${c.f.map(x => `<code>${tx(x)}</code>`).join('')}</div>` : ''}${c.c ? `<div class="fig">${circuit(c.c, { flow: c.fl || true })}</div>` : ''}${c.sim ? sim(c, `k${i}-`) : ''}${c.r ? `<div class="real"><b>Gerçek hayatta</b><p>${tx(c.r.replace(/^Gerçek hayatta:?\s*/i, ''))}</p></div>` : ''}</section>`).join('')}</main>
  <div class="foot"><button class="btn" data-go="ders-${l.id}">Sorulara başla</button></div>`;
  l.k.forEach((c, i) => { if (!c.sim) return; const p = `k${i}-`, draw = () => simDraw(c.sim, p); SIMS[c.sim].s.forEach(s => $(`#${p}s-${s[0]}`).oninput = draw); draw(); });
  focusTop();
}

// İpucu düğmesi: her basış bir adım açar ve XP'den düşer; adımlar bitince yalnız gizler/gösterir.
const BULB = line24('<path d="M9 18h6M10 21h4"/><path fill="var(--led)" d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.3 1 2.1h5c0-.8.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>');
const hintBox = q => (C.hints = hints(q)).length ? `<div class="ipc"><button class="ipb" id="ipb" aria-expanded="false" aria-controls="ipt">${BULB}<span></span></button><div id="ipt" aria-live="polite"></div></div>` : '';
function hintLabel() {
  const b = $('#ipb'), k = C.hint, z = C.q.z, more = k < C.hints.length;
  $('span', b).innerHTML = more ? `${k ? 'Formül ipucu' : 'İpucu'} <small>−${XP_HINT(z, k) - XP_HINT(z, k + 1)} XP</small>` : $('#ipt').hidden ? 'İpucunu göster' : 'İpucunu gizle';
}
function hintStep() {
  const t = $('#ipt');
  if (C.hint < C.hints.length) { const i = C.hint++, x = C.hints[i]; t.hidden = false; t.insertAdjacentHTML('beforeend', `<p><b>${i ? 'Formül' : 'Yöntem'}:</b> ${i ? `<code>${tx(x)}</code>` : tx(x)}</p>`); }
  else t.hidden = !t.hidden;
  $('#ipb').setAttribute('aria-expanded', !t.hidden); hintLabel();
}

function question() {
  const q = C.q = QUESTIONS[C.queue[0]]; C.ans = null; C.checked = false; C.hint = 0; C.fl = q.c ? 'fl' in q ? q.fl : q.t !== 'ariza' && flowOf(q.c) : null; if (!C.fl?.length) C.fl = null; // fl: null akışı kapatır
  app.innerHTML = `<main class="scr"><div class="top"><button class="x" data-go="${C.lid ? 'ana' : 'tekrar'}" aria-label="Çık">${ICON.x}</button>${bar(C.n, C.total, 'İlerleme')}<output>${C.lid ? `${C.n + 1}/${C.total}` : `${C.queue.length} kaldı`}</output></div>
  <div><p class="kind">${zTag(q.z)} · ${KIND[q.t]}</p><h1 class="q" tabindex="-1">${txg(q.q)}</h1>${hintBox(q)}</div>${VIEW[q.t](q)}</main><div class="foot" aria-live="polite"><button class="btn" id="ok" disabled>Kontrol et</button></div>`;
  BIND[q.t](q);
  $('#ok').onclick = check;
  if ($('#akb')) $('#akb').onclick = flowToggle;
  if ($('#ipb')) { $('#ipb').onclick = hintStep; hintLabel(); }
  focusTop();
}

function check() {
  if (C.checked) return;
  const q = C.q, id = C.queue[0], ok = grade(q, C.ans, SIMS), xp = XP_HINT(q.z, C.hint);
  if (ok === null) { const e = $('#nerr'); e.textContent = 'Bunu sayı olarak okuyamadım. Yalnızca rakam yaz, örneğin 2,5.'; e.className = 'note err'; $('#n').focus(); return; }
  C.checked = true; C.queue.shift();
  record(S, id, q.t, ok, dayNum(), q.z, xp);
  if (ok) C.right++;
  C.combo = ok ? (C.combo || 0) + 1 : 0;
  if (ok) { if (C.combo % 3 === 0) party(C.combo); else cheer(); }
  if (ok || C.lid) C.n++; else C.queue.push(id); // Tekrar'da yanlış soru kuyruğun sonuna döner
  if (C.lid && !C.queue.length) finishLesson(S, C.lid, C.right, C.total, dayNum());
  const end = !!C.lid && !C.queue.length, qr = questEv(S, { ok, t: q.t, z: q.z, rev: !C.lid, combo: C.combo, fin: end, perfect: end && C.right === C.total, xp: todayXp(S, dayNum()) }, dayNum());
  if (qr.n) questToast(qr, ok && C.combo % 3 === 0 ? 2600 : 0);
  save();
  const mark = (el, v) => { if (v === String(q.a)) el.classList.add('good'); else if (v === String(C.ans)) el.classList.add('bad'); };
  if (q.t === 'mc') $$('.opt').forEach(b => mark(b, b.dataset.i));
  if (q.t === 'ariza') $$('.part').forEach(p => mark(p, p.dataset.id));
  if (q.t === 'sira' && !ok) $$('.opt').sort((a, b) => a.dataset.i - b.dataset.i).forEach((b, i) => { $('kbd', b).textContent = i + 1; b.parentNode.append(b); });
  $$('main button:not(.x):not(#akb):not(.term),main input').forEach(b => b.disabled = true);
  if (C.fl) { if (!$('#akb')) { $('.fig').insertAdjacentHTML('afterend', FLOWBTN); $('#akb').onclick = flowToggle; } showFlow(true); } // açıklama görsel olsun
  const right = { mc: () => q.o[q.a], ariza: () => q.a, kur: () => q.a.join(', '), num: () => `${fmt(q.a)} ${q.u}`, oku: () => `${fmt(q.a)} ${q.u}`, sira: () => 'sıra yukarıda', sim: () => '' }[q.t]();
  const foot = $('.foot'), hint = !ok && (q.t === 'num' || q.t === 'oku') ? clue(C.ans, q.a) : '';
  foot.className = 'foot ' + (ok ? 'good' : 'bad'); buzz(ok ? 12 : [20, 40, 20]);
  foot.innerHTML = `<div class="fb">${mascot(ok ? 'iyi' : 'kotu')}<div><h2>${ok ? `Doğru, +${xp} XP` : 'Yanlış'}</h2>${ok && C.hint ? `<p class="note">İpucu: −${XP_Z[q.z] - xp} XP</p>` : ''}${ok ? '' : `${right ? `<p><b>Doğru cevap: ${tx(right)}</b></p>` : ''}${hint ? `<p>${tx(hint)}</p>` : ''}<p>${txg(q.e)}</p>`}<code>${tx(q.f)}</code></div></div><button class="btn" id="nx">Devam</button>`;
  if (q.s) { $('main').insertAdjacentHTML('beforeend', `<section class="kart sol"><h2>Çözüm</h2><ol>${q.s.map(x => `<li>${tx(x)}</li>`).join('')}</ol></section>`); }
  if (q.t === 'sim' && C.miss) $('.fb h2').insertAdjacentHTML('afterend', `<p>${tx(C.miss)}</p>`);
  $('#nx').onclick = () => C.queue.length ? question() : finish();
  $('#nx').focus({ preventScroll: true });
}

function finish() {
  const t = dayNum(), wrong = C.lid ? C.total - C.right : 0, fresh = BADGES.filter((b, i) => !C.had[i] && b[2](S));
  app.innerHTML = `<main class="scr"><div class="end">${mascot(wrong < 3 ? 'iyi' : 'normal')}<h1 tabindex="-1">${!C.lid ? (C.practice ? 'Antrenman tamam' : 'Tekrar temizlendi') : wrong ? 'Ders tamam' : 'Hatasız bitirdin'}</h1>
  <dl class="tbl"><dt>Kazanılan</dt><dd>${S.xp - C.xp0} XP</dd>${C.lid ? `<dt>Doğru</dt><dd>${C.right} / ${C.total}</dd>` : ''}<dt>Bugün</dt><dd>${todayXp(S, t)} / ${GOAL} XP</dd><dt>Seri</dt><dd>${liveStreak(S, t)} gün</dd>${fresh.map(b => `<dt>Yeni rozet</dt><dd>${b[0]}</dd>`).join('')}</dl></div></main>
  <div class="foot">${wrong ? '<button class="btn" data-go="tekrar-coz">Yanlışları tekrar et</button><button class="btn alt" data-go="ana">Derslere dön</button>' : '<button class="btn" data-go="ana">Derslere dön</button>'}</div>`;
  focusTop();
}

/* ---------- Yönlendirme: Android geri tuşu hash geçmişiyle çalışır ---------- */
function route() {
  const h = location.hash.slice(1), d = /^(ders|konu)-(.+)$/.exec(h), l = d && LESSONS.find(x => x.id === d[2]);
  if (shown) scrollMem[shown] = scrollY;
  shown = null; termClose(false); if (document.getElementById('szo')) szClose();
  if (!h && needHos()) return welcome();
  // konu-: önce konu anlatımı; düğmesi ders-'e gider, geri tuşu anlatıma döner.
  if (l && unlocked(l)) return d[1] === 'konu' && l.k ? intro(l) : start(l.qs.map((_, i) => `${l.id}-${i + 1}`), l.id);
  const due = dueIds(S, dayNum());
  if (h === 'tekrar-coz' && due.length) return start(due, null);
  const pz = /^pratik-([123])$/.exec(h);
  if (pz) { const ids = byZ(+pz[1]), p = shuffle(ids.length).slice(0, 8); return start(p.map(i => ids[i]), null, true); }
  C = null;
  if (h === 'sozluk') { app.innerHTML = sozluk(); bindSozluk(app); return focusTop(); }
  shown = h === 'profil' ? 'profil' : h.startsWith('tekrar') ? 'tekrar' : 'ana';
  app.innerHTML = { profil: profile, tekrar: review, ana: home }[shown]();
  if (shown === 'profil') { bindReminder(); bindBackup(); cloudUI(); }
  focusTop(scrollMem[shown] || 0);
  // Uygulama yeni açıldığında sıradaki ders ekranın ortasına gelir.
  if (shown === 'ana' && !(shown in scrollMem) && S.xp) $('.node.next')?.scrollIntoView({ block: 'center' });
}
/* ---------- Hoş geldin: ilk açılışta Pırıl karşılar, hesabı sorar. Giriş isteğe bağlı (App Store 5.1.1(v)). ---------- */
const HOS = 'piril-hos';
const needHos = () => { try { return !localStorage.getItem(HOS) && !syncMeta().uid; } catch { return false; } };
function welcome(step = 0) {
  shown = null;
  const say = [
    'Merhaba, ben <b>Pırıl</b>! Günde 3 dakikada elektroniği birlikte öğreneceğiz. Burada yeni misin?',
    'Hoş geldin! İlerlemen kaybolmasın diye Google hesabınla kaydolabilirsin. İstersen hesapsız da başlayabilirsin.',
    'Tekrar hoş geldin! Google hesabınla gir, kaldığın yerden devam et.'
  ][step];
  const acts = step === 0 ? `<button class="btn" data-h="1">Ben yeniyim</button><button class="btn alt" data-h="2">Hesabım var</button>`
    : (FB ? `<div class="gbtn" id="gbtn"><p class="note">Google hazırlanıyor…</p></div>` : '') + `<button class="btn alt" id="hskip">${step === 1 ? 'Hesapsız başla' : 'Şimdilik geç'}</button>`;
  app.innerHTML = `<main class="scr hos"><div class="pr">${mascot('iyi').replace('<svg ', '<svg role="img" aria-label="Pırıl" ')}</div><h1 class="bubble" tabindex="-1">${say}</h1><div class="acts">${acts}</div><p class="note" id="hmsg" aria-live="polite"></p></main>`;
  $('h1').focus({ preventScroll: true });
  $$('[data-h]').forEach(b => b.onclick = () => { buzz(8); welcome(+b.dataset.h); });
  const done = () => { try { localStorage.setItem(HOS, '1'); } catch {} route(); };
  if (step) $('#hskip').onclick = done;
  const gb = $('#gbtn');
  if (gb) cloudLoad().catch(() => {}); // belge gelince Firebase hazır olsun
  if (gb) gisButton(gb, step === 1 ? 'signup_with' : 'continue_with', e => {
    if (!e) return done();
    if (gb.isConnected) $('#hmsg').textContent = 'Giriş tamamlanmadı. Bir daha dene ya da hesapsız başla.';
  }).catch(() => { if (gb.isConnected) { gb.textContent = ''; $('#hmsg').textContent = 'Google\'a bağlanılamadı. İnternetini kontrol et ya da hesapsız başla.'; } });
}
const calm = matchMedia('(prefers-reduced-motion: reduce)');
// Kısa titreşim yalnız destekleyen telefonda (Android); iPhone Safari desteklemez, sessizce geçer.
const buzz = ms => { if (!calm.matches) navigator.vibrate?.(ms); };
app.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (!b || b.disabled) return;
  const go = () => '#' + b.dataset.go === location.hash ? route() : location.hash = b.dataset.go;
  buzz(8);
  if (b.classList.contains('node') && !calm.matches) { b.classList.add('zap'); setTimeout(go, 300); } else go();
});
addEventListener('hashchange', route);
// iOS klavyesi sayfayı küçültmez; alt çubuğu klavyenin üstüne taşı. Android'de fark 0 çıkar.
const vv = window.visualViewport;
if (vv) vv.onresize = vv.onscroll = () => document.documentElement.style.setProperty('--kb', (vv.scale > 1.01 ? 0 : Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop))) + 'px');
document.body.insertAdjacentHTML('beforeend', '<div id="qlive" class="sr" aria-live="polite"></div>');
route();
shareState();
if (S.rem) armReminder(false); // kayıt silinmişse açılışta yeniden kurar
</script>
