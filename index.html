<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef3ee"><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1c1a">
<meta name="description" content="Günde 3 dakikalık elektronik dersleri">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Akımlı</title>
<style>
/* Düzen: ana sayfada her ünite bir baskı devre kartı, dersler bakır yolla bağlı lehim pedleri. Diğer ekranlar sade. */
:root{
  --bg:#eef3ee; --card:#fff; --ink:#12302c; --soft:#4b6661; --line:#c9d6cf;
  --mask:#15564c; --mask2:#0f463e; --silk:#eaf5ee; --copper:#d08a4a; --tin:#c9d4d0;
  --led:#f6b932; --ledink:#2c1f02; --good:#17703f; --goodbg:#dcf1e3; --bad:#b02f1f; --badbg:#fbe4df; --focus:#0b63c4; --sel:#fff1cc; --hi1:#fff1c7; --hi2:#d9ecff; --hot:#d63a22; --cold:#2a62c9; --bdo:.5;
  --disp:"Roboto Condensed","sans-serif-condensed","Avenir Next Condensed","Arial Narrow","Segoe UI",sans-serif;
  --body:Roboto,"Segoe UI",system-ui,sans-serif; --mono:"Roboto Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1c1a; --card:#12302c; --ink:#e4f0ea; --soft:#9bb8b0; --line:#2a4b45;
  --mask:#134c43; --mask2:#0d3a33; --silk:#eaf5ee; --copper:#d9955a; --tin:#b9c6c1;
  --led:#f6b932; --ledink:#2c1f02; --good:#6fd79a; --goodbg:#123d28; --bad:#ff9c8b; --badbg:#46201b; --focus:#8cc4ff; --sel:#4a3c12; --hi1:#3a3110; --hi2:#123049; --hot:#ff7657; --cold:#5ea8ff; --bdo:.72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1c1a; --card:#12302c; --ink:#e4f0ea; --soft:#9bb8b0; --line:#2a4b45;
  --mask:#134c43; --mask2:#0d3a33; --silk:#eaf5ee; --copper:#d9955a; --tin:#b9c6c1;
  --led:#f6b932; --ledink:#2c1f02; --good:#6fd79a; --goodbg:#123d28; --bad:#ff9c8b; --badbg:#46201b; --focus:#8cc4ff; --sel:#4a3c12; --hi1:#3a3110; --hi2:#123049; --hot:#ff7657; --cold:#5ea8ff; --bdo:.72; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button{user-select:none;-webkit-user-select:none;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1:focus{outline:none}
h1,h2{font-family:var(--disp);line-height:1.2;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:26px}
h2{font-size:20px}
p{margin:0}
sub{font-size:.72em;line-height:0}
#app{--gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));max-width:520px;margin:0 auto;
  min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scr{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:16px;min-width:0}

/* Alt gezinme */
nav{position:sticky;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-top:1px solid var(--line);
  margin-inline:calc(-1*var(--gl)) calc(-1*var(--gr));padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--soft);position:relative}
nav button[aria-current]{color:var(--ink);font-weight:700}
nav button[aria-current]::before{content:"";position:absolute;top:-1px;width:44px;height:3px;background:var(--copper)}
nav button:focus-visible{outline-offset:-4px}
nav svg{width:24px;height:24px}
nav b{position:absolute;top:5px;left:calc(50% + 8px);min-width:20px;border-radius:10px;padding:0 5px;background:var(--bad);color:var(--bg);font-size:12px;line-height:20px;text-align:center}

/* Durum şeridi */
.stat{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;align-items:center}
.stat span{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span+span{justify-content:flex-end}
.stat svg{width:22px;height:22px;flex:none}
.goal{grid-column:1/-1;font-size:14px;color:var(--soft);display:flex;flex-direction:column;gap:4px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--led);border-radius:5px;transition:width .3s}
.hello{display:flex;align-items:center;gap:12px}
.hello svg{width:84px;flex:none}
.hello div{min-width:0}
.hello p{color:var(--soft)}

/* Ünite kartı */
.pcb{background:var(--mask);color:var(--silk);border-radius:14px;padding:16px;box-shadow:inset 0 0 0 2px var(--mask2);min-width:0}
.pcb header{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.pcb header b{font:700 14px var(--mono);border:1.5px solid currentColor;padding:0 6px;border-radius:2px}
.pcb header h2{flex:1;min-width:0}
.pcb header small{font:13px var(--mono)}
.road{position:relative}
.road>svg{position:absolute;left:0;top:0;width:150px;pointer-events:none}
.node{display:flex;align-items:center;gap:14px;width:100%;height:96px;text-align:left;color:inherit;position:relative;border-radius:10px}
.node:nth-of-type(even){padding-left:56px}
.node:focus-visible{outline-color:#fff;outline-offset:-3px}
.pad{width:64px;height:64px;border-radius:50%;background:var(--copper);display:grid;place-items:center;flex:none;transition:transform .12s ease-out}
.node:active:not([disabled]) .pad{transform:scale(.94)}
.pad i{width:34px;height:34px;border-radius:50%;background:var(--mask2);display:grid;place-items:center;font:700 16px var(--mono);color:var(--silk)}
.node.done .pad{background:var(--tin)}
.node.done .pad i{background:var(--led);color:var(--ledink)}
.node.next .pad{box-shadow:0 0 0 5px var(--mask),0 0 0 8px var(--led)}
.node[disabled]{cursor:default}
.node[disabled] .pad{background:rgba(255,255,255,.3)}
.node em{font-style:normal;min-width:0}
.node strong{display:block;font-size:17px;line-height:1.25}
.node small{font-size:14px}

/* Ders */
.top{display:flex;align-items:center;gap:8px}
.top .bar{flex:1}
.top output{font:14px var(--mono);color:var(--soft)}
.x{width:44px;height:44px;margin-left:-10px;display:grid;place-items:center;flex:none;border-radius:8px}
.x svg{width:24px;height:24px}
.kind{font:13px var(--mono);color:var(--soft)}
.q{font-family:var(--body);font-size:20px;font-weight:600;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{width:100%;min-height:54px;padding:10px 14px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;display:flex;gap:12px;align-items:center;font-size:17px;transition:transform .1s ease-out}
.opt:active:not([disabled]){transform:scale(.985)}
.opt[aria-pressed=true]{border-color:var(--copper);background:var(--sel)}
.opt.good{border-color:var(--good);background:var(--goodbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt>span{min-width:0}
.opt kbd{font:700 15px var(--mono);width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.opt[aria-pressed=true] kbd{background:var(--led);border-color:var(--led);color:var(--ledink)}
.fig{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.fig svg{display:block;width:100%;max-width:400px;margin:auto;height:auto}
.ckt{color:var(--ink);font-family:var(--body);font-size:14px}
.ckt .ln{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ckt .fl{fill:currentColor}
.ckt text{fill:currentColor}
.ckt text.me{fill:var(--bad);font-weight:700;font-family:var(--mono);font-size:13px}
.ckt .hit{fill:transparent;stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4}
.ckt .part{cursor:pointer;outline:none}
.ckt .part:focus-visible .hit{stroke:var(--focus);stroke-width:3;stroke-dasharray:none}
.ckt .part[aria-checked=true] .hit{fill:var(--led);fill-opacity:.28;stroke:var(--copper);stroke-dasharray:none;stroke-width:2.5}
.ckt .part.good .hit{fill:var(--good);fill-opacity:.2;stroke:var(--good);stroke-dasharray:none}
.ckt .part.bad .hit{fill:var(--bad);fill-opacity:.2;stroke:var(--bad);stroke-dasharray:none}
.ckt .flow{pointer-events:none}
.ckt .bd{fill:none;stroke-linecap:round;stroke-opacity:var(--bdo)}
.ckt .ch{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ckt .sp{font:700 20px var(--mono)}
.ckt .sp.hot{fill:var(--hot)}
.ckt .sp.cold{fill:var(--cold)}
.flg{display:flex;gap:8px;align-items:baseline;margin:6px 4px 0;font-size:13px;line-height:1.35;color:var(--soft)}
.flg i{flex:none;width:28px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--hot),var(--cold))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.akb{align-self:flex-start;min-height:44px;padding:0 16px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-weight:700}
.akb[aria-pressed=true]{border-color:var(--copper);background:var(--sel)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prb{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.prb button{padding:0 16px}
.seg button,.prb button{min-height:48px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-weight:700}
.seg button[aria-pressed=true]{border-color:var(--copper);background:var(--sel)}
.dmm{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;min-height:64px;padding:10px 14px;border-radius:10px;background:var(--mask2);color:var(--silk);font:14px var(--mono);box-shadow:inset 0 0 0 2px var(--mask)}
.dmm b{font-size:28px;line-height:1.2;color:var(--led);font-variant-numeric:tabular-nums;margin-right:auto}
.num{display:flex;gap:10px;align-items:center}
.num input{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:56px;font:700 24px var(--mono);padding:0 14px;background:var(--card);border:2px solid var(--line);border-radius:10px}
.num b{font:700 20px var(--mono)}
.note{font-size:14px;color:var(--soft)}
.note.err,.note .err{color:var(--bad);font-weight:600}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots button{min-height:52px;padding:4px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-size:14px;line-height:1.25}
.slots button[aria-pressed=true]{border-color:var(--copper);background:var(--sel)}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pal button{min-height:62px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:8px;min-width:0}
.pal i{width:40px;height:34px;border-radius:6px;border:1.5px solid var(--soft)}
.sl{display:grid;grid-template-columns:1fr auto;gap:0 12px}
.sl b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sl input{grid-column:1/-1;width:100%;height:44px;margin:0;accent-color:var(--copper)}
.pred{display:grid;gap:10px}
.read{display:flex;gap:8px 28px;flex-wrap:wrap}
.read div{font-size:14px;color:var(--soft)}
.read b{display:block;font:700 24px var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
/* Konu anlatımı */
.kart{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.kart>p:not(.kind){font-size:17px;line-height:1.55}
.frm{display:grid;gap:4px;padding:10px 12px;border-radius:8px;background:var(--bg);border-left:4px solid var(--copper)}
.frm code{font:15px/1.5 var(--mono);overflow-wrap:anywhere}
.kart .fig{background:var(--bg)}
.real{display:grid;gap:4px;padding:12px 14px;border-radius:10px;background:linear-gradient(120deg,var(--hi1),var(--hi2))}
.real b{font:700 14px var(--disp)}

/* Alt eylem ve geri bildirim */
.foot{position:sticky;bottom:var(--kb,0px);z-index:5;display:grid;gap:10px;background:var(--bg);border-top:1px solid var(--line);margin-inline:calc(-1*var(--gl)) calc(-1*var(--gr));
  padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot.good{background:var(--goodbg)}
.foot.bad{background:var(--badbg)}
.btn{width:100%;min-height:52px;border-radius:10px;background:var(--led);color:var(--ledink);font-weight:700;font-size:17px;padding:8px 16px;transition:transform .1s ease-out}
.btn:active:not([disabled]){transform:scale(.98)}
.btn[disabled]{background:var(--line);color:var(--soft);cursor:default}
.btn.alt{background:none;border:2px solid var(--line);color:var(--ink)}
.fb{display:grid;grid-template-columns:72px 1fr;gap:0 12px}
.fb>svg{width:72px}
.fb>div{min-width:0;display:grid;gap:4px;align-content:center}
.foot.good h2{color:var(--good)}
.foot.bad h2{color:var(--bad)}
.fb p{font-size:15px;line-height:1.4}
.fb code{font:14px/1.45 var(--mono);overflow-wrap:anywhere}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.end>svg{width:150px}
.tbl{display:grid;grid-template-columns:1fr auto;gap:8px 0;margin:0;width:100%;text-align:left}
dt,dd{padding-bottom:8px;border-bottom:1px solid var(--line);margin:0}
dd{font:700 17px/1.5 var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding-left:16px}
.list{list-style:none;margin:0;padding:0}
.lvl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl button{min-height:64px;border:2px solid var(--line);border-radius:10px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700}
.lvl small{font-weight:400;font-size:13px;color:var(--soft)}
.list li{padding:12px 0;border-bottom:1px solid var(--line)}
.list small{color:var(--soft);display:block;font-size:14px}
.bdg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.bdg li{display:flex;gap:10px;min-width:0;font-size:14px;line-height:1.35;color:var(--soft)}
.bdg li>span{min-width:0}
.bdg svg{width:40px;height:40px;flex:none}
.bdg b{display:block;color:var(--ink);font-size:15px}
/* Zorluk renkleri: yeşil, sarı, kırmızı nokta; yazı rengi değişmez, kontrast korunur. */
.z1{--zc:#2fbf63}.z2{--zc:#f2b200}.z3{--zc:#ff5242}
.zt{display:inline-flex;align-items:center;gap:5px}
.zt::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--zc);box-shadow:0 0 0 1.5px rgba(0,0,0,.15)}
.lvl button{border-top:6px solid var(--zc)}
.lvl .zt::before{display:none}
.bar i{background:linear-gradient(90deg,var(--led),#ff8a3d)}
.hello{background:linear-gradient(120deg,var(--hi1),var(--hi2));border-radius:14px;padding:12px 14px}
.hop{animation:hop .5s ease-out}
.glow{animation:glow 2.6s ease-in-out infinite}
@keyframes hop{0%{transform:translateY(8px)}45%{transform:translateY(-8px)}100%{transform:none}}
@keyframes glow{50%{opacity:.18}}
@media (hover:hover) and (pointer:fine){.opt:not([disabled]):hover{border-color:var(--copper)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sel{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sel select{min-height:48px;min-width:150px;font:inherit;padding:0 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
</style>

<div id="app"></div>
<script>
// Soru kimliği konumdan gelir (ünite-ders-soru). Yeni soruyu dersin sonuna ekle, yoksa kayıtlı tekrarlar kayar.
// Devre elemanı: [tip, x1, y1, x2, y2, etiket, kimlik]. Etikette "|" sonrası ölçü değeridir.
// Tip sonundaki "-" elemanı ters çevirir.

const put = (el, x1, y1, x2, y2) => {
  const [type, name, value = '', meas = '', side] = el;
  return [type, x1, y1, x2, y2, name + (value ? '\n' + value : '') + (meas ? '|' + meas : ''), name, side];
};

// Seri çevrim: kaynak solda, son eleman sağda, kalanlar üstte.
function loop(v, els) {
  const top = els.slice(0, -1), last = els[els.length - 1], step = 240 / (top.length || 1);
  return [
    ['V', 40, 180, 40, 40, v, 'Kaynak'],
    ...(top.length ? top.map((e, i) => put(e, 40 + i * step, 40, 40 + (i + 1) * step, 40)) : [['W', 40, 40, 280, 40]]),
    put(last, 280, 40, 280, 180),
    ['W', 280, 180, 40, 180]
  ];
}

// Paralel kollar: her kol yukarıdan aşağı 1 veya 2 eleman.
function par(v, branches) {
  const gap = branches.length > 2 ? 80 : 110, xs = branches.map((_, i) => 40 + gap * (i + 1));
  const end = xs[xs.length - 1];
  return [
    ['V', 40, 180, 40, 40, v, 'Kaynak'],
    ['W', 40, 40, end, 40], ['W', 40, 180, end, 180],
    ...branches.flatMap((b, i) => b.map((e, j) => put(e, xs[i], 40 + j * 140 / b.length, xs[i], 40 + (j + 1) * 140 / b.length))),
    ...xs.slice(0, -1).flatMap(x => [['N', x, 40], ['N', x, 180]])
  ];
}

const KARMA = [
  ['V', 40, 180, 40, 40, '10 V'], ['R', 40, 40, 160, 40, 'R1\n1 kΩ'], ['R', 160, 40, 160, 180, 'R2\n2 kΩ'],
  ['W', 160, 40, 250, 40], ['R', 250, 40, 250, 180, 'R3\n2 kΩ'], ['W', 40, 180, 250, 180], ['N', 160, 40], ['N', 160, 180]
];
const THEVENIN = [
  ['V', 40, 180, 40, 40, '12 V'], ['R', 40, 40, 190, 40, 'R1\n6 kΩ'], ['R', 190, 40, 190, 180, 'R2\n3 kΩ'],
  ['W', 190, 40, 285, 40], ['W', 40, 180, 285, 180], ['N', 190, 40], ['N', 190, 180], ['N', 285, 40], ['N', 285, 180],
  ['T', 296, 45, 0, 0, 'a'], ['T', 296, 185, 0, 0, 'b']
];
const ZENER = [
  ['V', 40, 180, 40, 40, '12 V'], ['R', 40, 40, 165, 40, 'R_S\n330 Ω'], ['Z', 165, 180, 165, 40, 'V_Z\n5,1 V'],
  ['W', 165, 40, 270, 40], ['R', 270, 40, 270, 180, 'R_L\n1 kΩ'], ['W', 40, 180, 270, 180], ['N', 165, 40], ['N', 165, 180]
];
// vbb verilirse R_B ayrı bir kaynaktan beslenir (simülasyonun modeli V_BB = 5 V).
const bjtFixed = (rb, rc, load = 'R', vbb) => [
  ...(vbb ? [['P', 60, 24, 0, 0, vbb, '', 't'], ['P', 190, 24, 0, 0, '+12 V', '', 't']] : [['W', 60, 24, 190, 24], ['T', 100, 16, 0, 0, '+12 V']]), ['R', 60, 24, 60, 120, 'R_B\n' + rb], ['W', 60, 120, 150, 120],
  [load, 190, 24, 190, 92, 'R_C\n' + rc], ['Q', 150, 120], ['W', 190, 148, 190, 196], ['G', 190, 196]
];
const bjtDiv = (m = {}) => [

  { name: 'Kondansatör ve RC', lessons: [

        f: ['Q = C·V', 'W = ½·C·V²', '1 µF = 10⁻⁶ F, 1 nF = 10⁻⁹ F, 1 pF = 10⁻¹² F'],

      { h: 'Seri ve paralel', p: 'Paralel bağlamak levha alanını büyütür, sığalar toplanır. Seride sığa küçülür, en küçüğünden bile küçük olur ve paralel direnç gibi hesaplanır. Kurallar dirençlerin tam tersidir.',
        f: ['Paralel: C = C1 + C2', 'Seri: C = C1·C2 / (C1 + C2)'],

      { h: 'Dikkat: kod ve birim', p: 'Seramik kondansatördeki üç rakamlı kod pF cinsindendir: ilk iki rakam değer, üçüncüsü eklenecek sıfır sayısıdır. Hesaba başlamadan µF ve nF\'ı farada çevir, enerjide ½ çarpanını unutma.',

      { t: 'num', q: '100 µF kondansatör 12 V ile dolduruluyor. Depolanan yük kaç mC?', a: 1.2, u: 'mC',

      { t: 'num', q: '1000 µF kondansatör 10 V\'a dolu. Depolanan enerji kaç mJ?', a: 50, u: 'mJ',
        e: 'Enerji gerilimin karesiyle artar. ½ çarpanını unutma.', f: 'W = ½·C·V² = 0,5 × 10⁻³ × 100 = 50 mJ' },

      { t: 'num', q: '10 µF ve 22 µF paralel bağlı. Eşdeğer sığa kaç µF?', a: 32, u: 'µF',

    { name: 'RC dolma', k: [
      { h: 'Depo hortumla dolar', p: 'Kondansatör bir direnç üzerinden dolarken başta boştur ve akım en büyüktür. Doldukça kaynakla arasındaki fark küçülür, akım ve dolma hızı azalır. Bu yüzden eğri önce dik yükselir, sonra yataylaşır.',

        r: 'Gerçek hayatta: mikrodenetleyicinin RESET ucundaki 10 kΩ ve 100 nF, açılışta τ = 1 ms\'lik gecikme verir; besleme oturana kadar işlemci bekler.' },
      { h: 'Dikkat: dolunca ne görülür?', p: 'Sağlam kondansatör dolunca akım durur: gerilimin tamamı C\'de, R üzerinde 0 V kalır. V_C kaynağa yaklaşır ama onu geçemez. Ölçümler buna uymuyorsa hangi elemanın açık ya da kısa devre olunca bu gerilimleri vereceğini düşün.' } ], qs: [
      { t: 'num', q: 'Devrenin zaman sabiti kaç saniye?', c: loop('5 V', [['S', 'Anahtar'], ['R', 'R', '10 kΩ'], ['C', 'C', '100 µF']]), a: 1, u: 's',

      { t: 'ariza', q: 'Devre uzun süredir enerjili ve kondansatör dolmuş olmalıydı. Arızalı elemana dokun.', c: loop('9 V', [['R', 'R', '10 kΩ', '9 V'], ['C', 'C', '10 µF', '0 V']]), a: 'C',
        e: 'Sağlam kondansatör uzun süre sonra 9 V\'a dolar ve R üzerinde 0 V kalır. Sürekli akım ve 0 V, kondansatörün kısa devre olduğunu gösterir.', f: 'Beklenen: V_C = 9 V, V_R = 0 V' } ] },
    { name: 'Boşalma ve zamanlama', k: [
      { h: 'Dolu depo boşalır', p: 'Dolu kondansatör bir dirence bağlanınca küçük bir pil gibi akım verir. Gerilim düştükçe akım da düşer, bu yüzden boşalma da üsteldir ve giderek yavaşlar. Her τ\'da gerilim o andaki değerin %37\'sine iner.',

        f: ['v_C(0⁺) = v_C(0⁻)', 'v(t) = v(∞) + [v(0⁺) − v(∞)]·e^(−t/τ)'] },

        e: 'İlk kat farkı 1 + 2R/R_G kadar yükseltir; tek direnç (R_G) kazancı ayarlar.', f: 'V_o = (1 + 2R/R_G)(V_2 − V_1) = 21 × 20 mV = 0,42 V' },
      { t: 'ariza', q: 'V_i = 0,5 V iken V₋ = 0,5 V ve V_i kaynağından akım çekilmiyor. Çıkışı ölç, arızalı elemana dokun.', c: opInv(['R', 'R1', '10 kΩ'], ['R', 'R_F', '100 kΩ'], { vi: 'V_i\n0,5 V', vo: 'V_o|−11,5 V' }), a: 'R_F', fl: null, // R_F açık, V₋ = V_i: çizili devrede akım yok
        e: 'Kaynaktan akım çekilmiyorsa R1\'den akım geçmiyor ve V₋ = V_i. Geri besleme kopmuş: R_F açık devre, op-amp açık çevrimde doyar. R1 açık olsaydı devre izleyiciye döner ve V₋ = 0 olurdu.', f: 'Beklenen V_o = −(100/10) × 0,5 = −5 V' } ] },
    { name: 'Türev ve integral', z: 3, k: [
      { h: 'İntegral alıcı', p: 'Eviren yükselteçte R_F yerine C koy. − giriş sanal toprak olduğu için R\'den V_i / R akımı geçer ve tamamı C\'yi doldurur. Sabit akım kondansatör gerilimini doğrusal bir rampa gibi büyütür; çıkış ters yönde iner.',
        f: ['i = V_i / R', 'dV_o/dt = −V_i / (R·C)', 'R·C saniyedir: 47 kΩ × 10 nF = 0,47 ms'], c: opInv(['R', 'R', '47 kΩ'], ['C', 'C', '10 nF']),
        fl: [{ p: [[40, 96], [128, 96], [128, 40], [238, 40], [238, 112], [216, 112]], v: [1, 0, 0, -1, -1, -1], i: 0.0213 }], // V_i = 1 V varsayılır, V_o rampanın −1 V anı
        r: 'Gerçek hayatta: fonksiyon üreteci kare dalgayı integral alıcıdan geçirip üçgen dalga üretir; her yarım periyotta çıkış sabit eğimle bir yöne gider.' },
      { h: 'Türev alıcı', p: 'R ile C\'nin yerini değiştir: kondansatör akımı giriş geriliminin değişim hızıyla orantılıdır. Bu akım R_F\'den geçip çıkışta gerilime döner; sabit girişte çıkış sıfırdır. Hızlı gürültüyü de büyüttüğü için pratikte C\'ye seri küçük bir direnç eklenir.',
        f: ['i = C·dV_i/dt', 'V_o = −R_F·C·dV_i/dt'] },
      { h: 'Dikkat: integral alıcı kayar', p: 'DC\'de C açık devredir, ideal integral alıcının DC kazancı sonsuzdur. Op-amp\'in birkaç mV\'luk ofseti bile sürekli integre edilir ve çıkış yavaşça doyuma kayar. C\'ye paralel büyük bir R_F DC kazancını sınırlar; köşe frekansının üstünde devre yine integral alır.',
        f: ['Kayma eğimi = V_ofset / (R·C)', 'A_DC = R_F / R', 'f_köşe = 1 / (2π·R_F·C)'] } ], qs: [
      { t: 'num', q: 'Girişe sabit 2,5 V uygulanıyor. Çıkış eğiminin büyüklüğü kaç V/ms?', c: opInv(['R', 'R', '10 kΩ'], ['C', 'C', '100 nF']), a: 2.5, u: 'V/ms',
        fl: [{ p: [[40, 96], [128, 96], [128, 40], [238, 40], [238, 112], [216, 112]], v: [2.5, 0, 0, -2.5, -2.5, -2.5], i: 0.25 }], // sabit 0,25 mA C'yi doldurur; V_o başladıktan 1 ms sonra
        e: 'Sabit giriş, kondansatöre sabit akım verir; çıkış doğrusal rampa olur.', f: '|dV_o/dt| = V_i / (RC) = 2,5 / 1 ms = 2,5 V/ms' },
      { t: 'num', q: 'İntegral alıcıda R = 4,7 kΩ, C = 100 nF. Girişe ±2 V, 1 kHz kare dalga uygulanıyor. Çıkış üçgeninin tepeden tepeye değeri kaç V?', a: 2 / 4.7e-4 * 0.5e-3, u: 'V',
        e: 'Her yarım periyotta çıkış sabit eğimle bir yöne gider.', f: 'ΔV = (V/RC) × T/2 = (2 / 0,47 ms) × 0,5 ms = 2,13 V' },
      { t: 'num', q: 'Girişe eğimi 4 V/ms olan rampa uygulanıyor. Çıkış geriliminin büyüklüğü kaç V?', c: opInv(['C', 'C', '10 nF'], ['R', 'R_F', '100 kΩ']), a: 4, u: 'V',
        fl: [{ p: [[40, 96], [128, 96], [128, 40], [238, 40], [238, 112], [216, 112]], v: [2, 0, 0, -4, -4, -4], i: 0.04 }], // i = C·dV/dt = 0,04 mA; V_i rampanın 2 V anı
        e: 'Türev alıcıda kondansatör akımı giriş eğimiyle orantılıdır.', f: '|V_o| = R_F·C·dV_i/dt = 1 ms × 4 V/ms = 4 V' },
      { t: 'mc', q: 'Pratik integral alıcıda C\'ye paralel büyük bir direnç neden konur?', o: ['Ofset ve bias akımının çıkışı yavaşça doyuma sürmesini önlemek için', 'Kazancı artırmak için', 'Kondansatörü aşırı gerilimden korumak için', 'Bant genişliğini sonsuz yapmak için'], a: 0,
        e: 'DC\'de ideal integral alıcının kazancı sonsuzdur; küçük bir ofset bile zamanla birikir. Paralel direnç DC kazancı R_F/R ile sınırlar.', f: 'A_DC = R_F / R' },
      { t: 'num', q: 'C = 10 nF\'a paralel R_F = 1 MΩ konmuş. Devre hangi frekansın üstünde integral alıcı gibi davranır (köşe frekansı, Hz)?', a: 1 / (2 * Math.PI * 1e6 * 10e-9), u: 'Hz',
        e: 'Köşenin altında devre eviren yükselteç, üstünde integral alıcıdır.', f: 'f = 1 / (2π R_F C) = 15,9 Hz' },
      { t: 'num', q: 'Girişi topraklanmış integral alıcıda op-amp ofseti 2 mV, R = 100 kΩ, C = 100 nF, doyum 10 V. Çıkış yaklaşık kaç saniyede doyar?', a: 10 / (2e-3 / (100e3 * 100e-9)), u: 's',
        e: 'Ofset gerilimi girişte sabit bir gerilim gibi integre edilir. En kötü durum hesabı budur.', f: 'Eğim = 2 mV / 10 ms = 0,2 V/s → t = 10 / 0,2 = 50 s' } ] } ] },

  { name: 'Geri besleme', lessons: [
    { name: 'Kapalı çevrim kazancı', z: 1, k: [
      { h: 'Termostat gibi düzeltme', p: 'Negatif geri beslemede çıkışın bir kesri (β) ölçülür ve girişten çıkarılır; hata büyüdükçe düzeltme de büyür. Termostat da sıcaklığı ölçer, hedefi geçince ısıtmayı kısar. Sonuç yükseltecin kendi kazancına değil, ölçme oranına bağlı kalır.',
        r: 'Gerçek hayatta: araçtaki hız sabitleyici yokuşta hız düşünce gazı açar; koşullar değişse de hız neredeyse sabit kalır.' },
      { h: 'Kapalı çevrim kazancı', p: 'A yükseltecin açık çevrim kazancı, β çıkışın geri dönen kesridir. Döngüde bir tur atınca görülen Aβ\'ya çevrim kazancı denir. Aβ ≫ 1 olunca A_f ≈ 1/β olur ve A\'nın tam değeri önemini yitirir.',
        f: ['A_f = A / (1 + A·β)', 'Aβ ≫ 1 → A_f ≈ 1 / β', 'Evirmeyen op-amp: β = R1 / (R1 + R_F)'], c: opNon(['R', 'R1', '2,2 kΩ'], ['R', 'R_F', '22 kΩ']),
        fl: [{ p: [[216, 80], [238, 80], [238, 132], [124, 132], [124, 208]], v: [5.5, 5.5, 5.5, 0.5, 0], i: 0.227 }] }, // V_i = 0,5 V varsayılır
      { h: 'Kazanç verip ne alırsın?', p: 'Geri besleme kazancı (1 + Aβ) kat düşürür; karşılığında bant genişliği yaklaşık aynı oranda artar, bozulma ve kazanç değişimleri azalır. Gerilim örnekleyip seri karıştıran tipte (evirmeyen yükselteç) giriş direnci (1 + Aβ) kat artar, çıkış direnci aynı oranda düşer.',
        f: ['A_f·f_H ≈ A·f_p', 'R_if = R_i·(1 + Aβ)', 'R_of = R_o / (1 + Aβ)', 'Analiz: tip → β → Aβ → A_f'] } ], qs: [
      { t: 'num', q: 'Açık çevrim kazancı A = 1000, geri besleme oranı β = 0,1. Kapalı çevrim kazancı kaç?', a: 1000 / 101, u: 'V/V',
        e: 'Çevrim kazancı Aβ büyükken kapalı çevrim kazancı 1/β\'ya yaklaşır.', f: 'A_f = A / (1 + Aβ) = 1000 / 101 = 9,90' },
      { t: 'mc', q: 'Negatif geri besleme kazancı ve bant genişliğini nasıl etkiler?', o: ['Kazanç düşer, bant genişliği artar', 'İkisi de artar', 'İkisi de düşer', 'Kazanç artar, bant genişliği düşer'], a: 0,
        e: 'Tek kutuplu yükselteçte kazanç–bant genişliği çarpımı sabittir; kazançtan verip bant genişliği alırsın.', f: 'A_f · f_H ≈ A · f_p' },
      { t: 'num', q: 'Evirmeyen yükselteçte R1 = 1 kΩ, R_F = 9 kΩ. Geri besleme oranı β kaç?', c: opNon(['R', 'R1', '1 kΩ'], ['R', 'R_F', '9 kΩ']), a: 0.1, u: 'V/V',
        fl: [{ p: [[216, 80], [238, 80], [238, 132], [124, 132], [124, 208]], v: [10, 10, 10, 1, 0], i: 1 }], // V_i = 1 V varsayılır
        e: 'β, çıkışın − girişine geri dönen kesridir.', f: 'β = R1 / (R1 + R_F) = 1 / 10 = 0,1' },
      { t: 'mc', q: 'Aβ çarpımına ne ad verilir?', o: ['Çevrim kazancı', 'Kapalı çevrim kazancı', 'Ortak mod kazancı', 'Geri besleme direnci'], a: 0,
        e: 'Döngüyü bir noktadan kesip bir tur dolaşınca görülen kazançtır. Kararlılık bundan okunur.', f: 'T = Aβ' },
      { t: 'mc', q: 'Gerilim örnekleyip seri karıştıran (seri-şönt) geri besleme giriş ve çıkış direncini nasıl değiştirir?', o: ['Giriş direnci artar, çıkış direnci azalır', 'İkisi de azalır', 'İkisi de artar', 'Giriş azalır, çıkış artar'], a: 0,
        e: 'Evirmeyen op-amp yükselteci bu tiptir. İki direnç de (1 + Aβ) kadar değişir.', f: 'R_if = R_i (1 + Aβ), R_of = R_o / (1 + Aβ)' },
      { t: 'sira', q: 'Geri beslemeli bir yükselteci analiz etme adımlarını sırala.', o: ['Örnekleme ve karıştırma tipini belirle', 'Geri besleme ağından β\'yı hesapla', 'Çevrim kazancı Aβ\'yı bul', 'A_f = A / (1 + Aβ) ile kapalı çevrim kazancını yaz'],
        e: 'Tip, β\'nın hangi büyüklükler arasında tanımlandığını belirler. β olmadan çevrim kazancı, çevrim kazancı olmadan A_f bulunamaz.', f: 'tip → β → Aβ → A_f' } ] },
    { name: 'Bant genişliği ve hatalar', z: 2, k: [
      { h: 'Kazanç–bant genişliği çarpımı', p: 'Op-amp\'in açık çevrim kazancı frekans arttıkça düşer; kazanç ile bant genişliğinin çarpımı (GBW) sabittir. Kazancı 10 yaparsan bant genişliği GBW\'nin onda biri olur. Bu küçük sinyal sınırıdır.',
        f: ['f_H = GBW / A_f'],
        r: 'Gerçek hayatta: kazancı 100 olan bir ses yükseltecinin 20 kHz\'e kadar düz gitmesi için op-amp\'in GBW\'si en az 2 MHz olmalıdır.' },
      { h: 'Eğim hızı: büyük sinyal sınırı', p: 'Çıkış en fazla SR (V/µs) hızıyla değişebilir. Sinüsün en dik yeri sıfır geçişidir ve orada eğim 2π·f·V_p\'dir. Bu değer SR\'yi aşarsa sinüs üçgene döner; büyük genlikte izin verilen frekans düşer.',
        f: ['En büyük eğim = 2π·f·V_p', 'f_max = SR / (2π·V_p)'] },
      { h: 'DC hatalar: ofset ve bias', p: 'Ofset gerilimi + girişe seri küçük bir pil gibidir ve (1 + R_F / R1) ile yükselir. Girişler nA düzeyinde bias akımı da çeker; − girişin akımı R_F\'den geçip çıkışta hata gerilimi yaratır. + girişe R1 ∥ R_F değerinde bir direnç koymak iki girişi dengeler.',
        f: ['V_hata = V_OS·(1 + R_F / R1)', 'V_hata = I_B·R_F  (+ giriş toprakta)', 'R_p = R1 ∥ R_F'] },
      { h: 'Geri besleme duyarsızlaştırır', p: 'A sıcaklıkla ya da üretimde değişse de kapalı çevrim kazancı (1 + Aβ) kat daha az değişir. Bu yüzden kazanç op-amp\'e değil dirençlere bağlıdır.',
        f: ['ΔA_f / A_f = (ΔA / A) / (1 + Aβ)'] } ], qs: [
      { t: 'num', q: 'Op-amp\'in kazanç–bant genişliği çarpımı 1 MHz. Kazancı 20 olan evirmeyen yükseltecin bant genişliği kaç kHz?', a: 50, u: 'kHz',
        e: 'Tek kutuplu op-amp\'te GBW sabittir.', f: 'f_H = GBW / A = 1 MHz / 20 = 50 kHz' },
      { t: 'num', q: 'Eğim hızı (slew rate) 0,5 V/µs. 5 V tepeli sinüs bozulmadan en fazla kaç kHz olabilir?', a: 0.5e6 / (2 * Math.PI * 5) / 1e3, u: 'kHz',
        e: 'Sinüsün en büyük eğimi sıfır geçişindedir: 2πf·V_p.', f: 'f_max = SR / (2π V_p) = 0,5 V/µs / (2π × 5) = 15,9 kHz' },
      { t: 'num', q: 'Açık çevrim kazancı %10 değişiyor ve 1 + Aβ = 100. Küçük değişim yaklaşımıyla kapalı çevrim kazancı yüzde kaç değişir?', a: 0.1, u: '%',
        e: 'Geri besleme, A\'daki değişimi (1 + Aβ) kadar küçültür. Buna duyarsızlaştırma denir.', f: 'ΔA_f/A_f = (ΔA/A) / (1 + Aβ) = 10 / 100 = %0,1' },
      { t: 'num', q: 'Kazancı 101 olan evirmeyen yükselteçte op-amp ofseti 2 mV. Girişi topraklıyken çıkıştaki hata kaç mV?', a: 202, u: 'mV',
        e: 'Ofset, + girişine seri küçük bir kaynak gibidir ve evirmeyen kazançla yükselir.', f: 'V_o = 101 × 2 mV = 202 mV' },
      { t: 'num', q: 'Eviren yükselteçte R_F = 1 MΩ, op-amp bias akımı 100 nA, + giriş doğrudan toprakta. Çıkıştaki hata kaç mV?', a: 100, u: 'mV',
        e: '− girişin bias akımı R_F üzerinden akar.', f: 'V_o = I_B · R_F = 100 nA × 1 MΩ = 100 mV' },
      { t: 'mc', q: 'Bias akımının çıkıştaki etkisini azaltmak için + girişle toprak arasına hangi direnç konur?', o: ['R1 ∥ R_F değerinde bir direnç', 'R1 + R_F değerinde', '1 Ω', 'Sonsuz (açık devre)'], a: 0,
        e: 'İki girişin gördüğü direnç eşitlenince eşit bias akımlarının etkileri birbirini götürür; geriye ofset akımı kalır.', f: 'R_p = R1 ∥ R_F' } ] },
    { name: 'Kararlılık ve Schmitt', z: 3, k: [
      { h: 'Pozitif geri besleme: Schmitt', p: 'Çıkışın bir kesri + girişe verilirse fark büyütülür ve çıkış hemen bir uca (±V_doy) yapışır. Eşik çıkışa bağlı olduğu için yukarı ve aşağı geçiş eşikleri farklıdır; aradaki fark histerezistir. Gürültülü sinyal eşik çevresinde titreşse bile çıkış bir kez değişir.',
        f: ['V_eşik = ±V_doy·R1 / (R1 + R2)', 'Histerezis = 2·V_doy·R1 / (R1 + R2)'], c: opNon(['R', 'R1', '4,7 kΩ'], ['R', 'R2', '47 kΩ'], { flip: 0 }),
        fl: [{ p: [[216, 80], [238, 80], [238, 132], [124, 132], [124, 208]], v: [10, 10, 10, 0.909, 0], i: 0.193 }], // çıkış +V_doy = 10 V durumu
        r: 'Gerçek hayatta: termostat kombiyi 21 °C\'de kapatıp 19 °C\'de açar; histerezis olmasa röle eşik çevresinde sürekli tıklardı.' },
      { h: 'Faz payı', p: 'Negatif geri besleme döngüsünde her kutup faz gecikmesi ekler. Çevrim kazancının 1 (0 dB) olduğu frekansta gecikme 180°\'ye ulaşırsa düzeltme ters döner ve devre salınır. Faz payı bu sınıra kalan mesafedir; 45°\'nin altı aşma ve çınlama getirir.',
        f: ['PM = 180° + ∠Aβ(f_c)', 'Bir kutbun fazı: −arctan(f / f_p)', 'Kapasitif yük yeni kutup ekler: f_p = 1 / (2π·R_o·C_L)'] },
      { h: 'Osilatör: bilerek kararsız', p: 'Salınım için döngüde kazanç tam 1, faz 0° olmalıdır. Wien köprüsü yalnız tek frekansta faz kaydırmaz ve orada sinyali 1/3\'e indirir; bu yüzden yükselteç kazancı 3 olmalıdır.',
        f: ['f = 1 / (2π·R·C)', 'A·β = 3 · 1/3 = 1'] } ], qs: [
      { t: 'num', q: 'Eviren Schmitt tetikleyicide çıkış ±10 V. Histerezis genişliği kaç V?', c: opNon(['R', 'R1', '10 kΩ'], ['R', 'R2', '90 kΩ'], { flip: 0 }), a: 2, u: 'V',
        fl: [{ p: [[216, 80], [238, 80], [238, 132], [124, 132], [124, 208]], v: [10, 10, 10, 1, 0], i: 0.1 }], // çıkış +10 V durumu: V₊ = +1 V eşiği
        e: 'Pozitif geri besleme + girişini çıkışın bir kesrine bağlar. Çıkış durum değiştirince eşik de değişir.', f: 'V_eşik = ±10 × 10 / (10 + 90) = ±1 V → genişlik 2 V' },
      { t: 'num', q: 'Çevrim kazancının 1 (0 dB) olduğu frekansta faz −125°. Faz payı kaç derece?', a: 55, u: '°',
        e: 'Faz payı, döngünün −180°\'ye ne kadar uzak olduğudur. 45°\'nin altı aşma ve çınlama demektir.', f: 'PM = 180° − 125° = 55°' },
      { t: 'num', q: 'Çevrim kazancının bir kutbu çok düşük frekansta, ikincisi kesim frekansının 3 katında. Faz payı yaklaşık kaç derece?', a: 90 - Math.atan(1 / 3) * 180 / Math.PI, u: '°',
        e: 'İlk kutup kesimde −90° verir. İkinci kutbun katkısı arctan(f_c / f_p2)\'dir.', f: 'PM = 180 − 90 − arctan(1/3) = 71,6°' },
      { t: 'mc', q: 'Op-amp çıkışına büyük kapasitif yük bağlanınca osilasyon riski neden artar?', o: ['Çıkış direnciyle yeni bir kutup oluşur ve faz payı azalır', 'Kazanç düşer', 'Besleme gerilimi artar', 'Giriş ofseti sıfırlanır'], a: 0,
        e: 'R_o ve C_L, geri besleme yoluna ek bir faz gecikmesi koyar. Çözüm genelde çıkışa seri küçük bir izolasyon direncidir.', f: 'f_p = 1 / (2π R_o C_L)' },
      { t: 'num', q: 'Wien köprülü osilatörde R = 10 kΩ, C = 16 nF. Salınım frekansı kaç Hz?', a: 1 / (2 * Math.PI * 10e3 * 16e-9), u: 'Hz',
        e: 'Bu frekansta köprünün fazı sıfırdır ve kazancı 1/3\'tür; yükselteç kazancı 3 olmalıdır.', f: 'f = 1 / (2πRC) = 995 Hz' },
      { t: 'sira', q: 'Bir döngünün kararlılığını Bode diyagramıyla denetleme adımlarını sırala.', o: ['Çevrim kazancı Aβ(f)\'yi çiz', 'Kazancın 0 dB olduğu kesim frekansını bul', 'O frekanstaki fazı oku', 'Faz payı = 180° + faz; 45°\'nin üstünde mi bak'],
        e: 'Kapalı çevrim kazancına değil, çevrim kazancına bakılır.', f: 'PM = 180° + ∠Aβ(f_c)' } ] } ] },

  { name: 'Anahtarlama ve H köprüsü', lessons: [
    { name: 'MOSFET anahtar', z: 1, k: [
      { h: 'Gerilimle açılan anahtar', p: 'N kanallı MOSFET, gate ile source arasındaki gerilimle (V_GS) açılıp kapanır; gate\'e kalıcı akım gitmez. Low-side bağlantıda yük + ray ile drain arasında, source toprakta durur. R_PD, sürücü yokken gate\'i 0 V\'ta tutar ve MOSFET kapalı kalır.',
        f: ['Tam iletim: V_GS ≫ V_th (ör. 10 V)', 'Güvenli durum: V_GS = 0'], c: LOWSIDE },
      { h: 'İletimde küçük bir direnç', p: 'Açık MOSFET, R_DS(on) değerinde küçük bir dirence benzer; kaybı akımın karesiyle büyür. PWM\'de anahtar saniyede binlerce kez açılıp kapanır, yük ortalama gerilimi görür. Görev oranı D, iletim süresinin periyoda oranıdır.',
        f: ['P = I² · R_DS(on)', 'V_ort = D · V'],

        e: 'Anahtar hiç kesime girmiyor: S kısa devre. Çıkış girişe yapışır ve 5 V\'luk yük aşırı gerilim görür. D kısa devre olsaydı anahtarlama düğümü 0 V\'ta kalırdı.', f: 'Beklenen V_o = 0,42 × 12 = 5 V' } ] },
    { name: 'Flyback ve kontrol', z: 3, k: [
      { h: 'Flyback: depola, sonra bırak', p: 'Flyback\'in trafosu iki sargılı bir endüktör gibi çalışır. S iletirken primer enerji depolar, sekonder diyodu ters kutuplu olduğu için çıkışa akım gitmez; S açılınca enerji sekonderden çıkışa boşalır. Sarım oranı gerilimi ölçekler ve girişle çıkışı yalıtır.',
        f: ['V_o = V_in · D / (1 − D) · N_s / N_p', 'V_DS = V_in + (N_p / N_s) · V_o (+ kaçak sıçraması)'], c: FLYBACK,
        r: 'Gerçek hayatta: Telefonun USB-C şarj adaptörü bir flyback\'tir. 230 V şebeke doğrultulunca yaklaşık 325 V DC olur; küçük trafo bunu yalıtarak 5–20 V\'a indirir.' },
      { h: 'Çıkış dalgalanması ve CCM sınırı', p: 'Buck\'ta endüktörün üçgen dalgalanma akımı kondansatöre gider ve küçük bir gerilim dalgalanması yaratır. En hafif yükte de CCM\'de kalmak için dalgalanmanın yarısı yük akımını aşmamalıdır; bu, L için bir alt sınır verir.',
        f: ['ΔV_o = ΔI_L / (8 · f_sw · C) (ESR ihmal)', 'L_min = (V_in − V_o) · D / (2 · I_o,min · f_sw)'] },
      { h: 'Kontrol döngüsü tuzakları', p: 'Boost ve flyback\'te D artınca enerji önce endüktörde birikir, çıkış bir an düşer: bu ters tepki sağ yarı düzlem sıfırıdır (RHPZ) ve döngü kesimi onun birkaç kat altında tutulur. Tepe akım modunda D > 0,5 iken alt harmonik salınım çıkar; akım sinyaline rampa eklenir.',
        f: ['f_RHPZ = (1 − D)² · R / (2π · L) (boost)', 'Eğim kompanzasyonu: S_e ≥ ½ · S_f'] } ], qs: [
      { t: 'num', q: 'Flyback CCM\'de D = 0,4. Çıkış gerilimi kaç V? (Diyot düşümünü ihmal et.)', c: FLYBACK, a: 48 * (0.4 / 0.6) / 4, u: 'V',
        e: 'Flyback, sarım oranı eklenmiş bir buck-boost\'tur.', f: 'V_o = V_in · D / (1 − D) · N_s/N_p = 48 × 0,667 / 4 = 8 V' },
      { t: 'num', q: 'Aynı flyback\'te anahtar kesimdeyken üzerindeki gerilim kaç V olur? (Kaçak endüktans sıçramasını ihmal et.)', c: FLYBACK, a: 48 + 4 * 8, u: 'V',
        e: 'Kesimde çıkış gerilimi primere sarım oranıyla yansır ve girişe eklenir. Gerçekte kaçak endüktans bunun üstüne sıçrama ekler; MOSFET buna göre seçilir.', f: 'V_DS = V_in + n·V_o = 48 + 4 × 8 = 80 V' },
      { t: 'num', q: 'Buck çıkışında ΔI_L = 0,6 A, f_sw = 500 kHz, C = 22 µF (ESR ihmal). Çıkış gerilim dalgalanması kaç mV?', a: 0.6 / (8 * 5e5 * 22e-6) * 1e3, u: 'mV',
        e: 'Dalgalanma akımı kondansatörden geçer; üçgen akımın kondansatörde ürettiği gerilim budur.', f: 'ΔV = ΔI / (8 f C) = 0,6 / (8 × 500 kHz × 22 µF) = 6,8 mV' },
      { t: 'num', q: 'Buck: 12 V → 5 V, 500 kHz. 0,2 A yükte bile CCM\'de kalmak için en küçük L kaç µH?', a: 7 * (5 / 12) / (2 * 0.2 * 5e5) * 1e6, u: 'µH',
        e: 'CCM sınırında ortalama akım, dalgalanmanın yarısına eşittir.', f: 'L_min = (V_in − V_o)·D / (2 I_o f) = 7 × 0,417 / (2 × 0,2 × 500 kHz) = 14,6 µH' },
      { t: 'mc', q: 'CCM boost ve flyback\'te döngü kesim frekansı neden düşük tutulur?', o: ['Sağ yarı düzlem sıfırı (RHPZ) faz geciktirir ve kompanze edilemez', 'Anahtarlama frekansı yüksek olduğu için', 'Çıkış kondansatörü büyük olduğu için', 'Endüktör doyduğu için'], a: 0,
        e: 'Görev oranı artınca enerji önce endüktörde birikir, çıkış bir an düşer. Bu ters tepki RHPZ\'dir; kesim, en kötü RHPZ\'nin birkaç kat altında seçilir.', f: 'f_RHPZ = (1 − D)² R / (2π L) (boost)' },
      { t: 'mc', q: 'Tepe akım modlu kontrolde D > 0,5 iken akım dalga biçimi bir geniş bir dar darbe veriyor. Çözüm nedir?', o: ['Eğim kompanzasyonu: akım sinyaline rampa eklemek', 'Kondansatörü büyütmek', 'Anahtarlama frekansını düşürmek', 'Endüktörü küçültmek'], a: 0,
        e: 'Bu alt harmonik salınımdır. Eklenen rampa, endüktör akımı iniş eğiminin en az yarısı olmalıdır.', f: 'S_e ≥ ½ · S_f' } ] } ] },

  { name: 'Batarya yönetimi (BMS)', lessons: [
    { name: 'Hücre ve paket', z: 1, k: [
      { h: 'Seri gerilim, paralel kapasite', p: 'Seri bağlı hücrelerin gerilimleri toplanır, kapasite bir hücreninki kadar kalır. Paralel bağlı hücreler kapasiteyi toplar, gerilim aynı kalır. 10S4P, 10 seri grup ve her grupta 4 paralel hücre demektir.',
        f: ['V_paket = S · V_hücre', 'C_paket = P · C_hücre (Ah)', 'E = V_nom · C_paket (Wh)'] },
      { h: 'Hücre gerilimi ve C oranı', p: 'NMC hücre nominal 3,6 V, tam dolu 4,2 V\'tur; LFP nominal 3,2 V, tam dolu 3,65 V\'tur. Gerilim sınıfı tam dolu değere göre seçilir. C oranı akımı kapasiteye göre söyler: 1C paketi bir saatte boşaltır.',
        f: ['I = C oranı × kapasite', 'Örnek: 50 Ah, 0,5C → 25 A'],
        r: 'Gerçek hayatta: Bir e-scooter paketi 10S3P olabilir: 3,5 Ah\'lik NMC hücrelerle 36 V, 10,5 Ah ve 378 Wh. Tam dolu 42 V olduğu için şarj cihazı 42 V verir.' },
      { h: 'BMS: paketin bekçisi', p: 'Li-ion hücre aşırı şarj, aşırı deşarj, aşırı akım ve yanlış sıcaklıkta kalıcı hasar görür ya da termal kaçağa girer. BMS her hücrenin gerilimini, paket akımını ve sıcaklıkları izler. Bir sınır aşılınca MOSFET ya da kontaktörle akımı keser.' } ], qs: [
      { t: 'num', q: '10S (10 seri) Li-ion (NMC) paket tam doluyken kaç V olur?', a: 42, u: 'V',
        e: 'Paket gerilimi hücre gerilimlerinin toplamıdır. Gerilim sınıfı seçimi nominale değil tam dolu değere göre yapılır.', f: 'V = 10 × 4,2 = 42 V' },
      { t: 'num', q: 'Her biri 3 Ah olan hücrelerle 10S4P paket kuruluyor. Paket kapasitesi kaç Ah?', a: 12, u: 'Ah',
        e: 'Paralel hücreler kapasiteyi, seri hücreler gerilimi artırır.', f: 'C = 4 × 3 = 12 Ah' },
      { t: 'num', q: '36 V nominal, 12 Ah paketin enerjisi kaç Wh?', a: 432, u: 'Wh',
        e: 'Enerji, nominal gerilim ile kapasitenin çarpımıdır.', f: 'E = 36 × 12 = 432 Wh' },
      { t: 'mc', q: 'BMS\'in temel görevi nedir?', o: ['Hücre gerilimini, akımı ve sıcaklığı izleyip güvenli aralık dışında akımı kesmek', 'Motor hızını kontrol etmek', 'Paket gerilimini sabit tutmak', 'Şarj cihazının yerine geçmek'], a: 0,
        e: 'Li-ion hücreler aşırı şarj, aşırı deşarj, aşırı akım ve yanlış sıcaklıkta kalıcı hasar görür veya termal kaçağa girer.', f: 'İzle → karşılaştır → kes' },
      { t: 'num', q: '12 Ah paket 2C ile deşarj ediliyor. Akım kaç A?', a: 24, u: 'A',
        e: 'C oranı, akımın kapasiteye oranıdır. 1C, paketi bir saatte boşaltan akımdır.', f: 'I = 2 × 12 = 24 A' },
      { t: 'mc', q: 'NMC kimyalı Li-ion hücrenin tipik tam şarj gerilimi kaçtır?', o: ['4,2 V', '3,65 V', '3,2 V', '5,0 V'], a: 0,
        e: '3,65 V LFP hücrelerin tam şarj gerilimidir. Kesin değer hücrenin datasheet\'inden alınır.', f: 'NMC ≈ 4,2 V, LFP ≈ 3,65 V' } ] },
    { name: 'Ölçüm ve balans', z: 2, k: [
      { h: 'Neden balans?', p: 'Seri hücreler aynı akımı taşır ama kapasiteleri ve kaçakları biraz farklıdır; zamanla bazıları daha dolu kalır. Şarj, en dolu hücre sınıra varınca durmak zorundadır. Pasif balans, dolu hücreye bir dirençle küçük bir deşarj yolu açıp fazlalığı ısıya çevirir.',
        f: ['P = V_hücre² / R_bal', 't = ΔQ / I_bal (Ah / A = saat)'], c: loop('V_hücre', [['SO', 'S'], ['R', 'R_bal']]) },
      { h: 'SOC: depoda ne kaldı?', p: 'SOC, kalan yükün kapasiteye oranıdır. Coulomb sayma akımı zamanla toplar, ama küçük bir ölçüm ofseti bile günlerce birikir; dinlenmiş açık devre gerilimiyle (OCV) düzeltilir. LFP\'de OCV eğrisi orta bölgede çok düz olduğu için gerilimden SOC okumak zordur.',
        f: ['SOC = SOC₀ − ∫I dt / C', 'Sabit akımda: ΔSOC = I · t / C'] },
      { h: 'Akımı şöntle ölçmek', p: 'Şönt, akım yoluna seri konan çok küçük bir dirençtir; üzerindeki gerilim akımla orantılıdır. Direnci küçük olsa da yüksek akımda kayda değer ısınır.',
        f: ['V_şönt = I · R', 'P = I² · R'],
        r: 'Gerçek hayatta: Elektrikli arabanın BMS\'i 100 µΩ\'luk bir şöntle 300 A\'i ölçer: şöntte 30 mV düşer, 9 W ısı çıkar. Göstergedeki yüzde, bu akımdan hesaplanan SOC\'tur.' } ], qs: [
      { t: 'num', q: 'Pasif balansta 4,2 V\'luk hücreye 42 Ω direnç bağlanıyor. Dirençte harcanan güç kaç W?', c: loop('4,2 V', [['SO', 'S'], ['R', 'R_bal', '42 Ω']]), a: 4.2 * 4.2 / 42, u: 'W',
        e: 'Pasif balans fazla enerjiyi ısıya çevirir. BMS kartında bu ısı dağıtılmalıdır.', f: 'P = V² / R = 17,64 / 42 = 0,42 W' },
      { t: 'num', q: 'Hücreler arasında 0,5 Ah fark var ve balans akımı 100 mA. Dengeleme kaç saat sürer?', a: 5, u: 'h',
        e: 'Pasif balans yavaştır. Büyük paketlerde aktif balans tercih edilir.', f: 't = 0,5 Ah / 0,1 A = 5 h' },
      { t: 'num', q: 'Paket akımı 0,5 mΩ şöntle ölçülüyor. 100 A\'de şöntte harcanan güç kaç W?', a: 5, u: 'W',
        e: 'Küçük direnç bile yüksek akımda ciddi ısı üretir. Ölçüm gerilimi 50 mV\'tur.', f: 'P = I² · R = 10 000 × 0,0005 = 5 W' },
      { t: 'mc', q: 'Yalnız akım sayarak (Coulomb sayma) SOC hesaplamanın zayıf yanı nedir?', o: ['Akım ofseti ve başlangıç hatası zamanla birikir', 'Çok fazla işlem gücü ister', 'Akım ölçülemez', 'Yalnız LFP\'de çalışır'], a: 0,
        e: 'Açık çevrimli bir integraldir; küçük ofset bile günlerce birikir. Dinlenmiş OCV ile periyodik düzeltilir.', f: 'SOC = SOC₀ − ∫I dt / C' },
      { t: 'mc', q: 'LFP pakette gerilimden SOC tahmini neden zordur?', o: ['OCV eğrisi orta SOC aralığında çok düzdür', 'LFP hücrelerin gerilimi ölçülemez', 'LFP\'nin iç direnci sıfırdır', 'LFP gerilimi sıcaklıktan etkilenmez'], a: 0,
        e: '%20–80 aralığında gerilim yalnız birkaç on mV değişir; ölçüm hatası ve histerezis bunu yutar.', f: 'dV/dSOC ≈ 0 (orta bölge)' },
      { t: 'num', q: '50 Ah paket %80 SOC\'tan başlayıp 1,5 saat boyunca 10 A veriyor. Yeni SOC yüzde kaç?', a: 50, u: '%',
        e: 'Çekilen yükü kapasiteye oranla ve düş.', f: 'ΔQ = 10 × 1,5 = 15 Ah = %30 → SOC = %50' } ] },
    { name: 'Koruma ve ön şarj', z: 3, k: [
      { h: 'Ön şarj: yumuşak kalkış', p: 'İnverterin bus kondansatörü boşken kısa devre gibidir; ana kontaktör doğrudan kapansa dev bir akım darbesi kontakları kaynatabilir. Önce K2 kapanır ve C_bus, R_pre üzerinden yavaşça dolar. Gerilim farkı küçülünce K1 kapanır.',
        f: ['I_tepe = V / R_pre', 'τ = R_pre · C_bus', '%95: t = τ · ln 20 ≈ 3τ; 5τ\'da %99'], c: PRECHARGE,
        r: 'Gerçek hayatta: Elektrikli arabayı çalıştırınca duyulan "tık… tık" sesi kontaktörlerdir: önce ön şarj kontaktörü, kısa süre sonra ana kontaktör kapanır.' },
      { h: 'Dirençteki ısı', p: 'Boş kondansatör dirençle doldurulurken, kondansatörde depolanan enerji kadar enerji de dirençte ısıya döner. Bu enerji direnç değerinden bağımsızdır; R_pre bu darbeye dayanacak şekilde seçilir. Kondansatör kısa devreyse ön şarj hiç bitmez, bu yüzden zaman aşımı konur.',
        f: ['E_R = ½ · C · V²'] },
      { h: 'Geri besleme bus\'ı şişirir', p: 'Frenleyen motor jeneratör olur ve enerjiyi bus\'a iter. Batarya bu enerjiyi alamıyorsa (bağlantı koptu ya da paket dolu), gidecek tek yer kondansatördür ve gerilim hızla yükselir. Çözüm rejen sınırı, fren kıyıcı ve hızlı aşırı gerilim korumasıdır.',
        f: ['P = C · V · dV/dt → dV/dt = P / (C · V)'] } ], qs: [
      { t: 'num', q: 'K2 kapandığı anda R_pre\'den geçen tepe akım kaç A?', c: PRECHARGE, a: 110 / 47, u: 'A',
        e: 'İlk anda boş kondansatör kısa devre gibidir; gerilimin tamamı dirençtedir.', f: 'I_pk = 110 / 47 = 2,34 A' },
      { t: 'num', q: 'Ön şarj direnci 100 Ω, C_bus = 1 mF. Bus geriliminin %95\'e ulaşması kaç saniye sürer?', a: 0.1 * Math.log(20), u: 's',
        e: 'Ana kontaktör ancak gerilim farkı küçükken kapatılır; yoksa kontaklar kaynayabilir.', f: 't = τ · ln 20 = 0,1 s × 3,0 = 0,30 s' },
      { t: 'num', q: '110 V\'luk paket 1 mF\'lık bus\'ı ön şarj ediyor. Ön şarj direncinde harcanan toplam enerji kaç J?', a: 0.5 * 1e-3 * 110 * 110, u: 'J',
        e: 'Bu enerji direnç değerinden bağımsızdır. Direnç, bu darbe enerjisine göre seçilir.', f: 'E = ½ C V² = 0,5 × 1 mF × 110² = 6,05 J' },
      { t: 'num', q: 'Batarya bağlantısı koptu, motor 2 kW geri besleme veriyor. 1 mF\'lık bus 110 V\'tayken gerilim kaç V/ms yükselir?', a: 2000 / (1e-3 * 110) / 1e3, u: 'V/ms',
        e: 'Gücün gidecek tek yeri bus kondansatörüdür. Birkaç ms\'de onlarca volt yükselir; aşırı gerilim koruması hızlı olmalıdır.', f: 'dV/dt = P / (C·V) = 2000 / (1 mF × 110 V) = 18,2 V/ms' },
      { t: 'mc', q: 'Paket tam doluyken motor rejeneratif fren yapıyor ve BMS şarj akımını kesiyor. Ne olur, ne yapılmalı?', o: ['DC bus pompalanır; fren kıyıcı veya rejen sınırı gerekir', 'Hiçbir şey olmaz, kondansatör emer', 'Motor hızlanır', 'Paket boşalır'], a: 0,
        e: 'Akımın gidecek yeri kalmaz; MOSFET\'lerin gövde diyotları motoru doğrultucu yapar. Sürücü ile BMS haberleşmeli, rejen tam doluyken kısılmalıdır.', f: 'dV/dt = P / (C·V)' },
      { t: 'ariza', q: 'K2 kapalı, aradan 5 s geçti. R_pre uçlarında hâlâ 110 V, C_bus 0 V. İnverter bağlı değil. Arızalı elemana dokun.', c: PRECHARGE, a: 'C_bus',
        e: 'Sağlam devrede birkaç τ sonra C_bus 110 V\'a ulaşır ve R_pre\'de 0 V kalır. Sürekli 110 V, C_bus\'ın kısa devre olduğunu gösterir. R_pre sürekli V²/R = 257 W ile ısınır; ön şarj zaman aşımıyla kesilmelidir.', f: 'τ = 47 Ω × 1 mF = 47 ms → 5 s ≫ 5τ' } ] } ] },

  { name: 'Elektrik motorları', lessons: [
    { name: 'DC motor', z: 1, k: [
      { h: 'Motor aynı zamanda jeneratördür', p: 'Dönen DC motor, hızıyla orantılı bir zıt EMK (E) üretir; bu, uygulanan gerilime karşı koyar. Akımı, uygulanan gerilimle zıt EMK arasındaki fark ve armatür direnci R_a belirler. Kalıcı durumda L_a akımı etkilemez.',
        f: ['E = K_e · ω', 'I = (V − E) / R_a'], c: loop('V', [['R', 'R_a'], ['I', 'L_a'], ['M', 'E', 'K_e · ω']]) },
      { h: 'Tork akımdan gelir', p: 'Tork akımla orantılıdır; akım ters dönerse tork da ters döner, bu yüzden polariteyi çevirmek yönü çevirir. Kalkışta ω = 0, yani E = 0\'dır; akımı yalnız R_a sınırlar ve en büyük akım bu andadır. SI birimlerinde K_t ile K_e sayısal olarak eşittir.',
        f: ['T = K_t · I', 'I_kalkış = V / R_a'],
        r: 'Gerçek hayatta: Akülü matkap vidayı sıkıp durduğunda motor neredeyse kalkış akımı çeker ve en büyük torku verir. Uzun süre böyle zorlanırsa sargılar ısınır.' },
      { h: 'Dikkat: rpm değil rad/s', p: 'Formüllerdeki ω, rad/s cinsindendir; motor etiketleri ise rpm yazar. Bir tur 2π radyan, bir dakika 60 saniyedir.',
        f: ['ω = n · 2π / 60', '1000 rpm ≈ 105 rad/s'] } ], qs: [
      { t: 'num', q: 'Motorun zıt EMK sabiti K_e = 0,05 V/(rad/s). 300 rad/s\'de zıt EMK kaç V?', a: 15, u: 'V',
        e: 'Dönen motor jeneratör gibi gerilim üretir; hızla doğru orantılıdır.', f: 'E = K_e · ω = 0,05 × 300 = 15 V' },
      { t: 'num', q: 'Kalıcı durumda armatür akımı kaç A? (Endüktans kalıcı durumda etkisiz.)', c: loop('24 V', [['R', 'R_a', '0,5 Ω'], ['I', 'L_a', '2 mH'], ['M', 'E', '20 V']]), a: 8, u: 'A',
        e: 'Akımı, kaynak ile zıt EMK arasındaki fark ve armatür direnci belirler.', f: 'I = (24 − 20) / 0,5 = 8 A' },
      { t: 'num', q: 'K_t = 0,05 Nm/A olan motor 8 A çekiyor. Ürettiği tork kaç Nm?', a: 0.4, u: 'Nm',
        e: 'SI birimlerinde K_t ve K_e sayısal olarak eşittir.', f: 'T = K_t · I = 0,05 × 8 = 0,4 Nm' },
      { t: 'mc', q: 'DC motor kalkışta neden en yüksek akımı çeker?', o: ['Hız sıfırken zıt EMK sıfırdır, akımı yalnız R_a sınırlar', 'Sargı soğuk olduğu için', 'Mıknatıs zayıf olduğu için', 'Fırçalar kısa devre olduğu için'], a: 0,
        e: 'Sürücünün akım sınırı ve sigorta seçimi kalkış ve kilitli rotor akımına göre yapılır.', f: 'I_kalkış = V / R_a' },
      { t: 'mc', q: 'Fırçalı DC motorun dönüş yönü nasıl değiştirilir?', o: ['Uç geriliminin polaritesi ters çevrilir', 'Gerilim artırılır', 'Frekans değiştirilir', 'Fırçalar çıkarılır'], a: 0,
        e: 'Akım yönü değişince tork yönü de değişir. H köprüsü bunu elektronik olarak yapar.', f: 'T = K_t · I, I < 0 → T < 0' },
      { t: 'num', q: '3000 rpm kaç rad/s eder?', a: 3000 * 2 * Math.PI / 60, u: 'rad/s',
        e: 'Bir tur 2π radyan, bir dakika 60 saniyedir.', f: 'ω = 3000 × 2π / 60 = 314 rad/s' } ] },
    { name: 'BLDC ve asenkron', z: 2, k: [
      { h: 'BLDC: fırçasız komütasyon', p: 'BLDC\'de mıknatıslar rotorda, sargılar statordadır; fırça yerine sürücü sargıları sırayla anahtarlar. Üç Hall sensörü altı farklı durum verir, yani rotorun hangi 60°\'lik dilimde olduğunu söyler. Bir mekanik turda kutup çifti sayısı kadar elektriksel periyot vardır.',
        f: ['f_e = p · n / 60 (p: kutup çifti, n: rpm)', 'Yüksüz hız: n ≈ Kv · V'],

const fresh = () => ({ xp: 0, done: {}, wrong: [], ok: {}, perfect: 0, fixed: 0, last: -1, streak: 0, bestStreak: 0, freeze: true, refill: 0, day: -1, dayXp: 0, goalDays: 0, rem: 0 });

function parseState(raw, validIds) {
  const s = fresh();
  let p;
  try { p = JSON.parse(raw); } catch { return s; }
  if (!p || typeof p !== 'object') return s;
  for (const k in s) if (typeof p[k] === typeof s[k] && Array.isArray(p[k]) === Array.isArray(s[k]) && p[k] !== null && (typeof p[k] !== 'number' || Number.isFinite(p[k]))) s[k] = p[k];
  s.wrong = s.wrong.filter(id => validIds.includes(id));
  // Yedek dosyası dışarıdan gelir ve done değerleri ekrana yazılır: yalnız bilinen dersler ve sayaç değerleri kalır.
  const lessons = new Set(validIds.map(id => id.replace(/-[^-]+$/, ''))), count = v => Number.isInteger(v) && v >= 0;
  s.done = Object.fromEntries(Object.entries(s.done).filter(([k, v]) => lessons.has(k) && count(v)));
  s.ok = Object.fromEntries(Object.entries(s.ok).filter(([, v]) => count(v)));
  return s;
}

function touchStreak(s, today) {
  const gap = s.last < 0 ? Infinity : today - s.last;
  if (gap <= 0) return; // aynı gün ya da saat geri alınmış
  if (gap === 1 || (gap === 2 && s.freeze)) {
    s.streak++;
    if (gap === 2) { s.freeze = false; s.refill = 7; }
    else if (!s.freeze && --s.refill <= 0) s.freeze = true;
  } else { s.streak = 1; s.freeze = true; }
  s.last = today;
  s.bestStreak = Math.max(s.bestStreak, s.streak);
}

const liveStreak = (s, today) => s.last >= 0 && (today - s.last <= 1 || (today - s.last === 2 && s.freeze)) ? s.streak : 0;
const todayXp = (s, today) => s.day === today ? s.dayXp : 0;

function addXp(s, n, today) {
  touchStreak(s, today);
  if (s.day !== today) { s.day = today; s.dayXp = 0; }
  if (s.dayXp < GOAL && s.dayXp + n >= GOAL) s.goalDays++;
  s.dayXp += n; s.xp += n;
}

function record(s, id, type, right, today, z = 1) {
  const i = s.wrong.indexOf(id);
  if (!right) { if (i < 0) s.wrong.push(id); return; }
  s.ok[type] = (s.ok[type] || 0) + 1;
  s.ok['z' + z] = (s.ok['z' + z] || 0) + 1;
  if (i >= 0) { s.wrong.splice(i, 1); s.fixed++; }
  addXp(s, XP_Z[z], today);
}

function finishLesson(s, lid, right, total, today) {
  s.done[lid] = Math.max(s.done[lid] || 0, right);
  if (right === total) s.perfect++;
  addXp(s, XP_FINISH + (right === total ? XP_PERFECT : 0), today);
}

// "1.500" Türkçede 1500, klavyede 1,5 olabilir: iki yorum da aday.
function parseNum(str) {
  const t = String(str).replace(/\s/g, '').replace('−', '-');
  if (!/^-?[\d.,]+$/.test(t) || !/\d/.test(t)) return [];
  const c = new Set();
  if (t.includes(',')) c.add(Number(t.replace(/\./g, '').replace(',', '.')));
  else { c.add(Number(t)); if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) c.add(Number(t.replace(/\./g, ''))); }
  return [...c].filter(Number.isFinite);
}

    case 'sim': { const m = SIMS[q.sim], x = m.calc(ans)[m.key]; return x >= m.min - 1e-9 && x <= m.max + 1e-9; }
    default: { const c = parseNum(ans); return c.length ? c.some(x => within(x, q.a)) : null; }
  }
}

}

// Akış katmanı: gerilime göre renkli bant (kırmızı yüksek, mavi düşük) ve akım yönünde kayan oklar. Hareket azaltılmışsa oklar durur.

  const id = 'ak' + ++flowN, vs = fl.flatMap(f => f.v), hi = Math.max(...vs), lo = Math.min(...vs), im = Math.max(...fl.map(f => f.i)), K = p => p.join();

const optList = (q, badge) => `<div class="opts">${C.perm.map(i => `<button class="opt" aria-pressed="false" data-i="${i}">${badge ? '<kbd></kbd>' : ''}<span>${tx(q.o[i])}</span></button>`).join('')}</div>`;

// Simülasyon kaydırıcıları ve canlı çizim; soru ekranı ile konu anlatımı paylaşır. p: kimlik öneki.
const simSliders = (key, p = '', off = '') => SIMS[key].s.map(([k, n, a, b, st, v]) => `<label class="sl"><span>${tx(n)}</span><b id="${p}o-${k}"></b><input type="range" id="${p}s-${k}" min="${a}" max="${b}" step="${st}" value="${v}"${off}></label>`).join('');
function simDraw(key, p = '') {
  const m = SIMS[key], v = {};
  m.s.forEach(([k, , , , , , u]) => { const i = $(`#${p}s-${k}`), s = `${fmt(v[k] = +i.value)} ${u}`; $(`#${p}o-${k}`).textContent = s; i.setAttribute('aria-valuetext', s); });
  const r = m.calc(v);
  $(`#${p}rd`).innerHTML = m.out.map(([k, n, u]) => `<div>${tx(n)}<b>${fmt(+r[k].toFixed(3))} ${u}</b></div>`).join('');
  $(`#${p}sv`).innerHTML = SIMVIEW[key](v, r, Math.min(1, m.glow(r)));
  $(`#${p}warn`).textContent = m.warn ? m.warn(r) : '';
  return v;
}

// Önce tahmin: p[0] kaydırıcısı artınca p[1] çıktısı ne olur? Diğer kaydırıcılar başlangıç değerinde; yön calc'tan çıkar.
const PRED = ['Artar', 'Azalır', 'Değişmez'];
const simDir = m => { const v = Object.fromEntries(m.s.map(s => [s[0], s[5]])), k = m.s.find(s => s[0] === m.p[0]), y = x => m.calc({ ...v, [k[0]]: x })[m.p[1]], d = y(k[3]) - y(k[2]); return d > 1e-9 ? 0 : d < -1e-9 ? 1 : 2; };
const simPred = m => { const y = m.out.find(o => o[0] === m.p[1])[1]; return [m.s.find(s => s[0] === m.p[0])[1], /^\p{Lu}\p{Ll}/u.test(y) ? y[0].toLocaleLowerCase('tr') + y.slice(1) : y]; };

// Arıza sorusu: etiketteki "|" sonrası rakamlı ölçü, kullanıcı ölçene kadar gizli kalır.
const reading = e => { const m = (e && e[5] || '').split('|')[1]; return m && /\d/.test(m) ? m : ''; };
const nodes = q => q.c.filter(e => (e[0] === 'T' || e[0] === 'P') && reading(e));
const nodeName = e => { const [a, m] = e[5].split('|'); return a ? a.split('\n')[0] : m.split(' = ')[0]; }, nodeVal = e => reading(e).split(' = ').pop();
const VIEW = {
  mc: q => { C.perm = shuffle(q.o.length); return fig(q) + optList(q); },
  num: q => (q.b ? `<div class="fig">${resistor(q.b)}</div><p class="note">Bantlar: ${q.b.join(', ')}</p>` : fig(q)) + `<form class="num"><input id="n" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-label="Cevap, birim ${q.u}" aria-describedby="nerr"><b>${q.u}</b></form><p class="note" id="nerr" aria-live="polite">±%2 tolerans. Virgül veya nokta kullanabilirsin.</p>`,
  kur: () => `<div class="fig" id="res"></div><div class="slots">${[0, 1, 2].map(i => `<button data-s="${i}"></button>`).join('')}</div><div class="pal">${COLORS.map(c => `<button data-c="${c}"><i style="background:${HEX[c]}"></i>${c}</button>`).join('')}</div>`,
  ariza: q => { const m = q.c.some(e => e[6] && reading(e)), nd = nodes(q); return (m ? '<div class="seg" role="group" aria-label="Dokunma modu"><button aria-pressed="true">Ölç</button><button aria-pressed="false">Seç</button></div>' : '') + `<div class="fig">${circuit(q.c, { pick: true })}</div>`
    + (nd.length ? `<div class="prb" role="group" aria-label="Ölçüm noktaları"><span>Ölç:</span>${nd.map((e, i) => `<button data-n="${i}">${tx(nodeName(e))}</button>`).join('')}</div>` : '')
    + (m || nd.length ? `<p class="dmm" aria-live="polite"><small>${m ? 'Ölçmek için bir elemana dokun. Arızalıyı bulunca Seç’e geç.' : 'Bir ölçüm noktasına dokun, sonra arızalı elemanı seç.'}</small></p>` : ''); },
  sira: q => { do C.perm = shuffle(q.o.length); while (C.perm.every((v, i) => v === i)); return '<p class="note">İlk sıradan başlayarak dokun. Geri almak için tekrar dokun.</p>' + optList(q, true); },
  sim: q => { const [x, y] = simPred(SIMS[q.sim]); return `<div class="fig" id="sv"></div><div class="read" id="rd"></div><div class="pred"><p><b>Önce tahmin et.</b> ${tx(x)} artarsa ${tx(y)} ne olur?</p><div class="opts">${PRED.map((o, i) => `<button class="opt" aria-pressed="false" data-p="${i}"><span>${o}</span></button>`).join('')}</div><p class="note" id="pn" aria-live="polite"></p></div><div>${simSliders(q.sim, '', ' disabled')}</div><p class="note" id="warn" aria-live="polite"></p>`; }
};
const BIND = {
  mc: () => $$('.opt').forEach(b => b.onclick = () => { $$('.opt').forEach(x => x.setAttribute('aria-pressed', x === b)); answer(+b.dataset.i); }),
  num: () => { const n = $('#n'); n.oninput = () => answer(n.value, n.value.trim() !== ''); $('form').onsubmit = e => { e.preventDefault(); if (!$('#ok').disabled) check(); }; },
  kur: () => {
    const v = [null, null, null], names = ['1. rakam', '2. rakam', 'Çarpan']; let cur = 0;
    const draw = () => { $$('[data-s]').forEach((b, i) => { b.setAttribute('aria-pressed', i === cur); b.textContent = v[i] ? `${names[i]}: ${v[i]}` : names[i]; }); $('#res').innerHTML = resistor([...v, 'altın']); };
    $$('[data-s]').forEach((b, i) => b.onclick = () => { cur = i; draw(); });
    $$('[data-c]').forEach(b => b.onclick = () => { v[cur] = b.dataset.c; const e = v.indexOf(null); if (e >= 0) cur = e; draw(); answer([...v], e < 0); });
    draw();
  },
  ariza: q => {
    const hid = {}, seg = $$('.seg button'), val = p => reading(q.c.find(e => e[6] === p.dataset.id)); let olc = seg.length > 0, n = 0;
    const sel = p => { if (C.checked) return; $$('.part').forEach(x => x.setAttribute('aria-checked', x === p)); answer(p.dataset.id); };
    const show = p => { const h = hid[p.dataset.id]; if (!h) return; $('.me', p).innerHTML = h[0]; p.setAttribute('aria-label', h[1]); hid[p.dataset.id] = null; };
    const dmm = (who, v) => $('.dmm').innerHTML = `<small>${tx(who)}</small><b>${v ? esc(v) : '– – –'}</b><small>${v ? `${n} ölçüm` : 'Burada ölçüm yok'}</small>`;
    const meas = p => { const v = val(p); if (hid[p.dataset.id]) n++; show(p); dmm(p.dataset.id, v); };
    // Düğüm ölçüleri: devredeki değer "?" olur, ölçüm noktası düğmesiyle açılır.
    const nd = nodes(q), gs = $$('.ckt .node'), nhid = gs.map((g, i) => { const t = $('.me', g), h = t.innerHTML, v = esc(nodeVal(nd[i])), k = h.lastIndexOf(v); t.innerHTML = h.slice(0, k) + '?' + h.slice(k + v.length); return h; });
    const nshow = i => { if (!nhid[i]) return false; $('.me', gs[i]).innerHTML = nhid[i]; nhid[i] = null; return true; };
    $$('.prb button').forEach(b => b.onclick = () => { const i = +b.dataset.n; if (nshow(i)) n++; dmm(nodeName(nd[i]), nodeVal(nd[i])); });
    if (olc) $$('.part').forEach(p => { const v = val(p), t = $('.me', p), l = p.getAttribute('aria-label'); if (v && t) { hid[p.dataset.id] = [t.innerHTML, l]; t.textContent = '?'; p.setAttribute('aria-label', l.replace(', ölçülen ' + v, '')); } });
    seg.forEach((b, i) => b.onclick = () => { olc = !i; seg.forEach(x => x.setAttribute('aria-pressed', x === b)); });
    $$('.part').forEach(p => { p.onclick = () => (olc ? meas : sel)(p); p.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); (olc ? meas : sel)(p); } }; });
    $('#ok').addEventListener('click', () => { $$('.part').forEach(show); gs.forEach((g, i) => nshow(i)); }); // cevaptan sonra tüm ölçüler görünür
  },
  sira: q => {
    const seq = [];
    $$('.opt').forEach(b => b.onclick = () => {
      const i = +b.dataset.i, k = seq.indexOf(i);
      if (k < 0) seq.push(i); else seq.splice(k, 1);
      $$('.opt').forEach(x => { const p = seq.indexOf(+x.dataset.i); x.setAttribute('aria-pressed', p >= 0); $('kbd', x).textContent = p < 0 ? '' : p + 1; });
      answer([...seq], seq.length === q.o.length);
    });
  },
  sim: q => {
    let go = false; C.miss = '';
    const m = SIMS[q.sim], upd = () => answer(simDraw(q.sim), go);
    $$('[data-p]').forEach(b => b.onclick = () => {
      const d = simDir(m), ok = +b.dataset.p === d, [x, y] = simPred(m);
      $$('[data-p]').forEach(o => { o.disabled = true; o.setAttribute('aria-pressed', o === b); });
      b.classList.add(ok ? 'good' : 'bad');
      $('#pn').textContent = ok ? 'Doğru tahmin.' : 'Tahminin tutmadı, simülasyonda kendin gör.';
      if (!ok) C.miss = `${x} artınca ${y} ${PRED[d].toLocaleLowerCase('tr')}.`;
      go = true; $$('.sl input').forEach(i => i.disabled = false); upd();
      $('.sl input').focus(); // basılan düğme kilitlendi; odak açılan ilk kaydırıcıya geçer
    });
    m.s.forEach(s => $('#s-' + s[0]).oninput = upd); upd();
  }
};
VIEW.oku = VIEW.num; BIND.oku = BIND.num;
const SIMVIEW = {
  ohm: (v, r, glow) => circuit(loop(`${fmt(v.V)} V`, [['L', 'Lamba', `${fmt(v.R)} Ω`]]), { glow, flow: true }),
  led: (v, r, glow) => circuit(loop(`${fmt(v.V)} V`, [['R', 'R', `${fmt(v.R)} Ω`], ['LED', 'LED', '2 V']]), { glow, flow: true }),
  bolucu: v => circuit([...loop('12 V', [['R', 'R1', `${fmt(v.R1)} kΩ`], ['R', 'R2', `${fmt(v.R2)} kΩ`]]), ['N', 280, 40], ['N', 280, 180]], { flow: true }),
  rc: (v, r) => rcCurve(r.T),
  bjt: (v, r, glow) => circuit(bjtFixed(`${fmt(v.RB)} kΩ`, `${fmt(v.RC)} kΩ`, 'L', '+5 V'), { glow }),
  opamp: v => circuit(opNon(['R', 'R1', `${fmt(v.R1)} kΩ`], ['R', 'R_F', `${fmt(v.RF)} kΩ`], { vi: 'V_i\n0,5 V' })),
  buck: v => circuit(buck({ vin: `${fmt(v.V)} V`, t: `|D = %${fmt(v.D)}` })),
  hb: v => circuit(hbridge({ m: `D = %${fmt(v.D)}` }))
};

// Konu anlatımı: sorulardan önce kısa kartlar. Alttaki düğme tek dokunuşla sorulara geçirir.
function intro(l) {
  C = null;
  const n = l.k.length, sim = (c, p) => `<div class="fig" id="${p}sv"></div><div class="read" id="${p}rd"></div><div>${simSliders(c.sim, p)}</div><p class="note" id="${p}warn" aria-live="polite"></p>`;
  app.innerHTML = `<main class="scr"><div class="top"><button class="x" data-go="ana" aria-label="Çık">${ICON.x}</button><p class="kind">Konu anlatımı · ${n} kart</p></div><h1 tabindex="-1">${tx(l.name)}</h1>
  ${l.k.map((c, i) => `<section class="kart"><p class="kind">${i + 1}/${n}</p><h2>${tx(c.h)}</h2><p>${tx(c.p)}</p>${c.f ? `<div class="frm">${c.f.map(x => `<code>${tx(x)}</code>`).join('')}</div>` : ''}${c.c ? `<div class="fig">${circuit(c.c, { flow: c.fl || true })}</div>` : ''}${c.sim ? sim(c, `k${i}-`) : ''}${c.r ? `<div class="real"><b>Gerçek hayatta</b><p>${tx(c.r.replace(/^Gerçek hayatta:?\s*/i, ''))}</p></div>` : ''}</section>`).join('')}</main>
  <div class="foot"><button class="btn" data-go="ders-${l.id}">Sorulara başla</button></div>`;
  l.k.forEach((c, i) => { if (!c.sim) return; const p = `k${i}-`, draw = () => simDraw(c.sim, p); SIMS[c.sim].s.forEach(s => $(`#${p}s-${s[0]}`).oninput = draw); draw(); });
  focusTop();
}

function question() {
  const q = C.q = QUESTIONS[C.queue[0]]; C.ans = null; C.checked = false; C.fl = q.c ? 'fl' in q ? q.fl : q.t !== 'ariza' && flowOf(q.c) : null; // fl: null akışı kapatır
  app.innerHTML = `<main class="scr"><div class="top"><button class="x" data-go="${C.lid ? 'ana' : 'tekrar'}" aria-label="Çık">${ICON.x}</button>${bar(C.n, C.total, 'İlerleme')}<output>${C.lid ? `${C.n + 1}/${C.total}` : `${C.queue.length} kaldı`}</output></div>
  <div><p class="kind">${zTag(q.z)} · ${KIND[q.t]}</p><h1 class="q" tabindex="-1">${tx(q.q)}</h1></div>${VIEW[q.t](q)}</main><div class="foot" aria-live="polite"><button class="btn" id="ok" disabled>Kontrol et</button></div>`;
  BIND[q.t](q);
  $('#ok').onclick = check;
  if ($('#akb')) $('#akb').onclick = flowToggle;
  focusTop();
}

function check() {
  if (C.checked) return;
  const q = C.q, id = C.queue[0], ok = grade(q, C.ans, SIMS);
  if (ok === null) { const e = $('#nerr'); e.textContent = 'Bunu sayı olarak okuyamadım. Yalnızca rakam yaz, örneğin 2,5.'; e.className = 'note err'; $('#n').focus(); return; }
  C.checked = true; C.queue.shift();
  record(S, id, q.t, ok, dayNum(), q.z);
  if (ok) C.right++;
  if (ok || C.lid) C.n++; else C.queue.push(id); // Tekrar'da yanlış soru kuyruğun sonuna döner
  if (C.lid && !C.queue.length) finishLesson(S, C.lid, C.right, C.total, dayNum());
  save();
  const mark = (el, v) => { if (v === String(q.a)) el.classList.add('good'); else if (v === String(C.ans)) el.classList.add('bad'); };
  if (q.t === 'mc') $$('.opt').forEach(b => mark(b, b.dataset.i));
  if (q.t === 'ariza') $$('.part').forEach(p => mark(p, p.dataset.id));
  if (q.t === 'sira' && !ok) $$('.opt').sort((a, b) => a.dataset.i - b.dataset.i).forEach((b, i) => { $('kbd', b).textContent = i + 1; b.parentNode.append(b); });
  $$('main button:not(.x):not(#akb),main input').forEach(b => b.disabled = true);
  if (C.fl) { if (!$('#akb')) { $('.fig').insertAdjacentHTML('afterend', FLOWBTN); $('#akb').onclick = flowToggle; } showFlow(true); } // açıklama görsel olsun
  const right = { mc: () => q.o[q.a], ariza: () => q.a, kur: () => q.a.join(', '), num: () => `${fmt(q.a)} ${q.u}`, oku: () => `${fmt(q.a)} ${q.u}`, sira: () => 'sıra yukarıda', sim: () => '' }[q.t]();
  const foot = $('.foot'), hint = !ok && (q.t === 'num' || q.t === 'oku') ? clue(C.ans, q.a) : '';
  foot.className = 'foot ' + (ok ? 'good' : 'bad');
  foot.innerHTML = `<div class="fb">${mascot(ok ? 'iyi' : 'kotu')}<div><h2>${ok ? `Doğru, +${XP_Z[q.z]} XP` : 'Yanlış'}</h2>${ok ? '' : `${right ? `<p><b>Doğru cevap: ${tx(right)}</b></p>` : ''}${hint ? `<p>${tx(hint)}</p>` : ''}<p>${tx(q.e)}</p>`}<code>${tx(q.f)}</code></div></div><button class="btn" id="nx">Devam</button>`;
  if (q.t === 'sim' && C.miss) $('.fb h2').insertAdjacentHTML('afterend', `<p>${tx(C.miss)}</p>`);
  $('#nx').onclick = () => C.queue.length ? question() : finish();
  $('#nx').focus({ preventScroll: true });
}

function finish() {
  const t = dayNum(), wrong = C.lid ? C.total - C.right : 0, fresh = BADGES.filter((b, i) => !C.had[i] && b[2](S));
  app.innerHTML = `<main class="scr"><div class="end">${mascot(wrong < 3 ? 'iyi' : 'normal')}<h1 tabindex="-1">${!C.lid ? (C.practice ? 'Antrenman tamam' : 'Tekrar temizlendi') : wrong ? 'Ders tamam' : 'Hatasız bitirdin'}</h1>
  <dl class="tbl"><dt>Kazanılan</dt><dd>${S.xp - C.xp0} XP</dd>${C.lid ? `<dt>Doğru</dt><dd>${C.right} / ${C.total}</dd>` : ''}<dt>Bugün</dt><dd>${todayXp(S, t)} / ${GOAL} XP</dd><dt>Seri</dt><dd>${liveStreak(S, t)} gün</dd>${fresh.map(b => `<dt>Yeni rozet</dt><dd>${b[0]}</dd>`).join('')}</dl></div></main>
  <div class="foot">${wrong ? '<button class="btn" data-go="tekrar-coz">Yanlışları tekrar et</button><button class="btn alt" data-go="ana">Derslere dön</button>' : '<button class="btn" data-go="ana">Derslere dön</button>'}</div>`;
  focusTop();
}

/* ---------- Yönlendirme: Android geri tuşu hash geçmişiyle çalışır ---------- */
function route() {
  const h = location.hash.slice(1), d = /^(ders|konu)-(.+)$/.exec(h), l = d && LESSONS.find(x => x.id === d[2]);
  if (shown) scrollMem[shown] = scrollY;
  shown = null;
  // konu-: önce konu anlatımı; düğmesi ders-'e gider, geri tuşu anlatıma döner.
  if (l && unlocked(l)) return d[1] === 'konu' && l.k ? intro(l) : start(l.qs.map((_, i) => `${l.id}-${i + 1}`), l.id);
  if (h === 'tekrar-coz' && S.wrong.length) return start(S.wrong, null);
  const pz = /^pratik-([123])$/.exec(h);
  if (pz) { const ids = byZ(+pz[1]), p = shuffle(ids.length).slice(0, 8); return start(p.map(i => ids[i]), null, true); }
  C = null;
  shown = h === 'profil' ? 'profil' : h.startsWith('tekrar') ? 'tekrar' : 'ana';
  app.innerHTML = { profil: profile, tekrar: review, ana: home }[shown]();
  if (shown === 'profil') { bindReminder(); bindBackup(); }
  focusTop(scrollMem[shown] || 0);
  // Uygulama yeni açıldığında sıradaki ders ekranın ortasına gelir.
  if (shown === 'ana' && !(shown in scrollMem) && S.xp) $('.node.next')?.scrollIntoView({ block: 'center' });
}
app.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (!b || b.disabled) return;
  if ('#' + b.dataset.go === location.hash) route(); else location.hash = b.dataset.go;
});
addEventListener('hashchange', route);
// iOS klavyesi sayfayı küçültmez; alt çubuğu klavyenin üstüne taşı. Android'de fark 0 çıkar.
const vv = window.visualViewport;
if (vv) vv.onresize = vv.onscroll = () => document.documentElement.style.setProperty('--kb', (vv.scale > 1.01 ? 0 : Math.max(0, Math.round(innerHeight - vv.height - vv.offsetTop))) + 'px');
route();
shareState();
if (S.rem) armReminder(false); // kayıt silinmişse açılışta yeniden kurar
</script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
navigator.storage?.persist?.().catch(() => {}); // tarayıcıdan kaydı silmemesini ister
</script>
